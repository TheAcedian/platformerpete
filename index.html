// ---- UPPERCUT PACING (2026-11-15): "same speed beats as the stomp" = slow heavy rise, held top, quicker drop ----
// ONE mechanism: the move clock tt (MOVE_TIMING.uppercut, all-linear) runs evenly 0..1 and upperRemap() carries the beats.
// The pose shapes (UPPER_REV_KEYS etc.), comboLift and the lift window are all read at s = upperRemap(tt), so every shape keeps its
// meaning (s .46 = fully loaded, s ~.71 = apex, s .96 = touchdown); only WHEN they happen changes. HAND_T is already in tt.
const UPPER_PACE_SCALE = 1.0;      // <-- ONE knob: 1.0 = about 1750 ms total (1.3x the old 1350). 1.2 = slower, 0.8 = faster.
const UPPER_TOTAL_MS_BASE = 1750;  // BODY length at UPPER_PACE_SCALE 1.0 (ms): dip, rise, hold, drop, landing. Old uppercut: 600 x 1.5 x 1.5 = 1350.
// CRUNCH TAIL (2026-11-15): after the body lands (pose == f0) the move clock keeps running for UPPER_TAIL_MS so the CRUNCH graphic and the dust clouds have time to read
// (stages: pop, expand, billow, drift away). The body keeps exactly its old ms (bt = tt / UPPER_BODY_FRAC); the hit window below is rescaled to the same ms.
const UPPER_TAIL_MS = 350;         // <-- TWEAK ME: extra ms for the CRUNCH + clouds (0 = none). Total = 1750 + 350 = 2100 ms.
// FINGER-CURL SLOW-DOWN (2026-11-15): the load pause (design bt .18-.30, where the fingers curl pinky first and the thumb wraps last) lasts UPPER_CURL_SLOW x longer in real time.
// Only that beat grows (210 ms -> 252 ms at 1.2). Every other beat keeps its exact ms; the move just gets the extra time added. All beats, HAND_T windows, remap knots and
// step stops stay written in the old "design" body clock; upperDesignBt()/upperTTfromDesign() convert to/from the real move clock.
const UPPER_CURL_SLOW = 1.2;       // <-- TWEAK ME: 1.0 = the old curl speed, 1.2 = 20 percent slower, 1.5 = 50 percent slower
// HIT-STOP (2026-11-15 impact pass): at the contact the body and fist freeze for this many ms of real time (the classic fighting-game hit pause) while the flash, rings, lines, burst and chips keep
// animating, then the move carries on. The time is ADDED to the move length (about +70 ms). 0 = off (the move is then exactly the old length and the extra contact step stop is dropped).
const UPPER_HITSTOP_MS = 70;      // <-- TWEAK ME: 60-80 reads as a hit pause; 0 = off
const UPPER_CURL_A = 0.18, UPPER_CURL_B = 0.30;   // the curl beat in design bt (end of the dip .. thumb wrapped)
const UPPER_DESIGN_MS = UPPER_TOTAL_MS_BASE*UPPER_PACE_SCALE;                          // body ms with no curl slow-down (1750)
const UPPER_CURL_EXTRA_MS = (UPPER_CURL_B-UPPER_CURL_A)*UPPER_DESIGN_MS*(UPPER_CURL_SLOW-1);   // added ms (42 at 1.2)
const UPPER_BODY_MS = UPPER_DESIGN_MS + UPPER_CURL_EXTRA_MS;
const UPPER_TOTAL_MS = UPPER_BODY_MS + UPPER_TAIL_MS;   // the move WITHOUT the hit-stop (the old-clock length; the body and tail slices below are measured on it)
const UPPER_BODY_FRAC = UPPER_BODY_MS / UPPER_TOTAL_MS;   // share of the move clock tt taken by the body (the rest is the tail)

}
const UPPER_HS = Math.max(0,UPPER_HITSTOP_MS), UPPER_MOVE_MS = UPPER_TOTAL_MS + UPPER_HS;   // real move length incl. the hit-stop (2170 ms at 70)
const UPPER_HS_C_MS = upperTTold(HAND_T.impactBt) * UPPER_TOTAL_MS;                          // contact instant in real ms from the start (the hold is UPPER_HS_C_MS .. + UPPER_HS)
function upperHsIn(tt){ const r=tt*UPPER_MOVE_MS, c=UPPER_HS_C_MS; return (r<=c ? r : r<=c+UPPER_HS ? c : r-UPPER_HS)/UPPER_TOTAL_MS; }   // move clock tt (with the hold) -> old clock (body frozen across the hold)
function upperTTfromDesign(d){ const ms=upperTTold(d)*UPPER_TOTAL_MS; return (ms<=UPPER_HS_C_MS+1e-9 ? ms : ms+UPPER_HS)/UPPER_MOVE_MS; }   // design body clock bt -> move clock tt (the contact bt maps to the START of the hold)

function upperFxBt(tt){ const r=tt*UPPER_MOVE_MS, c=UPPER_HS_C_MS; return r<=c ? upperDesignBt(upperHsIn(tt)/UPPER_BODY_FRAC) : HAND_T.impactBt + (r-c)/UPPER_DESIGN_MS; }   // FX clock (design bt): equals the body clock until the contact, then runs in real time THROUGH the hold, so the effects run UPPER_HS ms ahead of the body afterwards
function upperHitP(fx){ const T=HAND_T; return (fx>T.crunchStart && fx<T.crunchEnd) ? (fx-T.crunchStart)/(T.crunchEnd-T.crunchStart) : 0; }   // impact-effect progress 0..1 on the FX clock
// Step grid for the uppercut ONLY (explicitly allowed: the other moves stay at STEP_FRAME_COUNT = 12). Body-clock stops bt; the pose is read at tt = bt*UPPER_BODY_FRAC.
//  f0 rest | f1 f2 dip: hand appears, open, growing, arm low/back | f3 loaded, open palm full size (pause starts) | f4..f8 pause: pinky, ring, middle, index, thumb curl (fist done at f8) |

//  f17 touchdown | f18 landing end (hand normal, pose == f0) | f19 final (clouds gone).
// 2026-11-15 impact pass: ONE extra stop at the contact (bt .57 = HAND_T.impactBt) sits INSIDE the hit-stop hold (body frozen at the top, flash/rings/lines/burst/chips half a hold in), so the hit-stop + flash can be seen.
// It is dropped when UPPER_HITSTOP_MS = 0. That makes 21 stops: f0..f11 as before | f12 CONTACT (hold) | f13 first stop after (was f12) ... f20 final.
const UPPER_STEP_BT = [0, 0.08, 0.12, 0.18, 0.204, 0.228, 0.252, 0.276, 0.30, 0.40, 0.50, 0.56, ...(UPPER_HITSTOP_MS>0 ? [HAND_T.impactBt] : []), 0.585, 0.625, 0.68, 0.75, 0.82, 0.91, 1.00, 1.20];
const UPPER_STEP_FRAMES = UPPER_STEP_BT.length;
const UPPER_BEATS = {              // beat boundaries as shares of the move clock tt (0..1)
  dipEnd:  0.18,                   // DIP/LOAD   0 -> .18   deep crouch (18%)
  riseEnd: 0.45,                   // RISE       .18 -> .45 heavy ease-in-out like the stomp lift (27%)
  holdEnd: 0.75,                   // APEX HOLD  .45 -> .75 held at the top, very small drift (30%); open palm, curl, HIT live here
  dropHit: 0.91,                   // DROP       .75 -> .91 fast power-in fall (16% = 0.59x the rise); then LANDING .91 -> 1 (settle to f0 stance)
};
// remap knots: [tt (move clock), s (shape time), slope ds/dtt]. Monotone cubic Hermite = one continuous velocity curve, no pops.
const UPPER_REMAP_KNOTS = [
  [0.00, 0.00, 0.00],   // start at rest
  [0.18, 0.46, 0.00],   // dip ends: fully LOADED (shape s .46), stopped = the cock-back
  [0.30, 0.46, 0.00],   // LOAD PAUSE .18-.30 (12 percent): the body is frozen (flat shape time) while the fingers curl into the fist; the old apex hold donated these 12 percent
  [0.57, 0.66, 0.15],   // top of the rise: the punch connects (impact), nearly stopped (heavy ease-in-out, like the stomp lift)
  [0.75, 0.74, 0.15],   // end of the (now shorter) apex hold: s .66 -> .74 is the small drift around the apex (s .71)
  [0.91, 0.96, 0.90],   // touchdown (shape s .96), arriving fast: power-in drop

function upperRemap(tt){

    kHip=lerp(-6,10,k); kKnee=lerp(-8,-70,k); sHip=lerp(6,10,k); sKnee=lerp(-12,-26,k); lean=lerp(4,2,k); tw=lerp(0,-30,k); yaw=lerp(70,116,k); st=lerp(1,0.97,k); arm=lerp(0,10,k); by=lerp(0,2,k); }
  else if(tt<0.44){const k=ease((tt-0.24)/0.20);     // (b) CHAMBER: knee lifts HIGH across the body, heel drawn to the hip (coiled spring)
    kHip=lerp(10,46,k); kKnee=lerp(-70,-138,k); sHip=lerp(10,8,k); sKnee=lerp(-26,-20,k); lean=lerp(2,-6,k); tw=lerp(-30,-20,k); yaw=lerp(116,120,k); st=lerp(0.97,0.98,k); arm=lerp(10,18,k); by=lerp(2,0,k); }
  else if(tt<0.62){const k=1-(1-(tt-0.44)/0.18)*(1-(tt-0.44)/0.18);  // (c) STRIKE (ease-out): HEEL fires out, leg near-HORIZONTAL to HEAD height, big BACK lean, fully side-on
    kHip=lerp(46,94,k); kKnee=lerp(-138,-4,k); sHip=lerp(8,2,k); sKnee=lerp(-20,-8,k); lean=lerp(-6,-30,k); tw=lerp(-20,10,k); yaw=lerp(120,118,k); st=lerp(0.98,1.14,k); arm=lerp(18,-16,k); by=lerp(0,-2,k); }
  else if(tt<0.80){const k=ease((tt-0.62)/0.18);     // (d) RETRACT: pull the leg back into the high chamber, torso rights
    kHip=lerp(94,42,k); kKnee=lerp(-4,-120,k); sHip=lerp(2,6,k); sKnee=lerp(-8,-18,k); lean=lerp(-30,-6,k); tw=lerp(10,-10,k); yaw=lerp(118,108,k); st=lerp(1.14,1.03,k); arm=lerp(-16,4,k); by=lerp(-2,0,k); }
  else{const k=ease((tt-0.80)/0.20);                 // (e) UN-PIVOT: rotate back to the neutral side guard, feet re-square
    kHip=lerp(42,-6,k); kKnee=lerp(-120,-8,k); sHip=6; sKnee=lerp(-18,-12,k); lean=lerp(-6,4,k); tw=lerp(-10,0,k); yaw=lerp(108,70,k); st=lerp(1.03,1,k); arm=lerp(4,0,k); by=0; }
  return P({ view:'side', yaw, lean, twist:tw, bodyY:by, _stretch:st, _strikeLeg:'far', _support:'near',

// 3) GIANT-FOOT STOMP (Battletoads finisher) — lift the giant boot HIGH, a half-beat toe TWINKLE
//    hang, then DRIVE it straight down with a heavy squash. _bigFoot scales the boot; _twinkle
//    wiggles the toes during the hold. Support leg (near) planted the whole time; body-to-feet.
// 3) GIANT-FOOT STOMP (Battletoads finisher) — REWORK 4.0 per spec: a 5-phase comedy finisher.
//    (a) LIFT: foot clearly LEAVES the ground, knee rises high toward the chest, foot ~hip level —
//    NO enlargement yet (the player sees a clean wind-up). (b) ENLARGE: only once the foot is at
//    peak height does the boot grow — smoothly — into the comically oversized detailed foot.
//    (c) HANG: a comedic half-beat hold, toes twinkle ("oh no..."). (d) IMPACT: drive it down hard
//    & flat (camera shake etc. handled in render on the index-2 window). (e) RECOVER: boot shrinks,
//    balance returns to guard. `big` gates the enlargement STRICTLY to after the foot is airborne.
// STOMP STARTING STANCE = the WAVE-IDLE (poseIdleDir('S')) lower body, verbatim, so the stomp
// opens standing exactly like the friendly front wave — NOT the old kick stance. These are the
// EXACT waist-down values poseIdleDir('S') uses at rest (breath/sway stripped, which are ~0 at the
// resting frame): planted square (hipShift 0, tilt 0, front yaw), legs APART each on its own side.
// The STOMP (far) leg lifts FROM farHip=10/farKnee=-4; the SUPPORT (near) leg stays pinned at
// nearHip=-10 (its own side) the whole move so the two legs never cross. See poseIdleDir('S').
const STOMP_START = { yaw:0, nearHip:-10, nearKnee:-4, farHip:10, farKnee:-4 };  // wave-idle waist-down
// STOMP_USE_REVISED: the revised stomp is APPROVED and LOCKED (user: "it looks good, lock it in", 2026-10-09). Keep true; poseStompV1 stays only as a fallback (false = old stomp). Locked archive: archive files/CharacterLab5.0_stomp-LOCKED_2026-10-09.html

function poseStompV1(tt){ let kHip,kKnee,lean,by,st,big,twk,sKnee,arm,yaw;

  // foot toward the camera. FRAME 1 (tt=0) is the WAVE-IDLE stance (yaw 0): leg at NORMAL Pete
  // angle (farHip 10 / farKnee -4), only the new code-drawn foot graphic sits where his foot
  // normally rests. The STOMPING leg then lifts; the SUPPORT (near) leg holds the idle angle.
  let crack=0, tilt=0;   // tilt: 1 = foot tilted UP (toes up, twinkle); 0 = FLAT (stomped down)
  // SUPPORT (near) leg: pinned on its OWN side the whole move (never crosses the stomping leg).
  const nHip = STOMP_START.nearHip;
  // ===== EASY-TWEAK PHASE TIMINGS (normalized 0..1 over KICKS[2].dur ms) =====
  // The user asked for a SLOWER lift and MORE hesitation (hang) at the apex, with the slam still
  // FAST so the contrast reads. Change these window edges to retune; keep them in ascending order.
  const LIFT_END   = 0.30;   // (a) LIFT ends here — WIDER window = slower rise (was 0.20)
  const ENLARGE_END= 0.42;   // (b) foot finishes growing to giant
  const HANG_END   = 0.68;   // (c) apex hang/wiggle ends — WIDER window = more hesitation (was 0.54)
  const IMPACT_END = 0.80;   // (d) slam ends — NARROW window (0.12) = FAST slam, faster than the lift
  //  (e) RECOVER runs IMPACT_END..1.0

  // ===== EASY-TWEAK LIFT POSE KNOBS (user: knee HIGHER + IN/kneecap-showing, whole foot HIGHER) =====
  // The STOMP (far) leg lifts by RAISING THE THIGH and TUCKING THE KNEE. In this rig farHip is the
  // thigh angle measured from straight-DOWN (sin => +x forward, cos => +y down):
  //   farHip 0..90   = thigh swings forward & still points partly DOWN (knee low, out in front).
  //   farHip  >90    = thigh points UP (cos goes negative) => the KNEE RISES toward the body, while
  //                    sin stays large & POSITIVE so the knee X stays on the far leg's OWN side
  //                    (never crosses the pinned support leg => no crossover). Going past 90 is what
  //                    reads as "knee up & IN" instead of the old "chicken-wing kicked out forward".
  // (1) KNEE RAISE: how high the thigh comes up at the apex. 70 (old) = thigh ~horizontal, knee out
  //     front; 108 = thigh past vertical => knee lifted HIGH and IN toward the chest.
  const KNEE_RAISE_HIP = 108;   // <-- TWEAK ME: far-leg hip at apex (bigger => knee higher & more in; was 70)
  // (2) KNEE BEND (tuck): far-leg knee angle at apex. The shin's absolute angle = farHip+farKnee;
  //     with farHip 108 a bend of -118 => shin ~ -10deg (hangs almost straight down & slightly back),
  //     tucking the calf so the FRONT of the knee (kneecap) faces the viewer instead of the leg's side.
  const KNEE_BEND = -118;       // <-- TWEAK ME: far-leg knee tuck at apex (was -104); more negative = deeper tuck
  // (3) KNEE-IN YAW: a touch more 3/4 turn at the apex angles the raised knee/kneecap toward the
  //     camera so it reads front-on rather than side-on. (Grounded start/end stay yaw 0 = wave-idle.)
  const KNEE_IN_YAW = 48;       // <-- TWEAK ME: apex body yaw (was 40); more => kneecap faces camera more
  // (4) LIFT HEIGHT: how much the whole body/foot is picked UP off the ground at the apex. More
  //     negative => the entire foot rides HIGHER before the slam (and therefore drops farther).
  const LIFT_BODY_Y = -11;      // <-- TWEAK ME: body raise at apex (was -7); more negative = foot higher off ground

  // STOMP (far) leg hip STAYS POSITIVE through the whole lift/slam — it rises by raising the THIGH
  // (farHip up toward/past vertical) and tucking the KNEE, but its hip never swings negative (across
  // the body centerline), so it never crosses the pinned support leg. Start = wave-idle farHip 10 / farKnee -4.
  if(tt<LIFT_END){const k=ease(ease(tt/LIFT_END));   // (a) LIFT (no growth): SOFTER ease (double-eased) so the rise feels slow + heavy
    kHip=lerp(STOMP_START.farHip,KNEE_RAISE_HIP,k); kKnee=lerp(STOMP_START.farKnee,KNEE_BEND,k); lean=lerp(0,-4,k); by=lerp(0,LIFT_BODY_Y,k); st=lerp(1,1.06,k);
    big=0; twk=0; sKnee=lerp(STOMP_START.nearKnee,-14,k); arm=lerp(0,26,k); tilt=lerp(0,1,k); yaw=lerp(0,KNEE_IN_YAW,k); }   // front -> 3/4 as it rolls up (side->sole) from flat
  else if(tt<ENLARGE_END){const k=ease((tt-LIFT_END)/(ENLARGE_END-LIFT_END));     // (b) ENLARGE at peak: foot grows smoothly to full giant while held high
    kHip=KNEE_RAISE_HIP; kKnee=KNEE_BEND; lean=-4; by=LIFT_BODY_Y; st=1.07;
    big=k; twk=0; sKnee=-14; arm=26; tilt=1; yaw=KNEE_IN_YAW; }                   // held up at full tilt, 3/4, knee high & in
  else if(tt<HANG_END){                              // (c) COMEDIC HANG + TOE TWINKLE + gleam ("oh no...") — LONGER hesitation
    kHip=KNEE_RAISE_HIP; kKnee=KNEE_BEND; lean=-4; by=LIFT_BODY_Y; st=1.07;
    big=1; twk=Math.sin((tt-ENLARGE_END)*70); sKnee=-14; arm=26; tilt=1; yaw=KNEE_IN_YAW; }  // tilted up, toes wiggling, knee high & in
  else if(tt<IMPACT_END){const k=1-(1-(tt-HANG_END)/(IMPACT_END-HANG_END))*(1-(tt-HANG_END)/(IMPACT_END-HANG_END));  // (d) IMPACT (ease-out): drive the giant foot straight down, FLAT — FAST
    kHip=lerp(KNEE_RAISE_HIP,STOMP_START.farHip,k); kKnee=lerp(KNEE_BEND,STOMP_START.farKnee,k); lean=lerp(-4,10,k); by=lerp(LIFT_BODY_Y,26,k); st=lerp(1.07,0.76,k);
    big=lerp(1,0.74,k); twk=0; sKnee=lerp(-14,-4,k); arm=lerp(26,-14,k); crack=k; tilt=lerp(1,0,k); yaw=lerp(KNEE_IN_YAW,10,k); }  // rotates UP->FLAT + back toward front as it slams; GROUND SHATTER
  else{const k=ease((tt-IMPACT_END)/(1-IMPACT_END)); // (e) RECOVER: squash settles, foot back to the wave-idle stance, re-square
    kHip=STOMP_START.farHip; kKnee=STOMP_START.farKnee; lean=lerp(10,0,k); by=lerp(26,0,k); st=lerp(0.76,1,k);
    big=lerp(0.74,0,k); twk=0; sKnee=STOMP_START.nearKnee; arm=lerp(-14,0,k); crack=1-k*0.4; tilt=0; yaw=lerp(10,0,k); }  // settles back to wave-idle stance, shatter fading
  // STANCE: front (yaw 0) at the grounded start/end = the wave-idle stance; eases to a 3/4 (yaw ~40)
  // only while the foot is up so the giant sole angles toward the camera. The SUPPORT (near) leg is
  // PINNED at nearHip=-10 (its own side) the whole move; the STOMP (far) leg hip stays POSITIVE —
  // so the two legs are OPEN/APART start->slam->settle and never cross. Facing: D/S read rightward
  // (+x); A handled by currentPose() stamping _mirror when lastDir==='A'.
  return P({ view:'turn', yaw, turn:0.5, lean, bodyY:by, _stretch:st, _strikeLeg:'far', _support:'near',
    _bigFoot:big, _twinkle:twk, _footTilt:tilt, _plant:true, _groundCrack:crack, _stomp:true,   // giant foot + twinkle + tilt; cracks on impact; _stomp => cel foot drawn ALL phases (no pop)
    farHip:kHip, farKnee:kKnee, nearHip:nHip, nearKnee:sKnee,
    nearSh:GUARD.nearSh+arm, nearEl:GUARD.nearEl, farSh:GUARD.farSh-arm, farEl:GUARD.farEl }); }

// ===== REVISED STOMP (user frame recording "kick-2": edited f2 + f3 apex) =====
// HOW THIS IS BUILT (the reusable pattern for any recorded fix): V1's motion is kept as the BASE, and
// each frame the user dragged in the frame recorder becomes a small POSE-DELTA key (pose-param
// change, fitted with the lab's own solve() by tools/fit-recording.js + tools/jobs/stomp-kick2-rev1.json).
// STOMP_REV_KEYS is a correction TRACK: deltas are eased between keys (zero slope at every key), faded
// in from 0 at f0 (~25% by f1), held through the hang, and faded out during the slam. Next recording:
// re-run the tool, paste the new deltas into the keys. Pose params, not post-solve offsets, so it works
// in live play AND step mode. Same phase windows / step stops / passthrough linear time as V1.
// Fit (pete2, facing right): f3 apex kneeL err 0.83, kneeR 0.57, footL 0.45 units; f2 kneeL 2.06,
// kneeR 1.96 (f2's knee drag left the foot in place, which rigid bones cannot fully match).
const STOMP_V1_APEX = { bodyY:-11, hipShift:0, yaw:48, twist:0, nearHip:-10, farHip:108, farKnee:-118 };  // old apex (reference)
const STOMP_REV_KEYS = [   // <-- TWEAK ME: recorded corrections (delta added to the V1-shaped base at that tt)
  { tt:0.24, tag:'kick-2@f2', d:{ bodyY:-1.43, hipShift:-4.0, yaw:16, twist:-18, nearHip:6, farHip:5.35,  farKnee:10.74 } },
  { tt:0.30, tag:'kick-2@f3', d:{ bodyY:-2.14, hipShift:-3.5, yaw:16, twist:-18, nearHip:6, farHip:13.02, farKnee:6.45 } },
];
// correction track value at tt (lift + apex only; the hang holds the last key, the slam fades it).
function stompRevDelta(tt){
  const K=STOMP_REV_KEYS, out={bodyY:0,hipShift:0,yaw:0,twist:0,nearHip:0,farHip:0,farKnee:0};
  const add=(d,w)=>{ for(const k in out) out[k]+=(d[k]||0)*w; };
  if(tt<=K[0].tt){ const v=clamp(tt/K[0].tt,0,1); add(K[0].d, ease(v)*ease(v)); return out; }   // ~25% at f1
  for(let i=1;i<K.length;i++){ if(tt<=K[i].tt){ const w=ease((tt-K[i-1].tt)/(K[i].tt-K[i-1].tt));
      add(K[i-1].d,1-w); add(K[i].d,w); return out; } }
  add(K[K.length-1].d,1); return out;
}
const STOMP_HANG_BOB = 0.9;     // hang drift: body rise (px) at mid-hang (keeps the hold alive, not frozen)
const STOMP_HANG_SETTLE = 1.6;  // hang drift: extra stomp-knee tuck (deg) at mid-hang
const STOMP_SETTLE_OVERSHOOT = 8;   // settle: size of the single small dip past rest (0 = none)
// STOMP_LEG_FRONT_RANGES: LEG DRAW ORDER (layering only, no pose/timing change). Inside these tt ranges the NEAR (right,
// support) leg is drawn IN FRONT of the FAR (left, stomping) leg, so the seam between the legs reads right-leg-in-front,
// like the idle stance. Outside them the stomping leg is redrawn on top as before. Step stops: f0 0, f1 .12, f2 .24, f3 .30,
// f4 .42, f5 .55, f6 .68, f7 .74, f8 .80, f9 .86, f10 .93, f11 1. Default = f0-f3 and f8-f11. Change the numbers to move the swap.
const STOMP_LEG_FRONT_RANGES = [ [0, 0.30], [0.80, 1] ];   // <-- TWEAK ME: [tt from, tt to] (inclusive)
function stompNearLegFront(tt){ for(const r of STOMP_LEG_FRONT_RANGES) if(tt>=r[0]-1e-6 && tt<=r[1]+1e-6) return true; return false; }
function poseStomp(tt){
  if(!STOMP_USE_REVISED) return poseStompV1(tt);
  const LIFT_END=0.30, ENLARGE_END=0.42, HANG_END=0.68, IMPACT_END=0.80;
  const smoother=u=>{u=clamp(u,0,1);return u*u*u*(u*(u*6-15)+10);};   // 0 slope AND 0 accel at both ends
  const V=STOMP_V1_APEX, S=STOMP_START, D=stompRevDelta(Math.min(tt,LIFT_END));
  // A = corrected apex = V1 apex + last correction key
  const A={}; for(const key in V) A[key]=V[key]+(D[key]||0);
  let kHip,kKnee,lean,by,st,big=0,twk=0,sKnee,arm,yaw,hs=0,tw=0,nHip,crack=0,tilt=0;
  if(tt<LIFT_END){                                   // (a) LIFT: same double-ease as V1 (zero velocity at the apex) + correction track
    const k=ease(ease(tt/LIFT_END));
    kHip=lerp(S.farHip,V.farHip,k)+D.farHip; kKnee=lerp(S.farKnee,V.farKnee,k)+D.farKnee;
    lean=lerp(0,-4,k); by=lerp(0,V.bodyY,k)+D.bodyY; st=lerp(1,1.07,k);
    sKnee=lerp(S.nearKnee,-14,k); arm=lerp(0,26,k); tilt=lerp(0,1,k);
    yaw=lerp(0,V.yaw,k)+D.yaw; hs=D.hipShift; tw=D.twist; nHip=S.nearHip+D.nearHip;
  } else if(tt<HANG_END){                            // (b)+(c) ENLARGE + HANG: apex held with a tiny slow drift
    const h=(tt-LIFT_END)/(HANG_END-LIFT_END), d=(1-Math.cos(h*Math.PI*2))/2;   // 0 -> 1 -> 0, zero slope at both ends
    kHip=A.farHip; kKnee=A.farKnee+STOMP_HANG_SETTLE*d; lean=-4; by=A.bodyY-STOMP_HANG_BOB*d; st=1.07;
    sKnee=-14-0.8*d; arm=26; tilt=1; yaw=A.yaw; hs=A.hipShift; tw=A.twist; nHip=A.nearHip;
    big = tt<ENLARGE_END ? ease((tt-LIFT_END)/(ENLARGE_END-LIFT_END)) : 1;
    twk = tt<ENLARGE_END ? 0 : Math.sin((tt-ENLARGE_END)*70);
  } else if(tt<IMPACT_END){                          // (d) SLAM: k=u^2 = starts from rest (no kink), lands at full speed
    const u=(tt-HANG_END)/(IMPACT_END-HANG_END), k=u*u;

    big=lerp(1,0.74,k); sKnee=lerp(-14,-4,k); arm=lerp(26,-14,k); crack=k; tilt=lerp(1,0,k); yaw=lerp(A.yaw,10,k);
    hs=lerp(A.hipShift,0,k); tw=lerp(A.twist,0,k); nHip=lerp(A.nearHip,S.nearHip,k);

    kHip=S.farHip; kKnee=S.farKnee; lean=lerp(10,0,q); st=lerp(0.76,1,q); hs=0; tw=0; nHip=S.nearHip;
    by=26*(1-k)-STOMP_SETTLE_OVERSHOOT*s*s*s*sn*sn;  // the s^3*sin^2 term = ONE late small dip, 0 slope at s=1
    big=lerp(0.74,0,k); sKnee=S.nearKnee; arm=lerp(-14,0,q); crack=1-k*0.4; tilt=0; yaw=lerp(10,0,q);
  }
  return P({ view:'turn', yaw, turn:0.5, lean, bodyY:by, hipShift:hs, twist:tw, _stretch:st, _strikeLeg:'far', _support:'near',
    _bigFoot:big, _twinkle:twk, _footTilt:tilt, _plant:true, _groundCrack:crack, _stomp:true, _legFront:stompNearLegFront(tt),
    farHip:kHip, farKnee:kKnee, nearHip:nHip, nearKnee:sKnee,
    nearSh:GUARD.nearSh+arm, nearEl:GUARD.nearEl, farSh:GUARD.farSh-arm, farEl:GUARD.farEl }); }

  const su=row.startup*k, ac=row.active*k, rc=row.recovery*k;
  const total=su+ac+rc;
  return { dur:total,
    startup:{ms:su, ttEnd:su/total},
    active:{ms:ac, ttEnd:(su+ac)/total},
    recovery:{ms:rc, ttEnd:1},

const DBL_WIN    = 180;    // ms. 2nd press within this of the 1st = "double" (jab -> cross slot, front -> side kick)
const BUFFER_WIN = 220;    // ms. a press during a move is remembered this long and fired at the cancel point
// ms. key still held this long after keydown = HOLD special (uppercut / stomp). Lab = 170. Touch taps last 60-150 ms, so a touch screen
// gets a little more room so a normal quick tap can never start the 2.2 s uppercut. Evaluated at call time (TOUCH is defined later).

// Normalized move clock for an entry (replaces the lab's GSAP timeline: same segments, same eases, plain JS).
// GSAP power2 = cubic, power3 = quartic. Stomp is passthrough (linear in time).
function _moveEase(n,p){ p=p<0?0:p>1?1:p;
  switch(n){ case 'power3.out': return 1-Math.pow(1-p,4); case 'power2.in': return p*p*p; case 'power2.out': return 1-Math.pow(1-p,3); default: return p; } }
function moveClockAt(e,ms){
  if(e.passthrough) return clamp(ms/e.dur,0,1);
  ms=Math.max(0,ms);
  const s=e.startup, a=e.active, r=e.recovery;
  if(ms<s.ms) return s.ttEnd*_moveEase(e.easeIn, s.ms>0?ms/s.ms:1);
  ms-=s.ms;
  if(ms<a.ms) return s.ttEnd+(a.ttEnd-s.ttEnd)*_moveEase(e.easeActive, a.ms>0?ms/a.ms:1);
  ms-=a.ms;
  return a.ttEnd+(1-a.ttEnd)*_moveEase(e.easeOut, r.ms>0?ms/r.ms:1);

function petePose(o){
  // ---- EXPLICIT POSE OVERRIDES (used by cutscene/title where there's no live input) ----
  // These three are the named animation styles, each self-driving off perf2 so they work with
  // or without a `pete` game object (title screen draws before pete exists):
  //   o.walkDir  → "D-forward movement animation" (lab side-walk, legs cycling)
  //   o.guard    → "guard idle animation" (lab boxing high-guard, fists up, standing)
  //   o.wave     → "wave idle animation" (lab front-facing friendly wave)
  if(o.walkDir){                              // forced walk (title walk-in). Phase advances off perf2.
    const ph = (perf2*0.0013)%1;              // slower, unhurried stroll cadence (was 0.0019)
    return poseWalkDir(o.walkDir, ph, 0.8);
  }
  if(o.wave)  return poseIdleDir('S', (perf2%3200)/3200);   // wave idle
  if(o.guard) return poseIdleDir('D', (perf2%3200)/3200);   // guard idle (fists up)
  if(o.hipsYell) return poseHipsYell((perf2%2400)/2400);    // stern hands-on-hips yell

  // guard: on title screen pete is not yet initialized — safe idle fallback
  if(!pete) return poseIdleDir('D', (Date.now()%3200)/3200);
  // 1) attack in progress
  if(pete.attack && pete.attack.active){
    const set=(pete.attack.set==='punch'?COMBO:KICKS)[pete.attack.index];
    const tt=moveTT();                       // lab move clock (eased segments + uppercut hit-stop remap; stomp = linear)
    const ap=set.pose(tt); ap._atkTT=tt;
    const lf=set.lift?set.lift(tt):0; if(lf) ap._liftU=lf/LAB_SCALE;   // uppercut = a real jump (draw-only offset)
    return ap;
  }
  // 2) airborne
  if(o.air!==undefined){ return poseJumpAir(-pete.vy); }
  // 3) walk vs idle — EXACT COPY of the CharacterLab logic.
  // ONE active direction chosen by fixed PRIORITY (Right > Left > Up > Down). No velocity is
  // consulted at all — only which key is currently held. This is the key: velocity (vx/vdepth)
  // decays and jitters around thresholds, which made the view flip between D/S and idle frame to
  // frame. The lab never looks at velocity for the pose; it reads the held key, period.
  const kR = kHeldR();
  const kL = kHeldL();
  const kU = kHeldU();
  const kD = kHeldD();
  let dir = null;
  if(kR)      dir='D';   // right  → side view (right)
  else if(kL) dir='A';   // left   → side view (mirrored)
  else if(kU) dir='W';   // up     → walk away  (back view)
  else if(kD) dir='S';   // down   → walk toward (front view)
  if(dir){
    pete.lastDir = dir;
    // Advance the walk phase LOCALLY here off perf2 so the stride never stalls — this makes the
    // S (and W) walk fully self-driving: as long as the key is held we are in poseWalkDir, and
    // the phase keeps cycling regardless of pete.walk / velocity. No idle can ever interleave.
    const ph = (perf2 * 0.0022) % 1;
    const spd = (dir==='D'||dir==='A')
      ? clamp(Math.abs(pete.vx)/MOVE, 0.2, 1.0)
      : 0.9;   // steady depth stride (W/S)
    // remember the exact walk frame we're on, so a release can FREEZE here (no snap to idle)
    pete.lastWalkPh = ph; pete.lastWalkSpd = spd; pete.walkReleaseAt = null;
    return jabIdleBlend(poseWalkDir(dir, ph, spd));   // eased in from the jab's last pose for 200 ms after a jab
  }
  // 4) no key held. HOLD-FREEZE: for a beat after releasing a walk, keep the LAST walk frame in
  //    the SAME direction (frozen mid-stride) — no snap to a different pose, so no flicker. This
  //    is especially for the S/W depth walk where snapping to the side guard caused the flicker.
  if(pete.walkReleaseAt==null) pete.walkReleaseAt = perf2;   // stamp the moment input stopped
  const HOLD_MS = 325;                                        // ~0.33s frozen on the last walk frame (2x faster into guard)
  if(perf2 - pete.walkReleaseAt < HOLD_MS && pete.lastWalkPh!=null){
    // freeze the walk pose at the frame we stopped on — same direction, phase does NOT advance
    return jabIdleBlend(poseWalkDir(pete.lastDir||'D', pete.lastWalkPh, pete.lastWalkSpd||0.9));
  }
  // after the hold beat → settle into the normal idle. Never the wave in gameplay: remap S/W→D.
  let idleDir = pete.lastDir || 'D';
  if(idleDir==='S' || idleDir==='W') idleDir='D';
  return jabIdleBlend(poseIdleDir(idleDir, (perf2%3200)/3200));
}
// Draw-only scale of the uppercut/stomp impact shake. The lab shakes in lab pixels (Pete = 2.5x the rig); the game draws Pete at

  if(plant||liftU) ctx.translate(0, plant+liftU);   // sink the body to the planted feet (rig-local units); uppercut jump lifts it

  ctx.restore();
}
// Exact screen point of the ported rig's NEAR shoulder (where Biscuit perches). Recomputed from
// the lab solve() neutral side pose so Biscuit lands on the new rig's actual shoulder at any scale.
function peteShoulder(cx,feetY,s,face){
  // Biscuit sits on Pete's LEFT shoulder (anatomical), visible behind his head.
  // RULE: her inner edge aligns with the OUTER edge of the shoulder socket so Pete's head
  // is fully clear. A 10-15% overlap onto the shoulder top is fine; no clipping into chest.
  //
  // Coordinate system (rig-local, before RIG_FIT/scale):
  //   x=0 is Pete's spine centerline. Positive x = right on screen when faceRight.
  //   shoulderMid is the spine-top. shNear/shFar are ±shoulderW from center projected by yaw.
  //   At yaw=55° (side profile): shNear.x ≈ -8.6 (near=left side of spine when faceRight).
  //   head.x ≈ +lean_offset (close to 0, slightly forward).
  //
  // Strategy: place Biscuit's anchor at the NEAR shoulder socket x (the outermost shoulder
  // point), shifted slightly OUTWARD past the edge so she sits ON top, not inside the chest.
  const faceRight = (face!=='left');
  const SK = solve(P({view:'side'}));   // neutral side pose — same as standing in the platformer

  // LEFT anatomical shoulder: when faceRight → shNear; when faceLeft → shFar
  const sh = faceRight ? SK.shNear : SK.shFar;

  // Outward nudge: push Biscuit's centre PAST the shoulder socket edge by ~4 rig units
  // so her body sits on TOP of the shoulder, not clipping into the chest.
  // Positive = outward (away from spine) regardless of facing.
  const OUTWARD = 4;

  // sh.x is negative when faceRight (left side of spine). We push further negative (more left).
  // When faceLeft, sh.x is positive (right side), push further positive (more right).
  const rigX = sh.x + (sh.x < 0 ? -OUTWARD : +OUTWARD);

  // Y: sit at shoulder socket height with a slight rise (Biscuit perches ON the shoulder top)
  const rigY = sh.y - 2;

  const k = RIG_FIT * s;
  // Screen x: rig is authored facing right; the drawPete outer ctx.scale(faceRight?1:-1,1) mirrors
  // the whole figure. peteShoulder is called OUTSIDE that transform (in world space), so we must
  // apply the same flip manually here.
  const screenX = cx + (faceRight ? 1 : -1) * rigX * k;
  const screenY = feetY + rigY * k;
  return { x: screenX, y: screenY };
}

  const sh = (effDir==='A') ? S.shFar : S.shNear;

  ctx.fillStyle=grad(0,-10,0,4,fur,furS);ctx.beginPath();ctx.ellipse(0,0,9,7,0,0,7);ctx.fill();
  // chest

    ctx.beginPath();ctx.moveTo(0,-4);ctx.quadraticCurveTo(tsw*5,6,tsw*8,13+Math.abs(tsw)*2);ctx.stroke();
    ctx.strokeStyle=furS;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(tsw*6,9);ctx.quadraticCurveTo(tsw*8,12,tsw*8,13+Math.abs(tsw)*2);ctx.stroke();
  } else if(dir0==='A'){
    ctx.strokeStyle=fur;ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-6,-3);ctx.quadraticCurveTo(-16+tsw*3,-2+tsw*2,-22+tsw*5,2+tsw*3);ctx.stroke();
    ctx.strokeStyle=furS;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(-19+tsw*4,0);ctx.quadraticCurveTo(-22+tsw*5,1,-22+tsw*5,2+tsw*3);ctx.stroke();

    ctx.beginPath();ctx.moveTo(-7,-2);ctx.quadraticCurveTo(-16+tsw*4,6+tsw*2,-13+tsw*6,12+Math.abs(tsw)*2);ctx.stroke();
    ctx.strokeStyle=furS;ctx.lineWidth=2.4;

  ctx.fillStyle=grad(2,-24,2,-12,fur,furS);ctx.beginPath();ctx.arc(3,-16,7,0,7);ctx.fill();
  // ears
  ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(-1,-21);ctx.lineTo(-3,-28);ctx.lineTo(3,-22);ctx.fill();
  ctx.beginPath();ctx.moveTo(7,-21);ctx.lineTo(9,-28);ctx.lineTo(4,-22);ctx.fill();

    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0+g,-17,2.1,0,7);ctx.arc(6+g,-17,2.1,0,7);ctx.fill();
    ctx.fillStyle='#3a7d44';ctx.beginPath();ctx.arc(0+g,-17,1.5,0,7);ctx.arc(6+g,-17,1.5,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0+g,-17,.8,0,7);ctx.arc(6+g,-17,.8,0,7);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0+g-.5,-17.5,.4,0,7);ctx.arc(6+g-.5,-17.5,.4,0,7);ctx.fill();

}
function drawCat(cx,feetY,s,o={}){
  ctx.save();ctx.translate(cx,feetY);ctx.scale(s,s);
  // Face direction. Each pose was authored facing a specific way; flip so o.face wins.
  //   perch pose  -> drawn facing RIGHT by default
  //   walk -> drawn facing LEFT  by default
  if(o.face){
    const defaultRight = !!o.perch;                 // only the perch pose defaults to right; walk defaults left
    const wantRight = (o.face==='right');
    if(wantRight !== defaultRight) ctx.scale(-1,1); // flip so o.face wins: 'right' truly faces right
  }
  const fur='#f6f1e6',furS='#ddd5c4';
  // ---- perched (sitting upright like a parrot on a shoulder) pose ----
  if(o.perch){
    const sway=Math.sin(t*0.08)*0.5;
    ctx.rotate(sway*0.02);
    // sitting haunches
    ctx.fillStyle=grad(0,-10,0,4,fur,furS);ctx.beginPath();ctx.ellipse(0,0,9,7,0,0,7);ctx.fill();
    // upright chest/front
    ctx.beginPath();ctx.ellipse(2,-8,6,9,0,0,7);ctx.fill();
    // front legs down
    ctx.fillStyle=furS;ctx.fillRect(0,-2,3,8);ctx.fillRect(5,-2,3,8);
    // tail hanging/curling behind
    ctx.strokeStyle=fur;ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-7,-2);ctx.quadraticCurveTo(-16,4+Math.sin(t*0.1)*3,-13,12);ctx.stroke();
    // head up top
    ctx.fillStyle=grad(2,-24,2,-12,fur,furS);ctx.beginPath();ctx.arc(3,-16,7,0,7);ctx.fill();
    // ears
    ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(-1,-21);ctx.lineTo(-3,-28);ctx.lineTo(3,-22);ctx.fill();
    ctx.beginPath();ctx.moveTo(7,-21);ctx.lineTo(9,-28);ctx.lineTo(4,-22);ctx.fill();
    ctx.fillStyle='#ffc0d3';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(-1,-26);ctx.lineTo(3,-23);ctx.fill();
    // face
    ctx.fillStyle='#3a7d44';ctx.beginPath();ctx.arc(0,-17,1.7,0,7);ctx.arc(6,-17,1.7,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-17,.8,0,7);ctx.arc(6,-17,.8,0,7);ctx.fill();
    ctx.fillStyle='#ff9ab5';ctx.beginPath();ctx.arc(3,-13,1.3,0,7);ctx.fill();
    // tiara
    ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.moveTo(-2,-24);ctx.lineTo(8,-24);ctx.lineTo(6,-27);ctx.lineTo(3,-25);ctx.lineTo(0,-27);ctx.closePath();ctx.fill();
    ctx.restore();return;
  }
  const wk=o.walk||0,step=Math.sin(wk)*2;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,0,15,4,0,0,7);ctx.fill();
  // tail
  ctx.strokeStyle=fur;ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(13,-10);ctx.quadraticCurveTo(26,-13+Math.sin(wk*1.3)*4,21,-27);ctx.stroke();
  // body (shaded)
  ctx.fillStyle=grad(0,-18,0,-2,fur,furS);ctx.beginPath();ctx.ellipse(0,-9,15,9,0,0,7);ctx.fill();
  // legs
  ctx.fillStyle=furS;ctx.fillRect(-10,-4+step,3,6);ctx.fillRect(-3,-4-step,3,6);ctx.fillRect(5,-4+step,3,6);ctx.fillRect(11,-4-step,3,6);
  // head
  ctx.fillStyle=grad(-13,-27,-13,-9,fur,furS);ctx.beginPath();ctx.arc(-13,-19,9,0,7);ctx.fill();
  // ears
  ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(-19,-25);ctx.lineTo(-21,-34);ctx.lineTo(-13,-28);ctx.fill();
  ctx.beginPath();ctx.moveTo(-7,-25);ctx.lineTo(-5,-34);ctx.lineTo(-12,-28);ctx.fill();
  ctx.fillStyle='#ffc0d3';ctx.beginPath();ctx.moveTo(-18,-26);ctx.lineTo(-19,-31);ctx.lineTo(-14,-28);ctx.fill();
  ctx.beginPath();ctx.moveTo(-8,-26);ctx.lineTo(-7,-31);ctx.lineTo(-11,-28);ctx.fill();
  // eyes + nose
  ctx.fillStyle='#3a7d44';ctx.beginPath();ctx.arc(-16,-20,2,0,7);ctx.arc(-10,-20,2,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-16,-20,.9,0,7);ctx.arc(-10,-20,.9,0,7);ctx.fill();
  ctx.fillStyle='#ff9ab5';ctx.beginPath();ctx.arc(-13,-16,1.5,0,7);ctx.fill();
  ctx.strokeStyle='#cfc8bd';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(-13,-16);ctx.lineTo(-24,-17);ctx.moveTo(-13,-16);ctx.lineTo(-24,-14);ctx.stroke();
  // tiara + collar
  ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.moveTo(-18,-30);ctx.lineTo(-8,-30);ctx.lineTo(-10,-33);ctx.lineTo(-13,-31);ctx.lineTo(-16,-33);ctx.closePath();ctx.fill();
  // fancy collar hugging the neck (small, not a floating box) + tag
  ctx.strokeStyle='#c0392b';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-19,-12);ctx.quadraticCurveTo(-13,-8,-7,-12);ctx.stroke();
  ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(-13,-9,1.6,0,7);ctx.fill();

const playBtn={x:W/2-90,y:300,w:180,h:52};   // raised so the chat/panel never covers the blinking START
function drawTitle(){
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,GAME_H);ctx.clip();   // contain title to game viewport
  ctx.fillStyle=grad(0,0,0,GAME_H,'#1a1a3e','#0e0e1c');ctx.fillRect(0,0,W,GAME_H);
  for(let i=0;i<60;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+0.6*Math.abs(Math.sin(i*12.9+t*0.02)))+')';ctx.fillRect((i*137)%W,(i*89)%230,2,2);}
  ctx.textAlign='center';
  ctx.fillStyle=grad(0,120,0,200,'#ffe27a','#f5a623');ctx.font='bold 84px Trebuchet MS';
  ctx.save();ctx.translate(W/2,178);ctx.rotate(-0.03);
  ctx.strokeStyle='#7a3a00';ctx.lineWidth=9;ctx.strokeText("PLATFORMER PETE",0,0);
  ctx.fillStyle=grad(-200,-30,200,30,'#ffe27a','#f5a623');ctx.fillText("PLATFORMER PETE",0,0);ctx.restore();
  ctx.fillStyle='#8fc9ff';ctx.font='20px Trebuchet MS';ctx.fillText('a semi-original platform crawling comedy',W/2,224);
  // --- title skit (PLAYS ONCE, then holds the idle wave until Space/click) ---
  // Timeline (frames @ 60fps), NON-looping — clamps at the final hold:
  //   0–130  : Pete walks in from stage LEFT (lab D side-walk), eases to a stop at center
  //   130–270: Biscuit walks in from stage RIGHT (lab walk), eases to a stop beside Pete
  //   270–320: Pete settles into GUARD stance (facing right)
  //   320–380: Biscuit LEAPS in an arc onto Pete's left shoulder
  //   380+    : Pete turns to face the viewer and WAVES (idle wave), Biscuit perched —
  //             HELD here indefinitely until the player hits Space or clicks START.
  // SKIT SCALE: opening skit drawn 50% LARGER than before (1.5 → 2.25) — Pete + the perched Biscuit
  // scale together proportionally. Biscuit's WALK-IN draw (STAGE 2-4) keeps her original size.
  const SKIT_S = 2.25;
  const GY=288;                                 // feet line lowered a touch so the 50%-taller Pete still sits above START with headroom
  const sk=t;                                   // one-shot clock (title state resets t on entry)
  const ease=x=>x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

  const PETE_END   = W/2 - 30;
  const PETE_START = -90;
  const CAT_START  = W + 80;
  const CAT_END    = PETE_END + 100;            // Biscuit's stop point, just right of Pete

  let peteX, peteFace, peteWave=false, peteGuard=false;
  let catX, catY, catFace, catWalkPh=0, catPerch=false, catLeaping=false, catVisible=true;

  if(sk < 200){
    // STAGE 1 — Pete WALKS in from the left (D-forward walk animation, legs cycling). SLOWED:
    // position eases over ~185 frames so the stroll is unhurried.
    const f = ease(Math.min(sk/185, 1));
    peteX    = PETE_START + (PETE_END-PETE_START)*f;
    peteFace = 'right';                          // no guard/wave flag → petePose uses walkDir 'D'
    catVisible = false;

  } else if(sk < 340){
    // STAGE 2 — Pete has arrived: hold the GUARD idle while Biscuit walks in from the right
    peteX=PETE_END; peteFace='right'; peteGuard=true;
    const f = ease(Math.min((sk-200)/120, 1));
    catX = CAT_START + (CAT_END-CAT_START)*f;
    const moving = sk < 320;
    catY = GY - (moving ? Math.abs(Math.sin((sk-200)*0.22))*11 : 0);  // light bounding gait
    catFace   = 'left';
    catWalkPh = moving ? (sk*0.40) : 0;

  } else if(sk < 390){
    // STAGE 3 — Pete settles into the GUARD stance, Biscuit waits beside him
    peteX=PETE_END; peteFace='right'; peteGuard=true;
    catX = CAT_END; catY = GY; catFace='left';

  } else if(sk < 450){
    // STAGE 4 — Biscuit LEAPS in an arc onto Pete's left shoulder (Pete still in guard)
    peteX=PETE_END; peteFace='right'; peteGuard=true;
    const f  = (sk-390)/60, ef = ease(f);
    const shPt = peteShoulder(PETE_END, GY, SKIT_S, 'right');
    catX = CAT_END + (shPt.x-CAT_END)*ef;
    catY = GY     + (shPt.y-GY)*ef - Math.sin(f*Math.PI)*80;   // arc up and over
    catFace='left'; catLeaping=true;

  } else {
    // STAGE 5 — HELD: Pete faces the viewer and waves, Biscuit perched. Stays here forever
    // (title state is non-looping) until Space/click starts the game.
    peteX=PETE_END; peteFace='left'; peteWave=true;
    const shPt = peteShoulder(PETE_END, GY, SKIT_S, 'left');
    catX=shPt.x; catY=shPt.y; catFace='left'; catPerch=true;
  }

  // draw Pete with the correct NAMED animation style for the current stage:
  //   walking in → walkDir:'D' (legs cycle);  stopped/leap → guard idle;  final → wave idle
  //   JACKET: NO jacket anywhere in the opening skit — including the final wave (jacket is
  //   credits-only; the opening wave is jacket-off).
  const peteOpts = {face:peteFace};
  if(peteWave){ peteOpts.wave = true; }            // opening wave idle — NO jacket
  else if(peteGuard)  peteOpts.guard = true;       // guard idle animation (no jacket)
  else                peteOpts.walkDir = 'D';      // D-forward walk animation (no jacket)

  // DRAW ORDER: when Biscuit is PERCHED she sits on the shoulder BEHIND Pete's head, so draw her
  // FIRST (behind Pete) and nudge her a touch toward body-center + up so she tucks behind the head
  // instead of out past the shoulder. While walking in / leaping she's drawn AFTER Pete (on top).
  if(catVisible && catPerch){
    const bx = catX + (peteFace==='left' ? -6 : 6);  // nudge toward Pete's center (behind the head)
    drawCat(bx, catY-3, SKIT_S*0.62, {perch:true, face:catFace});  // perched Biscuit scales WITH the bigger Pete
    drawPete(peteX, GY, SKIT_S, peteOpts);            // Pete (incl. head) drawn OVER her front
  } else {
    drawPete(peteX, GY, SKIT_S, peteOpts);
    if(catVisible){
      // Biscuit's WALK-IN stays her ORIGINAL size (not scaled with the bigger skit Pete)
      if(catLeaping) drawCat(catX, catY, 1.1, {face:catFace});
      else           drawCat(catX, catY, 1.3, {walk:catWalkPh, face:catFace});
    }
  }
  drawSnow();
  ctx.restore();   // end viewport clip (button + hint sit at bottom of viewport, still inside)
  ctx.fillStyle=grad(0,playBtn.y,0,playBtn.y+playBtn.h,'#1fe0ad','#12876b');rr(playBtn.x,playBtn.y,playBtn.w,playBtn.h,12);ctx.fill();
  ctx.textAlign='center';
  ctx.fillStyle='#04231c';ctx.font='bold 24px Trebuchet MS';ctx.fillText('▶ START',W/2,playBtn.y+34);
  ctx.fillStyle='#9aa4b2';ctx.font='12px Trebuchet MS';ctx.fillText('click START  •  Enter/Space through the story',W/2,GAME_H-12);
  ctx.textAlign='left';
}

// =====================================================================
// --- cutscene phases ---
// 'intro'  : beat 0-1 (cat in tree, Pete at window) then the CHOICE appears
// 'choice' : menu shown; loops on option 1, breaks out on option 2
// 'fetch'  : beats for going down/outside/catching (cut index drives visuals)
// 'collapse': the flat-world beats
let cutPhase='intro';
let cut=0;               // used by fetch/collapse visuals (0..)
let yellCount=0;         // how many times player yelled (option 1)

// Pete's escalating yell lines (original)
const yellLines=[
  "Biscuit, get down here!",
  "Biscuit! Inside! NOW!",
  "I am NOT wearing pants for this!",
  "You are a HOUSE cat. Act like it!"
];

// choice menu state
let choice=null; // {options:[{label, act}], sel:0}
function showChoice(opts){ choice={options:opts, sel:0}; box=null; }

const introBeats=[
  "Late night. Your cat is up a tree. Again.",
  "You are dressed, as ever, for absolutely no company."
];
const fetchBeats=[
  "Dammit! Biscuit!",                                           // cut 0 — Pete's outburst at the window
  "Down the hall. Down the stairs. A hero descends, muttering.", // cut 1 — shadow descent
  "Out the front door. Into the cold. Still no pants.",         // cut 2 — comes outside
  "Under the tree. She's at the very top now. Of course she is.", // cut 3 — cat top of tree, further
  "With a slow CREAK, the whole world teeters... and tips over backward like the plywood stage set it was.", // cut 4 — teeter + fall, combined (self-animates)
  "Look! I see something glowing over there!" // cut 5 — flat, points to stairs
];

function openChoice(){
  cutPhase='choice';
  const yellLabel = yellCount>0
    ? "1) Yell at the cat to come inside again!"
    : "1) Yell at the cat to come inside!";
  showChoice([
    {label:yellLabel, act:doYell},
    {label:"2) Go outside and fetch the cat.",   act:doFetch}
  ]);
}
function doYell(){
  yellCount++;
  // show Pete's escalating line + cat's escalating response, then loop back to choice
  cutPhase='yell'; t=0;
  // CAT SFX on the "keep talking to the cat" choice: the cat answers each yell. Match the on-screen
  // response — a Meow normally, a Hiss once Pete's pushed it too far (yellCount>=2 shows "Hsssss!").
  if(yellCount>=2) playHiss(); else playMeow();
}
function doFetch(){
  cutPhase='fetch'; cut=0; t=0; showBox(fetchBeats[0]);
}

function advanceCut(){
  if(cutPhase==='intro'){
    if(introStep<introBeats.length-1){ introStep++; showBox(introBeats[introStep]); t=0; }
    else openChoice();
  } else if(cutPhase==='yell'){
    openChoice();
  } else if(cutPhase==='fetch'){
    // Beat 1 (shadow walking the halls) and Beat 4 (collapse) are SELF-PLAYING
    // animations — a click can't skip them until they finish.
    if(cut===1 && t < SHADOW_DONE) return;
    if(cut===4 && t < COLLAPSE_DONE) return;
    cut++;
    if(cut>=fetchBeats.length){ setState('PLATFORMER'); box=null; initLevel(); }
    else { showBox(fetchBeats[cut]); if(cut===4){ t=0; puffs=[]; } if(cut===1){ t=0; } }
  }
}
let introStep=0;
const COLLAPSE_DONE=230;   // frames for the whole domino teeter+fall to complete
const SHADOW_DONE=320;     // frames for the shadow to walk the halls (slower, more deliberate)

const GROUND=416;   // cutscene ground, kept above the dialog box (CUT_BOTTOM=430)
// building geometry (shared so windows align + Pete leans from the right window)
const BLD={x:250,y:222,w:150,h:194,cols:3,rows:4,padX:16,padY:16};
// Props tip BACKWARD (away from viewer) — negative angle — and reveal they are
// comically thin plywood: when tipping/flat you see the thin edge + a prop stand.
function drawStageProp(bx,angle,drawFn,settle,jumble){
  // angle >0 = amount tipped backward. jumble = small random offset when flat.
  ctx.save();
  ctx.translate(bx + (angle>0.2?settle:0) + (angle>=1.4?(jumble||0):0), GROUND);
  // simulate falling backward: skew + shrink vertically as it lays down away from us
  const lay=Math.min(1,angle/(Math.PI/2));      // 0 up ... 1 flat
  ctx.transform(1, 0, -0.5*lay, 1-0.55*lay, 0, 0); // skew back + foreshorten
  // thin plywood edge + kickstand brace (visible while/after tipping)
  if(angle>0.06){
    ctx.fillStyle='#caa06a';ctx.fillRect(-2,-140,4,140);        // thin plywood side edge
    ctx.fillStyle='#8a6a3e';ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(2,-40);ctx.lineTo(24,0);ctx.closePath();ctx.fill(); // prop stand/brace
    ctx.fillStyle='#6b4f2a';ctx.fillRect(2,-5,30,6);
  }
  drawFn(lay);
  ctx.restore();
}
const CUT_BOTTOM=GAME_H;   // cutscene playfield bottom = game viewport bottom
function drawCutscene(){
  const p=Math.min(1,t/90);
  // clip everything to ABOVE the dialog box
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,CUT_BOTTOM);ctx.clip();
  ctx.fillStyle=grad(0,0,0,CUT_BOTTOM,'#2a2258','#4a3a5e');ctx.fillRect(0,0,W,CUT_BOTTOM);
  drawStars();   // night-sky stars behind everything
  // moon + glow
  ctx.fillStyle='rgba(245,240,208,.15)';ctx.beginPath();ctx.arc(772,80,54,0,7);ctx.fill();
  ctx.fillStyle='#f5f0d0';ctx.beginPath();ctx.arc(772,80,32,0,7);ctx.fill();
  ctx.fillStyle='#20321f';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#2a3f28';ctx.fillRect(0,GROUND,W,6);

  // fetch beat map: 0=outburst(window) 1=shadow descent 2=outside 3=under tree
  //                 4=teeter+fall combined (self-animates teeter->fall->flat) 5=flat+stairs
  const inFetch = cutPhase==='fetch';
  const collapsing = inFetch && cut===4;                 // the animated beat
  // within beat 4, once every prop has finished falling we're visually "flat"
  const flat = (inFetch && cut>=5) || (collapsing && t>=COLLAPSE_DONE-20);
  // SLOW teeter-then-fall per prop, staggered for a domino. Falls PAST vertical a touch
  // then settles, so you see it topple over into a jumble (not snap).
  function fallAngle(delay){
    if(inFetch && cut>=5) return Math.PI/2;              // already-flat later beats
    if(!collapsing) return 0;
    const local=t-delay;
    if(local<0) return 0;
    const teeter=40;
    if(local<teeter) return Math.sin(local*0.4)*0.12*(local/teeter);  // wobble grows
    const f=Math.min(1,(local-teeter)/95);
    const eased=1-Math.pow(1-f,2.2);                     // accelerate then ease to rest

    return (Math.PI/2)*eased + over*(f<1?1:0);
  }
  // Pete at the window (intro/choice/yell + fetch beat 0 outburst); shadow descent = fetch beat 1
  const peteAtWindow = (cutPhase==='intro'||cutPhase==='choice'||cutPhase==='yell'||(inFetch&&cut===0));
  const shadowDescent = inFetch && cut===1;
  const PETE_SPOT=440;   // Pete's fixed spot under the tree (no jumping around during collapse)
  // cat stays in the tree until the collapse (cut 4), when she leaps to Pete's shoulder; climbs to the TOP once Pete is outside
  const catInTree = !flat && !(inFetch && cut>=4);
  const catAtTop  = inFetch && cut>=2;   // once Pete heads outside, she's at the very top, further away

  // ===== FULL SKYLINE (varied buildings) — thin plywood, tips backward =====
  // two parallax rows so the city feels full
  drawStageProp(120,fallAngle(0),(lay)=>{
    const spec=[[42,150,'#2b2b58'],[52,210,'#33335f'],[38,120,'#26264e'],[60,255,'#3a3a68'],[44,175,'#2e2e56'],[50,140,'#343463'],[40,200,'#2a2a52'],[56,165,'#38385f'],[46,230,'#30305a'],[52,130,'#35355f']];

      // lit windows

      // rooftop bits

  // ===== parked cars along the street (original blocky cars) — thin plywood, tip back =====
  const carCols=['#c0392b','#2a7fb0','#d8a12a','#3a8048'];
  [ [70,carCols[0]],[600,carCols[1]],[690,carCols[2]] ].forEach((c,ci)=>{
    drawStageProp(c[0],fallAngle(20+ci*8),(lay)=>{
      // body
      ctx.fillStyle=grad(-26,-26,-26,0,c[1],'#000');ctx.fillStyle=c[1];
      ctx.fillRect(-26,-18,52,18);

      ctx.fillStyle='#555';ctx.beginPath();ctx.arc(-15,0,2,0,7);ctx.arc(15,0,2,0,7);ctx.fill();

  // apartment building — routed through the SAME collapse transform as every other prop
  // (pivot at base center, rotate, skew+foreshorten). Content drawn in LOCAL coords.
  const bAngle=fallAngle(40);
  const bLay=Math.min(1,bAngle/(Math.PI/2));
  const BPX=BLD.x+BLD.w/2;                 // pivot x (base center)
  ctx.save();
  ctx.translate(BPX + (bAngle>0.2?55:0), GROUND);
  ctx.rotate(bAngle);
  ctx.transform(1,0,-0.5*bLay,1-0.55*bLay,0,0);   // identical constants to drawStageProp
  // thin plywood edge + kickstand brace (same as props) once tipping
  if(bAngle>0.06){
    ctx.fillStyle='#caa06a';ctx.fillRect(-2,-BLD.h,4,BLD.h);
    ctx.fillStyle='#8a6a3e';ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(2,-40);ctx.lineTo(24,0);ctx.closePath();ctx.fill();

  }
  // shift into local coords: base of building sits at (0,0); draw upward (negative y)
  ctx.translate(-BLD.w/2, -BLD.h);
  const LB={x:0,y:0,w:BLD.w,h:BLD.h};      // building in local space
  // (re-map window/door helpers to local space below via lwin())
  function lwin(r,c){const cw=(BLD.w-BLD.padX*2-(BLD.cols-1)*10)/BLD.cols;const ch=(BLD.h-BLD.padY*2-(BLD.rows-1)*12)/BLD.rows;return {x:BLD.padX+c*(cw+10),y:BLD.padY+r*(ch+12),w:cw,h:ch};}
  // body + 3D faces (local coords)
  ctx.fillStyle=grad(0,0,0,LB.h,'#7a5c48','#5c4536');ctx.fillRect(0,0,LB.w,LB.h);
  ctx.fillStyle='#4a3628';ctx.beginPath();ctx.moveTo(LB.w,0);ctx.lineTo(LB.w+12,-10);ctx.lineTo(LB.w+12,LB.h-10);ctx.lineTo(LB.w,LB.h);ctx.fill();
  ctx.fillStyle='#8a6b54';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(12,-10);ctx.lineTo(LB.w+12,-10);ctx.lineTo(LB.w,0);ctx.fill();
  // aligned windows (local)
  for(let r=0;r<BLD.rows;r++)for(let c=0;c<BLD.cols;c++){
    const wi=lwin(r,c);
    ctx.fillStyle='#241c30';ctx.fillRect(wi.x,wi.y,wi.w,wi.h);
    ctx.fillStyle=grad(wi.x,wi.y,wi.x,wi.y+wi.h,'#ffe89a','#ffcf5e');ctx.fillRect(wi.x+2,wi.y+2,wi.w-4,wi.h-4);
    ctx.strokeStyle='#241c30';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(wi.x+wi.w/2,wi.y+2);ctx.lineTo(wi.x+wi.w/2,wi.y+wi.h-2);ctx.moveTo(wi.x+2,wi.y+wi.h/2);ctx.lineTo(wi.x+wi.w-2,wi.y+wi.h/2);ctx.stroke();

  // door (local) — swings open when shadow reaches bottom, stays open for cut 2+
  {
    const DX=LB.w/2-16, DY=LB.h-40, DW=32, DH=40;

    const shadowNearBottom = shadowDescent && (Math.min(0.999,t/SHADOW_DONE)>0.82);
    const doorOpen = (inFetch && cut>=2) || shadowNearBottom;
    const doorProg = shadowNearBottom
      ? Math.min(1,(Math.min(0.999,t/SHADOW_DONE)-0.82)/0.18)   // 0->1 as shadow exits

      const swing = doorProg * 0.85;   // max skew factor (1=flat/invisible, 0.85=wide open)
      const visW = Math.round(DW * (1-swing));   // apparent width shrinks as it swings
      ctx.save();
      // dark interior revealed behind the open door
      ctx.fillStyle='#140e0a';ctx.fillRect(DX,DY,DW,DH);
      // warm hall light spilling out from inside
      const hallGlow=ctx.createLinearGradient(DX,DY,DX+DW,DY);
      hallGlow.addColorStop(0,'rgba(255,210,120,0.55)');
      hallGlow.addColorStop(1,'rgba(255,180,80,0)');
      ctx.fillStyle=hallGlow;ctx.fillRect(DX,DY,DW,DH);
      // door panel foreshortened — hinge at left, swings toward viewer
      if(visW>1){
        ctx.fillStyle='#3a2a20';ctx.fillRect(DX,DY,visW,DH);
        // door detail lines (panels)
        ctx.strokeStyle='#2a1c12';ctx.lineWidth=1;
        ctx.strokeRect(DX+2,DY+4,visW-4,DH/2-6);
        ctx.strokeRect(DX+2,DY+DH/2+2,visW-4,DH/2-6);
        // knob (only visible when door not too foreshortened)
        if(visW>8){ ctx.fillStyle='#c9a227';ctx.beginPath();ctx.arc(DX+visW-4,DY+DH/2,2,0,7);ctx.fill(); }
      }
      ctx.restore();
    }
  }
  // Pete leaning OUT of the top-right window frame — hands on hips, yelling up at the tree.
  // He is drawn INSIDE the window opening (centered), his lower body hidden behind the sill so
  // he reads as leaning over the windowsill, not pasted on the building face.
  if(peteAtWindow){
    const wi=lwin(0,BLD.cols-1);
    const cxw=wi.x+wi.w/2;              // window center x
    const sillY=wi.y+wi.h-3;           // the windowsill line he leans over
    const bob=Math.sin(t*0.08)*1.2;    // angry breathing bob
    const px=cxw, py=sillY;            // Pete anchored at window center, body rises from the sill

    // 1) dark room interior behind the open window (CLIPPED to the glass opening only)
    ctx.save();
    ctx.beginPath();ctx.rect(wi.x+2,wi.y+2,wi.w-4,wi.h-4);ctx.clip();
    ctx.fillStyle='#1a1222';ctx.fillRect(wi.x+2,wi.y+2,wi.w-4,wi.h-4);
    const rg=ctx.createRadialGradient(cxw,wi.y+wi.h*0.5,2,cxw,wi.y+wi.h*0.5,wi.w*0.7);
    rg.addColorStop(0,'rgba(255,210,130,0.35)');rg.addColorStop(1,'rgba(255,190,90,0)');
    ctx.fillStyle=rg;ctx.fillRect(wi.x+2,wi.y+2,wi.w-4,wi.h-4);
    ctx.restore();   // END interior clip — everything below is drawn OUTSIDE the window

    // WINDOW FRAME (sill + side posts) drawn FIRST, BEHIND Pete, so NOTHING clips his arms — he
    // leans fully IN FRONT of all the window graphics. (Previously the right post overlapped his
    // reaching arms.) The frame still reads because his body sits over the opening, not the frame.
    ctx.fillStyle='#2a1f18';
    ctx.fillRect(wi.x-2, wi.y, 2, wi.h);                                     // left frame post
    ctx.fillRect(wi.x+wi.w, wi.y, 2, wi.h);                                  // right frame post
    ctx.fillStyle='#3a2c22';ctx.fillRect(wi.x-1, sillY-2, wi.w+2, 5);        // sill ledge
    ctx.fillStyle='#4a3828';ctx.fillRect(wi.x-1, sillY+1, wi.w+2, 2);        // sill shadow lip

    //    (to his RIGHT, toward the tree) — NOT toward the camera. Head + arms overhang the sill.
    // Anchor Pete LOWER so his WAIST sits at the BOTTOM of the window frame (the sill), reading as
    // him leaning over the sill at a natural height — not floating with his torso up at the window
    // top. His 22px torso is drawn from outY-6 downward, so putting outY ~16px above the sill lands
    // the torso bottom (waist) right on the sill line.
    const outY = sillY - 16;                  // waist at the sill (bottom of the window frame)
    // SHAKING FISTS at the cat: both arms raised with HARD-BENT elbows, clenched fists up near head
    // height, jittering rapidly in frustration ("Dammit! Biscuit!"). A fast shake + a slower rock.
    const shk = Math.sin(t*0.45)*2.0;         // SLOWER angry shake (was 0.9) — a weary, deliberate rattle
    const rock= Math.sin(t*0.10)*1.4;         // slower overall rock of the raised arms
    // torso
    ctx.fillStyle=P_SKIN;  ctx.fillRect(cxw-6, outY-6, 13, 22);               // chest/torso
    ctx.fillStyle=P_SKINS; ctx.fillRect(cxw+4, outY-5, 3, 20);                // shaded right side (toward light)
    ctx.fillStyle=P_SKINH; ctx.fillRect(cxw-5, outY-5, 2, 18);                // lit left edge
    ctx.strokeStyle=P_SKIN; ctx.lineWidth=5; ctx.lineCap='round';
    // Both forearms angle UP and slightly toward the cat (right), elbows bent hard by the torso,
    // fists shaking at ~head height. The two arms shake on opposite phase so it reads as a rattle.
    //   near (front) arm — fist higher, leaned MORE toward the cat (further right)
    const nElbX=cxw+8, nElbY=outY-3;                        // elbow pushed out toward the cat
    const nFistX=cxw+18+rock+shk, nFistY=outY-15+rock;      // fist up + further right (toward the tree)
    ctx.beginPath(); ctx.moveTo(cxw+2, outY-2); ctx.lineTo(nElbX, nElbY); ctx.lineTo(nFistX, nFistY); ctx.stroke();
    //   far arm — fist slightly lower, also leaned toward the cat + shaking opposite
    const fElbX=cxw+7, fElbY=outY+1;
    const fFistX=cxw+15+rock-shk, fFistY=outY-8+rock;       // second fist, also toward the cat
    ctx.beginPath(); ctx.moveTo(cxw+2, outY+1); ctx.lineTo(fElbX, fElbY); ctx.lineTo(fFistX, fFistY); ctx.stroke();
    //   CLENCHED FISTS (fuller blobs, with a lit knuckle highlight) at the ends
    const fist=(fx,fy)=>{ ctx.fillStyle=P_SKIN; ctx.beginPath();ctx.arc(fx,fy,4.2,0,7);ctx.fill();
      ctx.fillStyle=P_SKINS; ctx.beginPath();ctx.arc(fx+1,fy+1,3.6,-0.4,1.6);ctx.fill();   // underside shade
      ctx.fillStyle=P_SKINH; ctx.fillRect(fx-2.5,fy-3,5,1.6);                              // lit knuckles
    };
    fist(fFistX, fFistY);   // far fist first (behind)
    fist(nFistX, nFistY);   // near fist on top
    // HEAD — detailed mini face, turned toward the cat (looking right), bobbing
    const hy = outY-16+bob, hx = cxw+1;       // head nudged right (looking toward the cat)
    ctx.fillStyle=P_SKIN;  ctx.beginPath();ctx.arc(hx, hy, 7.5, 0, 7);ctx.fill();
    ctx.fillStyle=P_SKINS; ctx.beginPath();ctx.arc(hx+2, hy+1, 7, -0.6, 1.4);ctx.fill();   // jaw/cheek shade
    // HAIR — rig palette, swept-back hero shape with fringe
    ctx.fillStyle=P_HAIR;  rr(hx-8, hy-9, 16, 8, 3);ctx.fill();             // crown mass
    ctx.fillStyle=P_HAIRH; ctx.fillRect(hx-7, hy-9, 14, 2);                 // top highlight
    ctx.fillStyle=P_HAIR;                                                    // swept fringe tufts
    ctx.beginPath();ctx.moveTo(hx-7,hy-3);ctx.lineTo(hx-4,hy-8);ctx.lineTo(hx-1,hy-3);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(hx,hy-3);ctx.lineTo(hx+3,hy-8);ctx.lineTo(hx+6,hy-3);ctx.closePath();ctx.fill();
    // EYES — both looking RIGHT toward the cat (pupils shifted right)
    ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(hx-1,hy-1,2,0,7);ctx.arc(hx+5,hy-1,2,0,7);ctx.fill();
    ctx.fillStyle='#2a2a30'; ctx.beginPath();ctx.arc(hx+0.5,hy-1,1.1,0,7);ctx.arc(hx+6.5,hy-1,1.1,0,7);ctx.fill();  // pupils look right
    // BROW — focused/pleading, angled toward the cat
    ctx.strokeStyle=P_HAIRS;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(hx-4,hy-4);ctx.lineTo(hx-1,hy-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hx+3,hy-3);ctx.lineTo(hx+7,hy-4);ctx.stroke();
    // MOUTH — open, calling out to the cat
    ctx.fillStyle='#8a3a2a';ctx.beginPath();ctx.ellipse(hx+1, hy+4, 2.2, 1.6, 0, 0, 7);ctx.fill();
    // nose hint
    ctx.strokeStyle=P_SKINS;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx+3,hy);ctx.lineTo(hx+4,hy+2);ctx.stroke();

    // (window frame + sill now drawn BEFORE Pete, above — he leans fully in front of them)
  }
  // SHADOW behind the windows (local coords) — only visible as it crosses each lit pane
  if(shadowDescent){
    const sp=Math.min(0.999, t/SHADOW_DONE);
    const rowsY=[];for(let r=0;r<BLD.rows;r++){const wi=lwin(r,0);rowsY.push(wi.y+wi.h/2);}
    const leftX=14, rightX=LB.w-14;
    const pts=[
      [leftX,rowsY[0]],[rightX,rowsY[0]],
      [rightX,rowsY[1]],[leftX,rowsY[1]],
      [leftX,rowsY[2]],[rightX,rowsY[2]],
      [rightX,rowsY[3]],[LB.w/2,rowsY[3]],
      [LB.w/2, LB.h-18]
    ];
    const seg=sp*(pts.length-1);const i=Math.floor(seg);const f=seg-i;
    const a=pts[i],b=pts[Math.min(pts.length-1,i+1)];
    const sx=a[0]+(b[0]-a[0])*f, sy=a[1]+(b[1]-a[1])*f;
    const walk=Math.sin(t*0.28), bob=Math.abs(walk)*2;
    for(let r=0;r<BLD.rows;r++)for(let c=0;c<BLD.cols;c++){

        ctx.beginPath();ctx.arc(gx,gy-14-bob,4.5,0,7);ctx.fill();
        ctx.fillRect(gx-6,gy-9-bob,12,15);
        ctx.save();ctx.translate(gx-3,gy+5-bob);ctx.rotate(walk*0.5);ctx.fillRect(-2,0,4,9);ctx.restore();
        ctx.save();ctx.translate(gx+3,gy+5+bob);ctx.rotate(-walk*0.5);ctx.fillRect(-2,0,4,9);ctx.restore();
        ctx.restore();
      }
    }
    if(sp>0.86){ctx.fillStyle='rgba(255,220,120,'+(0.5*(sp-0.86)/0.14)+')';ctx.fillRect(LB.w/2-14,LB.h-38,28,38);}
  }
  ctx.restore();

  // tree (thin plywood, tips backward into the jumble)
  drawStageProp(505,fallAngle(55),()=>{
    ctx.fillStyle=grad(-7,-130,7,0,'#6a4526','#4a2f18');ctx.fillRect(-7,-130,14,130);
    ctx.fillStyle='#2f6b3a';ctx.beginPath();ctx.arc(0,-150,50,0,7);ctx.fill();
    ctx.fillStyle='#3a8048';ctx.beginPath();ctx.arc(-20,-140,28,0,7);ctx.arc(20,-160,26,0,7);ctx.fill();
    ctx.fillStyle='#256030';ctx.beginPath();ctx.arc(10,-135,20,0,7);ctx.fill();
  },30,40);

  // ---- CAT in the tree ----
  if(catInTree){
    // tree trunk base ~x505, canopy center ~y300. Top of tree ~y250.
    if(catAtTop) drawCat(500,258,1.0,{walk:t*0.06,face:'left'});   // climbed to the very top, smaller/further
    else drawCat(505,306,1.15,{walk:t*0.08,face:'left'});
  }

  // ---- bubbles / dialog for each phase (bubbles kept in OPEN sky) ----
  const treeCatX=catAtTop?500:505, treeCatY=catAtTop?250:290;
  const winX=BLD.x+BLD.w+8, winY=BLD.y+34;
  if(cutPhase==='intro'){
    if(catInTree) speech(660,150,treeCatX,treeCatY,"Meow.",'#c0392b');
  } else if(cutPhase==='choice'){
    speech(660,150,treeCatX,treeCatY,"Meow?",'#c0392b');
  } else if(cutPhase==='yell'){
    const line=yellLines[Math.min(yellCount-1, yellLines.length-1)];
    const catResp = yellCount>=2 ? "Hsssss!" : "Meow.";

  // ---- FETCH phase visuals ----
  if(inFetch && !flat){
    if(cut===0){ // OUTBURST at the window

    }
    if(cut===1){ // shadow descent handled above; a muttering bubble near the building

    }
    if(cut===2){ // comes OUTSIDE — walks out the door toward the tree
      const kx=BLD.x+BLD.w/2+70;drawPete(kx,GROUND,1.7,{face:'right',walk:t*0.2});
      speech(220,150,kx-20,GROUND-96,"Here, cat. Nice cat. Please.",'#3a6ea5');
      if(catInTree)speech(690,140,treeCatX,treeCatY,"Meow!",'#c0392b');

    if(cut===3){ // under the tree; cat at the very top. Pete stands in GUARD, shivering (freezing).
      const shiver = Math.sin(t*0.9)*1.6 + (Math.random()-0.5)*0.6;   // quick up/down + tiny jitter
      drawPete(PETE_SPOT, GROUND+shiver, 1.7, {face:'right', guard:true});
      speech(220,150,PETE_SPOT-20,GROUND-100,"It's freezing!",'#3a6ea5');
      if(catInTree)speech(690,120,treeCatX,treeCatY,"Mrrp!",'#c0392b');
    }
    if(cut===4 && !flat){ // COLLAPSE playing — Pete STAYS under the tree; cat leaps to his shoulder
      // cat leap: from treetop (500,258) to Pete's ACTUAL shoulder over the first ~35 frames
      const leapT=Math.min(1, t/35);
      const shPt=peteShoulder(PETE_SPOT,GROUND,1.7,'right');
      drawPete(PETE_SPOT,GROUND,1.7,{face:'right'});
      if(leapT<1){

        const cx0=500,cy0=258, cx1=shPt.x,cy1=shPt.y;
        const cxp=cx0+(cx1-cx0)*leapT, cyp=cy0+(cy1-cy0)*leapT - Math.sin(leapT*Math.PI)*40;
        drawCat(cxp,cyp,1.7*0.62,{face:'right'});          // leaping onto Pete — face his way
      } else {
        // perched on his shoulder, riding out the apocalypse
        drawCat(shPt.x,shPt.y,1.7*0.62,{perch:true,face:'right'});
      }
      if(t<45) speech(210,150,PETE_SPOT-20,GROUND-100,"...uh.",'#3a6ea5');
    }
  }
  // dust puffs kick up as props slam down during the collapse
  if(collapsing && t>70 && t<COLLAPSE_DONE && t%3===0){ spawnPuff(100+Math.random()*700, GROUND-4, Math.random()<0.5); }
  // once flattened, Pete stands in the SAME spot with the cat on his shoulder
  if(flat){
    drawFlatRubble();

const PETE_GLOW_LEN=186, GLOW_PULSE_F=36;   // 66 + 120 frames (2s longer at 60fps); pulses every 36 frames. (peteGlow itself is declared up top beside musicOn so setState can't hit a TDZ)

  // short rising chime via the existing Tone setup; silent when muted or audio not yet unlocked
  try{
    if(musicMuted||typeof Tone==='undefined'||!Tone.context||Tone.context.state!=='running') return;
    const g=new Tone.Gain(0.3).toDestination();
    const sy=new Tone.Synth({oscillator:{type:'square'},envelope:{attack:0.005,decay:0.09,sustain:0.15,release:0.2}}).connect(g);
    const n0=Tone.now();

  }catch(e){}

// 0..1 glow strength for the current frame
function peteGlowK(){
  if(peteGlow<=0) return 0;
  const f=PETE_GLOW_LEN-peteGlow;              // frames elapsed
  // ramp up 12f, hold PULSATING (period GLOW_PULSE_F: trough->peak->trough), then a clean ~45f fade-out
  const fadeF=45, env = f<12 ? f/12 : (peteGlow<fadeF ? Math.pow(peteGlow/fadeF,1.4) : 1);
  const p=0.5-0.5*Math.cos(f*6.2832/GLOW_PULSE_F);   // 0..1, starts at a trough
  return Math.max(0,env*(0.38+0.62*p));

// aura around Pete's body (kx,kyc = body center). back=true: wide halo drawn BEHIND; back=false: bright tint over the body + sparkles
function drawPeteGlow(kx,kyc,s,back){
  const k=peteGlowK(); if(k<=0) return;
  const f=PETE_GLOW_LEN-peteGlow;
  ctx.save();

  const C=peteGlowRGB, mix=(w)=>C.map(v=>Math.round(v+(255-v)*w)).join(',');   // rarity color blended toward white
  if(back){
    ctx.translate(kx,kyc); ctx.scale(1,1.65);   // elliptical glow: circular gradient stretched so it fades fully to 0 (no hard edge)
    const rg=ctx.createRadialGradient(0,0,6*s,0,0,40*s);
    rg.addColorStop(0,'rgba('+mix(0.3)+','+Math.min(1,0.95*k)+')');
    rg.addColorStop(0.55,'rgba('+C.join(',')+','+(0.50*k)+')');
    rg.addColorStop(1,'rgba('+C.join(',')+',0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,40*s,0,7); ctx.fill();
  } else {
    ctx.save(); ctx.translate(kx,kyc); ctx.scale(1,1.7);
    const rg=ctx.createRadialGradient(0,0,3*s,0,0,26*s);
    rg.addColorStop(0,'rgba('+mix(0.7)+','+(0.65*k)+')');

    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,26*s,0,7); ctx.fill();
    ctx.restore();
    // expanding pulse ring, re-emitted on every pulse (stops as the final fade begins), in the item's rarity color
    if(peteGlow>45 || f<GLOW_PULSE_F){
      const rp=(f%GLOW_PULSE_F)/GLOW_PULSE_F;
      ctx.strokeStyle='rgba('+mix(0.6)+','+(0.8*(1-rp))+')'; ctx.lineWidth=3*(1-rp)+1;
      ctx.beginPath(); ctx.ellipse(kx,kyc,(18+36*rp)*s,(26+48*rp)*s,0,0,7); ctx.stroke();
    }
    // chunky square sparkles rising off the body (pixel-art style, integer-snapped)
    for(let i=0;i<9;i++){

  // the BOTTOM of the chasm (same amber/red pulse as the fall-aways + subway) so the void reads as lit.
  { const rPulse=0.7+0.3*Math.sin(t*0.1);
    for(let i=0;i<plats.length-1;i++){ const a=plats[i], b=plats[i+1];
      const gx0=a.x+a.w, gw=b.x-(a.x+a.w)+2, gy0=FAR_ROAD-16, gh=PLAYFIELD_BOTTOM-FAR_ROAD+16;
      ctx.fillStyle='#07070c'; ctx.fillRect(gx0, gy0, gw, gh);                      // dark chasm
      ctx.save(); ctx.beginPath(); ctx.rect(gx0, gy0, gw, gh); ctx.clip();          // clip glow to the chasm
      const gg=ctx.createLinearGradient(0, PLAYFIELD_BOTTOM, 0, PLAYFIELD_BOTTOM-70);

      ctx.fillStyle=gg; ctx.fillRect(gx0, PLAYFIELD_BOTTOM-70, gw, 70);
      // a brighter core pool deep in the middle of the chasm floor
      const cxg=gx0+gw/2, rg=ctx.createRadialGradient(cxg,PLAYFIELD_BOTTOM-6,2, cxg,PLAYFIELD_BOTTOM-6, Math.max(40,gw*0.7));
      rg.addColorStop(0,'rgba(255,170,80,'+(0.4*rPulse)+')'); rg.addColorStop(1,'rgba(255,120,45,0)');

  for(const p of plats.concat([stair])) drawRoad(p);

  const nearHalf=stair.w*0.72;                 // half-width at the NEAR lip (wide)
  const farHalf=stair.w*0.42;                  // half-width at the FAR lip (narrower = perspective)
  // vanishing point: centered on the mouth, set BELOW the near lip (steps rake down toward it)
  const vpX=cxS, vpY=nearY+70;

    const fr=i/SN;                             // 0 at top of shaft .. 1 at bottom (deepest, at VP)

  // FOREGROUND FIXTURES (lamps + sign). Drawn after Pete so he passes BEHIND them; while the rubble

  ctx.strokeStyle='rgba(120,210,255,'+(0.55+0.3*glow)+')';ctx.lineWidth=2;ctx.strokeRect(sgnX,sgnY,sgnW,18);

    drawPeteBubble(rubble.phase==='top' ? 'I need to punch this thing out of our way!' : 'KICK IT!', -140, -96, true);

}
// ---- depth-sorted hazard renderers (called from drawPlatformer's z-sort pass) ----
// Rising smoke off a fire — now DENSER so the city reads as actively burning: 3 phase/seed-
// shifted ribbons (billowing wider as they rise) + a handful of procedural rising puffs. Low
// per-element alpha so overlap builds naturally without greying out the scene. Procedural (no
// persistent array) in the ember style of drawFireRow. (Snow is untouched — see drawSnow/snow.)
function smokeRibbon(fx,topY,seed){
  ctx.lineCap='round';
  // 3 offset ribbons: each a bit wider/longer, with its own sway phase
  for(let r=0;r<3;r++){
    const ph=seed+r*1.7, segs=4+r, baseW=5+r*2;
    ctx.strokeStyle='rgba(110,115,135,'+(0.12-r*0.02)+')';
    ctx.beginPath();ctx.moveTo(fx+(r-1)*3, topY-18);
    for(let sy=1;sy<=segs;sy++){
      ctx.lineWidth=baseW+sy*1.4;            // widen with height -> billows
      ctx.lineTo(fx+(r-1)*3+Math.sin(t*0.04+ph+sy)*(9+r*3), topY-18-sy*22);
    }
    ctx.stroke();
  }
  // rising smoke puffs: small grey circles drifting up + sideways, growing + fading
  const P=5;
  for(let i=0;i<P;i++){
    const u=((t*0.012 + i/P + seed)%1+1)%1;    // 0..1 life cycle per puff
    const rise=u*120, px=fx+Math.sin(t*0.03+seed*2+i)*(10+u*18)+(i-P/2)*2;
    const rad=3+u*9, a=0.14*(1-u);
    ctx.fillStyle='rgba(130,130,140,'+a+')';
    ctx.beginPath();ctx.arc(px, topY-18-rise, rad, 0, 7);ctx.fill();
  }
}
// Pooled warm road light under a fire — ONE additive radial gradient hugging the road plane.
// Purely emissive glow; reads nothing collision/hazard code uses and sets no state.
function fireLightPool(cx, baseY, scale, dangerMul){
  const flick = 0.85 + 0.15*Math.sin(t*0.4);
  const dm = dangerMul||1;                 // TELL: pre-surge brighten envelope (visual only)
  const R = FIRE_LIGHT_RADIUS*scale;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(cx,baseY,2,cx,baseY,R);
  g.addColorStop(0,'rgba('+FLAME_GLOW_WARM+','+(0.30*flick*dm)+')');
  g.addColorStop(0.5,'rgba('+FLAME_GLOW_HOT+','+(0.14*flick*dm)+')');
  g.addColorStop(1,'rgba('+FLAME_GLOW_WARM+',0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(cx,baseY,R,R*0.22,0,0,7);ctx.fill();   // squashed = hugs the road plane
  // TELL: steady, larger low-alpha DANGER RING so proximity/footprint reads clearly from a distance
  const R2=R*1.55;
  const gr=ctx.createRadialGradient(cx,baseY,R*0.55,cx,baseY,R2);
  gr.addColorStop(0,'rgba('+FLAME_GLOW_WARM+','+(0.10*dm)+')');
  gr.addColorStop(1,'rgba('+FLAME_GLOW_WARM+',0)');
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.ellipse(cx,baseY,R2,R2*0.20,0,0,7);ctx.fill();
  ctx.restore();
}
function drawDepthFire(f){
  const topY=depthY(f.depth), cnt=3+(f.depth<0.5?1:0), sc=0.85+0.15*(1-f.depth);
  // TELL: slow ~2s pre-surge envelope driven by the global clock — brightens the GLOW only,
  // never the flame geometry or any collision/damage behavior.

// Instead ONE pixel height `pileH` (above ROAD) is derived from TOTAL hit progress, so every hit

// the visual height is a smooth downward shrink.

//   RUBBLE_WAIST= target peak after the 3 punches ≈ Pete's WAIST. Derived from Pete's drawn height:
//                 Pete stands near-lane at the pile so pScale≈LANE_SCALE[0], drawn height≈pete.h*pScale.

function drawCar(){

  // Uses the SAME pulse formula as the subway entrance (glow=0.55+0.45*sin(t*0.08)) and the same

  // (rgba(140,220,255)) so the pile light and the revealed stairwell read as ONE light source.

// ONE CONTINUOUS FAKE-3D FLOOR (beat-em-up walkable plane). Instead of two drawn lanes split by a
// clean divider + centerline, the whole FAR_ROAD..PLAYFIELD_BOTTOM span is a single raked slab:
// narrower/dimmer at the back (FAR_ROAD), wider/brighter at the front, with perspective banding
// that compresses toward the back so depth reads from the texture + the shrinking character, not
// from a seam. Technique reference: classic side-scrolling beat-em-up floors (Sega's Streets of
// Rage, Konami's 1989 TMNT arcade "hallway") use a single flat raked floor with receding bands and
// no front/back dividing line. (Technique only — no art/code/text copied; descriptions rephrased
// for licensing compliance. General refs: Wikipedia "Streets of Rage", Wikipedia "Teenage Mutant
// Ninja Turtles (1989 video game)".) Physics/depth (LANE_GAP/FAR_ROAD/depthY/LANE_SCALE) unchanged.
// VISUAL-ONLY arcade route cue: a faint lighter-asphalt streak worn into the FAST/risky lane at a
// choice point. Pure ctx fill, world-x keyed (drawn inside the -camX transform), very low alpha —
// NO hazard, NO physics interaction. Lets the layout teach the choice without UI text.
