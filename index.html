    flameTongue(fx,baseY,(30*scale)*flick,18*scale, seed,     ['rgba(150,25,5,0.0)','rgba(220,60,15,0.55)','rgba(255,120,35,0.85)']);
    flameTongue(fx,baseY,(38*scale)*flick,13*scale, seed+0.5, ['rgba(210,50,10,0.0)','rgba(255,110,30,0.7)','rgba(255,180,60,0.9)']);
    flameTongue(fx,baseY,(30*scale)*flick,8*scale,  seed+1.1, ['rgba(255,150,40,0.0)','rgba(255,205,90,0.85)','rgba(255,240,170,0.95)']);
    flameTongue(fx,baseY,(20*scale)*flick,4*scale,  seed+1.7, ['rgba(255,220,120,0.0)','rgba(255,245,200,0.9)','rgba(255,255,240,1)']);
  }
  // 2) rising embers/sparks, fading as they climb
  for(let e=0;e<count*4;e++){
    const life=((t*2.4+e*11)%70)/70;
    const ey=baseY-life*62*scale, ex=startX+((e*spacing*0.7)%span)+Math.sin(t*0.1+e)*7*scale;
    ctx.fillStyle='rgba(255,'+(150+((e*41)%90))+',70,'+((1-life)*0.9)+')';
    const r=(1.6-life)*scale; ctx.beginPath();ctx.arc(ex,ey,Math.max(0.4,r),0,7);ctx.fill();
  }
  ctx.restore();
}

// =====================================================================
// DESCENT — perspective STAIRWELL going deeper, player-controlled step-down
// =====================================================================
// Monument-Valley-style descent: Pete walks smoothly step-by-step down a switchback.
// progress = smooth float across all steps; arrows drive it.
let descProg=0;                       // smooth 0..TOTAL_STEPS progress
let descHold=0;                       // how long a move key is held
const TOTAL_STEPS=15;                 // steps across one switchback (2 flights x 7 + landing, index-based)
const STEP_SPEED=0.09;                // steps per frame while walking
function updateDescent(){
  const go = kHeldD()||kHeldR()||keys['Space']||kHeldL();
  if(go){ descProg=Math.min(TOTAL_STEPS, descProg+STEP_SPEED); descHold++; }
  else descHold=0;
  if(descProg>=TOTAL_STEPS) setState('CREDITS');
}
// ===== Monument-Valley style walkable switchback staircase =====
// Iso projection: world (wx = left/right along a flight, wy = depth INTO the scene,
// wz = height above the bottom) -> screen.
//   - Moving RIGHT (+wx) goes down-and-right on screen; moving LEFT (-wx) down-and-left.
//   - Moving deeper (+wy) always pushes UP-and-slightly-right (away from camera).
//   - Losing height (-wz) always drops the point DOWN on screen.
// CRUCIAL: horizontal run (wx) must NOT push the point vertically, otherwise a left-going
// flight climbs back UP on screen (the "flipped after the switchback" bug). So ay=0 — ALL
// vertical screen motion comes from height (wz, always dropping) and depth (wy, always
// growing). Every flight then runs sideways while the whole stair steadily descends.
const ISO={ax:1.30, ay:0.0, dx:0.42, dy:-0.30};
function isoPt(wx,wy,wz,ox,oy){
  return [ ox + wx*ISO.ax + wy*ISO.dx,
           oy + wx*ISO.ay + wy*ISO.dy - wz ];
}
// Build the switchback geometry ONCE: list of steps, each with world pos + facing.
let STAIR=null;
function buildStair(){
  const RISE=20, RUN=34, DEPTHRUN=9, DEPTH=54;   // rise per step (drop), run (sideways), tread depth (into screen)
  const flightLen=7, flights=2;   // ONE switchback: two flights with a single turn between them
  let wx=0, wy=0, wz=0, dir=1;        // dir +1 = flight runs to the RIGHT, -1 = to the LEFT
  const steps=[];
  for(let fl=0; fl<flights; fl++){
    // ---- a flight of steps: walk sideways while dropping height + easing deeper ----
    for(let s=0;s<flightLen;s++){
      steps.push({wx, wy, wz, dir});
      wx += RUN*dir; wy += DEPTHRUN; wz -= RISE;
    }
    if(fl < flights-1){
      // ---- LANDING: a big FLAT platform at the bottom of this flight. Same height as the
      // last step (you step onto it level, then walk across it). It is deep + wide enough to
      // bridge the turn, and the NEXT flight starts at its far/deep edge running the other way.
      // Back the wx up half a run so the landing is centered under where the flight ended.
      const landWx = wx - RUN*dir*0.5;
      steps.push({wx:landWx, wy, wz, dir, landing:true});
      // the next flight begins deeper into the scene (off the landing's back edge), one RISE
      // lower, running the opposite direction. Nudge wx so the new flight sits over the landing.
      wy += DEPTH*1.7;            // step across the landing, deeper into the shaft
      wz -= RISE;                 // drop off the landing into the first step of the next flight
      dir *= -1;
      wx = landWx + RUN*dir*0.5;  // start the new flight above the landing, heading back
    }
  }
  STAIR={steps, RISE, RUN, DEPTH, flightLen, flights};
}
function drawDescent(){
  if(!STAIR) buildStair();
  ctx.fillStyle=grad(0,0,0,GAME_H,'#141824','#05070c');ctx.fillRect(0,0,W,GAME_H);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,GAME_H);ctx.clip();

  const S=STAIR, steps=S.steps;
  // Pete's smooth position: interpolate between step i and i+1 by descProg fraction
  const i=Math.min(steps.length-1, Math.floor(descProg));
  const j=Math.min(steps.length-1, i+1);
  const f=descProg-i;
  const a=steps[i], b=steps[j];
  const kx=a.wx+(b.wx-a.wx)*f, ky=a.wy+(b.wy-a.wy)*f, kz=a.wz+(b.wz-a.wz)*f;
  const facing=b.dir||a.dir;   // face the direction of travel

  // CAMERA: keep Pete centred; origin so his screen pos stays near upper-middle
  const kScreen=isoPt(kx,ky,kz,0,0);
  const ox=W/2 - kScreen[0];
  const oy=GAME_H*0.38 - kScreen[1];

  const W_TREAD=S.RUN, D=S.DEPTH;
  // Painter's order by actual projected depth: a step's FRONT edge screen-Y tells us how
  // near it is (bigger screenY = closer to the viewer = drawn later, on top).
  const keyY = s => isoPt(s.wx, s.wy, s.wz, 0, 0)[1];   // front-edge screen Y (origin-independent)
  const order=steps.map((s,idx)=>idx).sort((p,q)=> keyY(steps[p]) - keyY(steps[q]) );
  for(const idx of order){
    drawStep(steps[idx], ox, oy, W_TREAD, D);
  }
  // Pete on top of his current tread — drawn after the steps so he always reads clearly.
  // On a normal step he stands half a run into the flight direction, half a tread deep.
  // On the landing he stands centered on the platform (no run offset, deeper center).
  const onLanding = a.landing;
  const runOff = onLanding ? 0 : (W_TREAD/2)*(a.dir||1);
  const depOff = onLanding ? D*1.0 : D/2;
  const kp=isoPt(kx + runOff, ky+depOff, kz, ox, oy);
  // NEW/IMPROVED Pete (the same game drawPete) on the stairs, instead of a separate hand-drawn walker.
  // facing (+1 right / -1 left = travel direction) → face; descProg drives the walk-leg cycle while
  // a key is held (descHold>0), and holds the frame when idle so he doesn't moon-walk in place.
  // Biscuit rides along (cat:true), jacket on. Scale ~1.3 to sit right on the iso treads.
  {
    const walkPhase = (descHold>0) ? (descProg*1.9) : 0;   // legs cycle while descending, freeze when idle
    drawPete(kp[0], kp[1], 1.3, { face:(facing<0?'left':'right'), walk:walkPhase, jacket:true, cat:true });
  }
  // eerie glow at the very bottom
  const last=steps[steps.length-1];const gp=isoPt(last.wx,last.wy,last.wz-40,ox,oy);
  ctx.fillStyle='rgba(120,220,255,'+(0.12+0.08*Math.sin(t*0.1))+')';
  ctx.beginPath();ctx.ellipse(gp[0],gp[1]+30,120,26,0,0,7);ctx.fill();

  ctx.restore();
  // HUD
  ctx.fillStyle='#7fd4ff';ctx.font='14px Trebuchet MS';ctx.textAlign='center';
  ctx.fillText('HOLD ↓ / S to walk down the stairs   ('+Math.min(TOTAL_STEPS,Math.floor(descProg))+'/'+TOTAL_STEPS+')',W/2,GAME_H-14);ctx.textAlign='left';
  if(descProg<2)showBox("Down we go. Statistically, this rarely ends well.");else box=null;
}
// draw one step (tread quad + riser + side) in iso
function drawStep(s, ox, oy, w, d){
  const dir=s.dir;
  const RISE=STAIR.RISE;
  const poly=(pts,fill,stroke)=>{
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let k=1;k<pts.length;k++)ctx.lineTo(pts[k][0],pts[k][1]);
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
  };
  if(s.landing){
    // A big FLAT platform that bridges the turn: spans well past both flights horizontally
    // and runs deep enough to reach the next flight. Taller riser so it reads as a solid block.
    const halfW = w*1.6;                 // extends on BOTH sides of the pivot
    const lx0 = s.wx - halfW, lx1 = s.wx + halfW;
    const dep = d*3.0;                   // deep platform (bridges toward the next flight)
    const H = RISE*2.2;                  // solid block front face
    // front riser (near depth edge)
    poly([ isoPt(lx0,s.wy,s.wz,ox,oy), isoPt(lx1,s.wy,s.wz,ox,oy),
           isoPt(lx1,s.wy,s.wz-H,ox,oy), isoPt(lx0,s.wy,s.wz-H,ox,oy) ],
         '#7f848e','#5f636c');
    // both side walls so no matter the turn direction there's no exposed gap
    poly([ isoPt(lx1,s.wy,s.wz,ox,oy), isoPt(lx1,s.wy+dep,s.wz,ox,oy),
           isoPt(lx1,s.wy+dep,s.wz-H,ox,oy), isoPt(lx1,s.wy,s.wz-H,ox,oy) ],
         '#6b6f79','#54585f');
    poly([ isoPt(lx0,s.wy,s.wz,ox,oy), isoPt(lx0,s.wy+dep,s.wz,ox,oy),
           isoPt(lx0,s.wy+dep,s.wz-H,ox,oy), isoPt(lx0,s.wy,s.wz-H,ox,oy) ],
         '#767a84','#585c63');
    // top surface (flat landing)
    poly([ isoPt(lx0,s.wy,s.wz,ox,oy), isoPt(lx1,s.wy,s.wz,ox,oy),
           isoPt(lx1,s.wy+dep,s.wz,ox,oy), isoPt(lx0,s.wy+dep,s.wz,ox,oy) ],
         '#dfe2e8','#b4b8c0');
    // subtle seam line marking the far edge of the landing (where the next flight drops away)
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
    const e0=isoPt(lx0,s.wy+dep,s.wz,ox,oy), e1=isoPt(lx1,s.wy+dep,s.wz,ox,oy);
    ctx.beginPath();ctx.moveTo(e0[0],e0[1]);ctx.lineTo(e1[0],e1[1]);ctx.stroke();
    return;
  }
  const x0=s.wx, x1=s.wx+w*dir;
  // riser (front vertical face, at the near depth edge wy, dropping RISE) — drawn first (behind tread)
  poly([ isoPt(x0,s.wy,s.wz,ox,oy), isoPt(x1,s.wy,s.wz,ox,oy),
         isoPt(x1,s.wy,s.wz-RISE,ox,oy), isoPt(x0,s.wy,s.wz-RISE,ox,oy) ],
       '#8b909b','#6c7079');
  // outer side wall (the exposed vertical edge on the flight's leading side)
  const sx=x1;
  poly([ isoPt(sx,s.wy,s.wz,ox,oy), isoPt(sx,s.wy+d,s.wz,ox,oy),
         isoPt(sx,s.wy+d,s.wz-RISE,ox,oy), isoPt(sx,s.wy,s.wz-RISE,ox,oy) ],
       '#71757f','#5b5f68');
  // tread (top surface) — drawn last so it sits on top of its own riser/side
  poly([ isoPt(x0,s.wy,s.wz,ox,oy), isoPt(x1,s.wy,s.wz,ox,oy),
         isoPt(x1,s.wy+d,s.wz,ox,oy), isoPt(x0,s.wy+d,s.wz,ox,oy) ],
       '#c9ccd3','#aeb2ba');
}

  ctx.font='9px '+mono;ctx.fillStyle=ST_GD;ctx.fillText('customizable - coming soon',20,520);
  ctx.strokeStyle=ST_GD;ctx.lineWidth=1;ctx.beginPath();
  [[49,584],[89,584],[129,584]].forEach(n=>{ctx.moveTo(89,550);ctx.lineTo(n[0],n[1]);});ctx.stroke();
  [[89,550],[49,584],[89,584],[129,584]].forEach(n=>{ctx.beginPath();ctx.arc(n[0],n[1],6,0,6.2832);ctx.stroke();});
  // ---- top-right hint panel ----
  ctx.fillStyle=ST_GM;ctx.font='bold 10px '+mono;ctx.fillText('HOW IT WORKS',736,62);
  ctx.font='10px '+mono;
  ['Click the arrow (v) on a','slot to open its list.','Tick a box to wear an item','or untick to take it off.','Neck holds '+ST_CAP.neck+'. Hands and','feet hold '+ST_CAP.hand+' each. Other','spots hold '+ST_CAP.single+'.','','Items are coming soon.'].forEach((l,i)=>ctx.fillText(l,736,82+i*14));
  // ---- Biscuit corner (bottom-right) ----
  const bx0=732,by0=320,bw=158,bh=284;
  ctx.fillStyle='rgba(2,16,24,0.88)';ctx.fillRect(bx0,by0,bw,bh);ctx.strokeStyle=ST_BM;ctx.lineWidth=1;ctx.strokeRect(bx0+.5,by0+.5,bw-1,bh-1);
  ctx.shadowColor=ST_BGLOW;ctx.shadowBlur=10;ctx.fillStyle=ST_B;ctx.font='bold 18px '+mono;ctx.fillText('BISCUIT',bx0+10,by0+24);ctx.shadowBlur=0;
  ctx.shadowColor=ST_BGLOW;ctx.shadowBlur=6;ctx.fillStyle=ST_B;ctx.font='bold 12px '+mono;ctx.fillText('LEVEL '+ST_BISCUIT_LEVEL,bx0+10,by0+39);ctx.shadowBlur=0;
  ctx.strokeStyle=ST_BM;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx0+10,by0+46.5);ctx.lineTo(bx0+bw-10,by0+46.5);ctx.stroke();   // divider, then the role label
  ctx.fillStyle=ST_BM;ctx.font='bold 10px '+mono;ctx.fillText('Companion',bx0+10,by0+59);
  stDrawBiscuit(bx0+bw/2,by0+144,1.08);
  ST_BISCUIT_STATS.forEach((r,i)=>{ const y=by0+164+i*16;
    ctx.font='bold 11px '+mono;ctx.fillStyle=ST_B;ctx.textAlign='left';ctx.fillText(r[0],bx0+10,y);
    ctx.textAlign='right';ctx.font='bold 12px '+mono;ctx.fillText(String(r[1]),bx0+bw-10,y); });
  ctx.textAlign='left';ctx.fillStyle=ST_BM;ctx.font='bold 10px '+mono;ctx.fillText('TOP 3 SKILLS',bx0+10,by0+244);
  { const n=ST_BISCUIT_SKILLS.length, gap=6, sw=((bw-20)-(n-1)*gap)/n;
    ST_BISCUIT_SKILLS.forEach((sk,i)=>stSkillBox(bx0+10+i*(sw+gap),by0+250,sw,30,sk,i,false,true)); }
  // ---- CONTINUE button (Space does the same) ----
  { const b=stNextBtn, g=0.55+0.45*Math.sin(t*0.12);
    ctx.fillStyle='rgba(4,40,16,0.95)';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.save();ctx.shadowColor='#3dff7a';ctx.shadowBlur=8*g;ctx.strokeStyle=ST_G;ctx.lineWidth=1.5;ctx.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1);ctx.restore();
    ctx.fillStyle=ST_G;ctx.font='bold 12px '+mono;ctx.textAlign='center';ctx.fillText('CONTINUE > (Space)',b.x+b.w/2,b.y+17);ctx.textAlign='left';
    stRects.push({x:b.x,y:b.y,w:b.w,h:b.h,kind:'next'}); }
  // open drop-down list goes on top of everything
  if(stOpen){ const s=ST_SLOTS.find(q=>q.id===stOpen); if(s) stDrawPopup(s); }
  // CRT scanlines + moving sweep band
  ctx.fillStyle='rgba(0,0,0,0.16)';for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  { const sy=(t*1.4)%(H+120)-60;const g=ctx.createLinearGradient(0,sy-40,0,sy+40);g.addColorStop(0,'rgba(93,255,138,0)');g.addColorStop(0.5,'rgba(93,255,138,0.05)');g.addColorStop(1,'rgba(93,255,138,0)');ctx.fillStyle=g;ctx.fillRect(0,sy-40,W,80); }
}
// leave the skill tree (placeholder destination: ST_NEXT_STATE) - never restarts the game
function skillTreeAdvance(){ setState(ST_NEXT_STATE); }
function skillTreeClick(mx,my){
  for(let i=stRects.length-1;i>=0;i--){ const r=stRects[i];     // last drawn (popup) wins
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
      if(r.kind==='next') skillTreeAdvance();
      else if(r.kind==='arrow') stOpen=(stOpen===r.id)?null:r.id;
      else if(r.kind==='toggle'){ r.item.setOn(!r.item.isOn()); stFig=null; }
      return; } }
}

function onClick(e){
  const r=cv.getBoundingClientRect();const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  // MUSIC MUTE button (top-right, whenever music plays) — click toggles mute; handled before anything else.
  if(muteShown() && muteHit(mx,my)){
    toggleMute(); return;
  }
  if(state==='TITLE'){
    if(mx>playBtn.x&&mx<playBtn.x+playBtn.w&&my>playBtn.y&&my<playBtn.y+playBtn.h){
      setState('CUTSCENE');cutPhase='intro';introStep=0;cut=0;yellCount=0;showBox(introBeats[0]);
    }
  } else if(state==='CUTSCENE'){
    if(choice){
      for(const rc of choiceRects){ if(mx>rc.x&&mx<rc.x+rc.w&&my>rc.y&&my<rc.y+rc.h){ pickChoice(rc.i); return; } }
    } else advanceCut();
  }
  else if(state==='CREDITS'){   // only the CONTINUE JOURNEY button does anything (no accidental restart)
    const b=replayBtn; if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h) setState('SKILLTREE');
  }
  else if(state==='SKILLTREE') skillTreeClick(mx,my);
}
// replay button rect on the end screen (also drawn in drawCredits)
const replayBtn={x:W/2-125,y:369,w:250,h:34};

// =====================================================================
// MOBILE / TOUCH SUPPORT. Everything below is inert unless a touch device is detected (TOUCH).
// On-screen buttons fire the SAME synthetic keydown/keyup events the keyboard produces (ArrowLeft/Right/Up/Down,
// Space, KeyR, KeyF, KeyE), so physics, pose selection and the movement fixes are untouched.
// Menus/cutscene/credits/skill tree use the existing canvas click handler (taps become clicks).
// Testing aid: add ?touch=1 to the URL to force touch mode on a desktop browser, ?touch=0 to force it off.
// =====================================================================
const TOUCH=(()=>{
  const q=location.search;
  if(/[?&]touch=1/.test(q)) return true;
  if(/[?&]touch=0/.test(q)) return false;
  const mm=s=>{ try{ return matchMedia(s).matches; }catch(e){ return false; } };
  const coarse=mm('(pointer:coarse)'), fine=mm('(hover:hover) and (pointer:fine)');
  return coarse || (!fine && (('ontouchstart' in window) || navigator.maxTouchPoints>0));
})();
let mobPaused=false;      // true while the portrait "rotate your phone" overlay is showing
let mobTick=()=>{};
if(TOUCH){
  document.documentElement.classList.add('touch');
  const VKEY={}, MINHOLD={KeyE:80,Space:50};   // E/Space are polled once per frame: keep a tap down >= a few frames
  const fire=(type,code)=>{ window.dispatchEvent(new KeyboardEvent(type,{code:code,key:'',bubbles:true,cancelable:true})); };
  const vkPress=code=>{
    const v=VKEY[code]||(VKEY[code]={n:0,at:0,tm:0});
    v.n++;
    if(v.tm){ clearTimeout(v.tm); v.tm=0; return; }       // release was pending: key is still down, just keep it
    if(v.n===1){ v.at=performance.now(); fire('keydown',code); }
  };
  const vkRelease=code=>{
    const v=VKEY[code]; if(!v||v.n<=0) return;
    if(--v.n>0) return;
    const rem=(MINHOLD[code]||0)-(performance.now()-v.at);
    if(rem>0){ v.tm=setTimeout(()=>{ v.tm=0; if(v.n===0) fire('keyup',code); },rem); }
    else fire('keyup',code);
  };
  // ---- build the controls ----
  const tc=document.createElement('div'); tc.id='tc';
  tc.innerHTML='<div id="tcL" class="tcc"></div><div id="tcR" class="tcc"></div>';
  document.body.appendChild(tc);
  const rot=document.createElement('div'); rot.id='rot';
  rot.innerHTML='<span class="ic">&#128241;</span>Rotate your phone to landscape';
  document.body.appendChild(rot);
  const tcL=tc.querySelector('#tcL'), tcR=tc.querySelector('#tcR');
  const BTNS=[];
  const mk=(parent,code,label,cls)=>{
    const el=document.createElement('div'); el.className='tcb'+(cls?' '+cls:''); el.innerHTML=label;
    parent.appendChild(el);
    const b={el:el,code:code,cnt:0}; BTNS.push(b);
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); setPtr(e.pointerId,btnAt(e.clientX,e.clientY)||b); });
    return b;
  };
  // left: up/down (= W/S depth lanes) on top, left/right underneath
  mk(tcL,'ArrowUp','&#9650;','arrow'); mk(tcL,'ArrowDown','&#9660;','arrow');
  mk(tcL,'ArrowLeft','&#9664;','arrow'); mk(tcL,'ArrowRight','&#9654;','arrow');
  // right: PUNCH KICK / PICK UP JUMP
  mk(tcR,'KeyR','PUNCH'); mk(tcR,'KeyF','KICK');
  const bUse=mk(tcR,'KeyE','PICK UP'); mk(tcR,'Space','JUMP');
  // ---- multi-touch: each finger (pointerId) holds exactly one button; sliding between buttons works ----
  const ptr=new Map();
  const setOn=(b,on)=>b.el.classList.toggle('on',on);
  function btnAt(x,y){
    for(const b of BTNS){ const r=b.el.getBoundingClientRect(); if(r.width&&x>=r.left-4&&x<=r.right+4&&y>=r.top-4&&y<=r.bottom+4) return b; }
    return null;
  }
  function setPtr(id,b){
    const old=ptr.get(id); if(old===b) return;
    if(old){ vkRelease(old.code); if(--old.cnt<=0){ old.cnt=0; setOn(old,false); } ptr.delete(id); }
    if(b){ b.cnt++; setOn(b,true); vkPress(b.code); ptr.set(id,b); }
  }
  function releaseAll(){ for(const id of Array.from(ptr.keys())) setPtr(id,null); }
  addEventListener('pointermove',e=>{ if(ptr.has(e.pointerId)) setPtr(e.pointerId,btnAt(e.clientX,e.clientY)); });
  addEventListener('pointerup',e=>{ if(ptr.has(e.pointerId)) setPtr(e.pointerId,null); });
  addEventListener('pointercancel',e=>{ if(ptr.has(e.pointerId)) setPtr(e.pointerId,null); });
  addEventListener('lostpointercapture',e=>{ if(ptr.has(e.pointerId)) setPtr(e.pointerId,null); });
  addEventListener('blur',releaseAll);
  addEventListener('pagehide',releaseAll);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) releaseAll(); });
  // ---- no scroll / pinch / double-tap zoom / long-press menu / text selection on the game surface ----
  const stop=e=>e.preventDefault();
  document.addEventListener('touchmove',stop,{passive:false});
  document.addEventListener('touchstart',e=>{ if(e.touches.length>1 || (e.target&&e.target.closest&&e.target.closest('#tc,#rot'))) e.preventDefault(); },{passive:false});
  ['gesturestart','gesturechange','gestureend','contextmenu','selectstart','dragstart'].forEach(n=>document.addEventListener(n,stop,{passive:false}));
  // ---- audio unlock: mobile browsers need a user gesture; resume the Tone/AudioContext on every tap until it runs ----
  const unlock=()=>{ try{ if(window.Tone && Tone.context && Tone.context.state!=='running') Tone.start(); }catch(e){} };
  ['pointerup','touchend','click'].forEach(n=>addEventListener(n,unlock,{passive:true}));
  // ---- layout: buttons sit in the side gutters beside the scaled canvas; if a gutter is too narrow they are lifted above the text panel ----
  // ---- fit-to-screen: the canvas SIZE is pure CSS (html.touch #wrap/canvas), so it tracks the visible area live.
  // JS only reads the visible area (the fixed #wrap box) to place the buttons and detect portrait.
  const wrapEl=document.getElementById('wrap');
  let VV={x:0,y:0,w:innerWidth,h:innerHeight};
  function fit(){
    const pr=wrapEl.getBoundingClientRect();
    VV={x:0,y:0,w:Math.round(pr.width||innerWidth),h:Math.round(pr.height||innerHeight)};
  }
  function layout(){
    fit();
    const vw=VV.w, vh=VV.h;
    const r0=cv.getBoundingClientRect();
    const r={left:r0.left-VV.x,right:r0.right-VV.x,top:r0.top-VV.y,bottom:r0.bottom-VV.y,height:r0.height};
    const s=r.height/H;
    let b=Math.max(56,Math.min(72,Math.round(vh*0.17)));
    const gb=Math.floor((Math.min(r.left,vw-r.right)-22)/2);   // biggest button that still fits the side gutter
    if(gb>=56) b=Math.min(b,gb);
    tc.style.setProperty('--b',b+'px');
    const need=b*2+8+14;
    const lift=Math.max(10,Math.round(vh-(r.top+PANEL_Y*s)+8));   // keep clear of the dialogue panel
    tcL.style.bottom=((r.left>=need)?10:lift)+'px';
    tcR.style.bottom=((vw-r.right>=need)?10:lift)+'px';
  }
  let curMode='', curHi=false;
  function orient(){
    fit();
    const portrait=VV.h>VV.w;
    if(portrait!==mobPaused){ mobPaused=portrait; rot.style.display=portrait?'flex':'none'; if(portrait) releaseAll(); }
    layout();
  }
  // recompute on any change of the visible area (rotation, address bar show/hide, fullscreen); light debounce + late re-checks for slow browsers
  let fitTm=0;
  const refit=()=>{ if(fitTm) return; fitTm=setTimeout(()=>{ fitTm=0; orient(); },30); };
  const refitLate=()=>{ refit(); setTimeout(orient,200); setTimeout(orient,600); };
  addEventListener('resize',refit); addEventListener('orientationchange',refitLate);
  document.addEventListener('fullscreenchange',refitLate); document.addEventListener('webkitfullscreenchange',refitLate);
  if(window.visualViewport){ visualViewport.addEventListener('resize',refit); visualViewport.addEventListener('scroll',refit); }
  orient();
  mobTick=function(){
    const mode=(!mobPaused&&(state==='PLATFORMER'||state==='DESCENT'))?state:'';
    if(mode!==curMode){
      curMode=mode; tc.className=mode?('show'+(mode==='DESCENT'?' pad-only':'')):'';
      if(!mode) releaseAll(); else layout();
    }
    if(mode){   // PICK UP lights up when Pete is in range of an item (same flag that drives the on-screen prompt)
      const hi=(mode==='PLATFORMER')&&!!pickupPrompt;
      if(hi!==curHi){ curHi=hi; bUse.el.classList.toggle('hi',hi); }
    }
  };
}
// ---- 60 fps frame-rate cap ----
// All movement, animation, and timing is authored at 60fps (t increments once per frame,
// physics constants assume ~16.67ms per tick). Cap the loop so fast monitors (120/144Hz)
// don't run the game at double/triple speed.
const TARGET_MS = 1000/60;   // ~16.67ms per tick
let lastFrameTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(mobPaused) return;                  // touch + portrait: "rotate your phone" overlay is up, game paused
  const elapsed = now - lastFrameTime;
  if(elapsed < TARGET_MS - 1) return;   // not time yet — skip this browser frame
  lastFrameTime = now - (elapsed % TARGET_MS); // carry leftover so drift doesn't accumulate
  t++;
  // auto-advance: the "GD IT, BISCUIT!" outburst (beat 0) flows into the shadow walk on its own
  if(state==='CUTSCENE' && cutPhase==='fetch' && cut===0 && t>75){ advanceCut(); }
  // when the shadow finishes walking out, auto-flow to "outside" beat
  if(state==='CUTSCENE' && cutPhase==='fetch' && cut===1 && t>=SHADOW_DONE){ advanceCut(); }

  // GRUMBLE SFX: Pete mutters while walking THROUGH THE BUILDING (fetch beat 1, shadow descent).
  // Keep it ON only during that beat; off everywhere else (covers auto-advance, click-skip, state change).
  const _wantGrumble = (state==='CUTSCENE' && cutPhase==='fetch' && cut===1);
  if(_wantGrumble && !_grOn) startGrumble();
  else if(!_wantGrumble && _grOn) stopGrumble();

  // ===== CUTSCENE one-shot SFX (meow / hiss / collapse), synced to the fetch beats =====
  if(state==='CUTSCENE' && cutPhase==='fetch'){
    // CAT MEOW: on the beats where Biscuit shows a "Meow!" bubble (cut 0 outburst, cut 2 "here cat").
    // Fire once on entering each of those beats (edge-detected via _sfxLastCut).
    if(cut!==_sfxLastCut){
      if(cut===2) playMeow();             // only the cut-2 "Here, cat..." meow (cut-0 meow removed: it covered the muttering)
      if(cut===4){ playHiss(); }          // the world tips over — Biscuit panics & bolts to the shoulder
      _sfxLastCut=cut;
    }
    // COLLAPSE SFX, frame-locked to the cut-4 teeter/fall/land animation (COLLAPSE_DONE=230 @60fps):
    if(cut===4){
      if(!_colIgnited && t>=2){ collapseIgnite(); _colIgnited=true; }           // creak/teeter start
      // debris slams during the fall window (props slam t~70..COLLAPSE_DONE); a slam every ~10 frames
      if(t>=70 && t<COLLAPSE_DONE-10 && t!==_colLastSlamT && t%10===0){ collapseSlam(); _colLastSlamT=t; }
      // the BIG final BOOM right as the building lands flat (~t=212, just before COLLAPSE_DONE)
      if(!_colBoomed && t>=212){ collapseBoom(); _colBoomed=true; }
    }
  } else {
    // left the cutscene fetch phase — reset so a replay re-fires everything
    _sfxLastCut=-1; _colIgnited=false; _colBoomed=false; _colLastSlamT=-1;
  }
  // After the collapse finishes, HOLD on the settled burning rubble so the dust settles and the
  // moment lands (~5s total: the earlier comedic beat + ~3s more before Pete & Biscuit appear on
  // the pile at cut 5). COLLAPSE_DONE(230) + 300 frames ≈ 5s of settled collapse before advancing.
  if(state==='CUTSCENE' && cutPhase==='fetch' && cut===4 && t>=COLLAPSE_DONE+300){ advanceCut(); }
  if(state==='PLATFORMER')updatePlatformer();
  if(state==='DESCENT')updateDescent();
  if(state==='TITLE')drawTitle();else if(state==='CUTSCENE')drawCutscene();
  else if(state==='PLATFORMER'){ if(timeFall)drawTimeFall(); else drawPlatformer();
    if(levelFadeIn>0){ ctx.fillStyle='rgba(0,0,0,'+(levelFadeIn/LEVEL_FADE_FRAMES)+')'; ctx.fillRect(0,0,W,PLAYFIELD_BOTTOM); levelFadeIn--; }
    drawLevelTimer(); }
  else if(state==='DESCENT')drawDescent();else if(state==='CREDITS')drawCredits();
  else if(state==='SKILLTREE')drawSkillTree();
  if(muteShown()) drawMuteBtn();   // mute speaker whenever music plays
  if(state!=='SKILLTREE'){      // the skill tree uses the full 900x620 canvas: no bottom text panel
    drawPanelBase();
    if(state==='CUTSCENE'&&choice) drawChoice();
    else if(box) drawBox();
  }
  if(TOUCH) mobTick();
}
requestAnimationFrame(loop);
</script>
