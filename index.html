<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c16">
<title>Platformer Pete</title>
<style>
  /* ===== MOBILE / TOUCH (only active when the script adds class "touch" to <html>; desktop is unaffected) ===== */
  html.touch,html.touch body{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  /* stage = a fixed box over the VISIBLE area (follows the address bar), minus notch safe areas; canvas fits it by width AND height.
     cqw/cqh = that box's live size (iOS 16+/Chrome 105+); the vw/dvh lines are the fallback for older browsers. */
  html.touch #wrap{position:fixed;left:0;top:0;right:0;bottom:0;width:auto;height:auto;box-sizing:border-box;container-type:size;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
  html.touch canvas{width:min(100vw,calc(100vh*900/620));width:min(100vw,calc(100dvh*900/620));width:min(100cqw,calc(100cqh*900/620));
    height:auto;border-radius:0;box-shadow:none;touch-action:none;}
  #tc{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;display:none;pointer-events:none;touch-action:none;--b:58px;}
  #tc.show{display:block;}
  #tc.pad-only #tcR{display:none;}
  .tcc{position:absolute;display:grid;grid-template-columns:repeat(2,var(--b));grid-auto-rows:var(--b);gap:8px;}
  #tcL{left:calc(env(safe-area-inset-left,0px) + 10px);bottom:10px;}
  #tcR{right:calc(env(safe-area-inset-right,0px) + 10px);bottom:10px;}
  .tcb{pointer-events:auto;touch-action:none;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(20,28,48,.40);border:2px solid rgba(220,235,255,.55);color:rgba(255,255,255,.9);
    font:bold 12px 'Trebuchet MS','Segoe UI',Arial,sans-serif;letter-spacing:.3px;text-shadow:0 1px 2px #000;}
  .tcb.arrow{font-size:calc(var(--b)*.42);}
  .tcb.on{background:rgba(120,190,255,.62);border-color:#fff;}
  .tcb.hi{border-color:#ffe27a;background:rgba(255,200,60,.48);animation:tcpulse .7s ease-in-out infinite alternate;}
  @keyframes tcpulse{from{box-shadow:0 0 4px 1px rgba(255,226,122,.5);}to{box-shadow:0 0 16px 5px rgba(255,226,122,.95);}}
  #rot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#0c0c16;color:#e8f8f2;text-align:center;
    align-items:center;justify-content:center;flex-direction:column;box-sizing:border-box;padding:0 24px;line-height:1.35;font:bold 22px 'Trebuchet MS','Segoe UI',Arial,sans-serif;touch-action:none;}
  #rot .ic{font-size:72px;line-height:1;margin-bottom:14px;display:block;animation:rotp 1.6s ease-in-out infinite;}
  @keyframes rotp{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
  html,body{margin:0;height:100%;background:#0c0c16;overflow:hidden;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  canvas{background:#1a1a2e;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
  /* DESKTOP fit-to-window: scale the 900x620 canvas up or down to the largest size that fits (aspect kept, 12px margin). Clicks already map via getBoundingClientRect. */
  html:not(.touch) canvas{width:min(calc(100vw - 24px),calc((100vh - 24px)*900/620));height:auto;}
</style>

<script>
// =====================================================================
// PLATFORMER PETE — Revision 2. Genesis/Sonic-era visual overhaul.
// TITLE -> CUTSCENE -> PLATFORMER -> DESCENT(perspective stairwell) -> CREDITS
// All characters, world & text original.
// =====================================================================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
// ===== LAYOUT: game viewport on top, dedicated text panel below (two separate areas) =====
const GAME_H=430;              // game viewport height (everything gameplay draws here)
const PANEL_Y=GAME_H+8;        // text panel starts below a small gap
const PANEL_H=H-PANEL_Y;       // dedicated text/dialog panel
let state='TITLE',t=0;
const keys={};
// held-direction helpers: arrow key or WASD (boolean use only)
const kHeldL=()=>keys['ArrowLeft']||keys['KeyA'], kHeldR=()=>keys['ArrowRight']||keys['KeyD'];
const kHeldU=()=>keys['ArrowUp']||keys['KeyW'],   kHeldD=()=>keys['ArrowDown']||keys['KeyS'];
addEventListener('keydown',e=>{keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  // SPACE (or Enter) starts the game from the title, same as clicking PLAY.
  if(state==='TITLE' && (e.code==='Space'||e.code==='Enter')){
    setState('CUTSCENE');cutPhase='intro';introStep=0;cut=0;yellCount=0;showBox(introBeats[0]);return;
  }
  // SPACE on the end screen = CONTINUE JOURNEY -> opens the skill tree (Space never restarts the game).
  if(state==='CREDITS' && e.code==='Space'){ if(!e.repeat) setState('SKILLTREE'); return; }
  // SPACE (or Esc) on the skill tree = CONTINUE (placeholder destination: ST_NEXT_STATE).
  if(state==='SKILLTREE'){ if((e.code==='Space'||e.code==='Escape')&&!e.repeat) skillTreeAdvance(); return; }
  if(state==='CUTSCENE'){
    if(choice){
      if(e.code==='Digit1'||e.code==='Numpad1') pickChoice(0);
      else if(e.code==='Digit2'||e.code==='Numpad2') pickChoice(1);
      else if(e.code==='ArrowUp'||e.code==='KeyW') choice.sel=(choice.sel+choice.options.length-1)%choice.options.length;
      else if(e.code==='ArrowDown'||e.code==='KeyS') choice.sel=(choice.sel+1)%choice.options.length;
      else if(e.code==='Enter'||e.code==='Space') pickChoice(choice.sel);
    } else if(e.code==='Enter'||e.code==='Space') advanceCut();
  }
  // ATTACK INPUT (gameplay only): R = punch, F = kick, each tap/double-tap/hold. Derive a true
  // press-edge from prevR/prevF latches (NOT the auto-repeating keys[] map) so held keys don't
  // retrigger. Feeds the ported lab resolver (keyDown fires the double-tap immediately).
  if(state==='PLATFORMER' && pete && !enteringSub && !timeFall){
    if(e.code==='KeyR' && !prevR){ prevR=true; atkKeyDown(pete.rin,'punch','rin'); }
    if(e.code==='KeyF' && !prevF){ prevF=true; atkKeyDown(pete.fin,'kick','fin'); }
  }});
let prevR=false, prevF=false;   // R/F physical press-edge latches (cleared on keyup)
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(e.code==='KeyR'){ prevR=false; if(pete) atkKeyUp(pete.rin); }
  if(e.code==='KeyF'){ prevF=false; if(pete) atkKeyUp(pete.fin); }
});
// alt-tab / tab hidden: the keyup is never delivered, so drop the held R/F state (no stuck hold -> uppercut/stomp)
addEventListener('blur',()=>releaseAtkKeys());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) releaseAtkKeys(); });
cv.addEventListener('click',onClick);
// ===== LEVEL 1 MUSIC — v7 engine (Tone.js, inlined above). Original big-beat, dark groove. =====
// Ported from MUSIC/LEVEL1/level1_v7.html. One driving groove that stays DARK; A and B share the
// same beat & bass rhythm, B is a deeper tonal shade with on-beat claps. GAME LOOP RULES:
//   - The 3-bar INTRO plays ONCE, on the FIRST time the platformer starts.
//   - After that the music LOOPS the A<->B part only (NO intro) — including on retry/replay.
// Fixed settings baked from the auditioned v7 (Darkness 100%, tempo 132, swing 14%, mood 60%,
// claps 75%). Top-right speaker button toggles mute (points at the Tone master gain).
// Plays in PLATFORMER and SKILLTREE (setState routes it). Pure Web Audio/Tone, no files or links; the
// AudioContext is created lazily on the first START click (browser autoplay rules).

const _M_TEMPO=132, _M_SWING=0.14;

    const hat=new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:0.001,decay:0.04,sustain:0}}).connect(new Tone.Filter(10000,'highpass').connect(out)); hat.volume.value=-13;
    const clapGain=new Tone.Gain(0.6); clapGain.connect(out); clapGain.connect(verb);
    const clapBand=new Tone.Filter(1100,'bandpass');

function setState(s){
  // MUSIC routing (states are mutually exclusive, so stop every engine then start the one for s):
  //   CUTSCENE  -> silence (no background bed)
  //   PLATFORMER-> Level 1 big-beat (v7)          — gameplay
  //   DESCENT   -> "build down v2" cue            — the downstairs mini-game at the end
  //   TITLE / CREDITS -> silence
  // CREDITS carries the DESCENT "build down" music over (the stairwell cue plays into the final
  // screen). If it's already running, leave it; otherwise CREDITS is silent.
  if(s==='CREDITS'){
    stopMusic();                               // stop Level 1, but DON'T stop the descent cue
    state=s;t=0; return;
  }
  peteGlow=0;                                  // no pickup glow carries across states
  stopAllMusic();                              // stops the descent cue too (they share Tone.Transport)
  if(s==='SKILLTREE'){ stOpen=null; stFig=null; startMusic(); }   // skill tree: Level 1 music for now
  if(s==='PLATFORMER') startMusic();
  else if(s==='DESCENT') startDescentMusic();   // CUTSCENE is intentionally SILENT (no background bed)
  state=s;t=0;
}

// ---------------- RUBBLE FRAGMENT PARTICLES (detailed solid debris) ----------------
// Separate from the soft `puffs` (dust) above: these are SHAPED, tumbling SOLID pieces thrown off
// the stairwell rubble pile when Pete punches/kicks it — grey concrete chunks, bent metal/rebar
// shards, red bricks, twisted steel beam bits. Live & draw in WORLD space (inside the -camX camera
// transform) so they stay glued to the scene as the camera pans. The UPDATE is pure state so it can
// run every frame regardless of camera. Capped + culled so the array never grows unbounded.
let rubbleBits=[];
const RUBBLE_BITS_MAX=160;        // hard cap on live fragments (raised for the bigger, more dramatic bursts)
const BIT_GRAV=0.62;              // px/frame^2 at the 60fps cap (matches game GRAV)
// --- fragment visual palettes (kind -> body/lit/shade colors) ---
const BIT_COLORS={
  concrete:['#6a6a72', CONCRETE_LIT, CONCRETE_SHADE],
  brick:   ['#9c4a2e', '#b5633e', '#7a3722'],
  metal:   ['#9aa4b2', '#c9d2dc', '#5c6470'],
  beam:    ['#555b66', '#7f8794', '#2f343c']
};
const BIT_KINDS=['concrete','brick','metal','beam'];
// Spawn a BURST of fragments. mode 'punch' = moderate scatter (arc up, tumble, fall under gravity);
// mode 'kick' = STRONG upward+outward launch so pieces fly off the TOP of the screen.
// cx = world x of the burst, topY = world y (the current pile peak) to spawn from.
function spawnRubbleBits(cx, topY, mode){
  const kick = (mode==='kick');
  // MORE DRAMATIC: bigger bursts, bigger pieces, launched FARTHER. Kicks are explosive — lots of
  // large chunks rocketing up & out, well off the top of the screen; punches throw a hefty scatter.
  const n = kick ? (14 + (Math.random()*7|0)) : (10 + (Math.random()*5|0));  // ~14–20 kick, ~10–14 punch
  for(let i=0;i<n;i++){
    if(rubbleBits.length>=RUBBLE_BITS_MAX) rubbleBits.shift();              // drop oldest to stay capped
    const kind = BIT_KINDS[Math.random()*BIT_KINDS.length|0];
    const beamish = (kind==='beam');
    rubbleBits.push({
      x: cx + (Math.random()*2-1)*34,
      y: topY + (Math.random()*2-1)*18,
      vx: (Math.random()-0.5)*(kick?16:9),                                 // wider outward spread → fly farther
      vy: kick ? -(15+Math.random()*9) : -(6+Math.random()*5),             // kick launches HARD upward (off-screen)
      rot: Math.random()*6.28,
      vrot: (Math.random()-0.5)*(kick?0.9:0.6),                            // faster tumble
      size: beamish ? (16+Math.random()*16) : (7+Math.random()*9),         // BIGGER pieces
      kind,
      life: kick ? (150+(Math.random()*50|0)) : (95+(Math.random()*45|0))  // live longer so big arcs read fully
    });
  }
}
// Integrate every live fragment under gravity + spin; cull dead / off-screen pieces.
function updateRubbleBits(){
  if(!rubbleBits.length) return;
  for(const b of rubbleBits){ b.x+=b.vx; b.y+=b.vy; b.vy+=BIT_GRAV; b.rot+=b.vrot; b.life--; }
  // cull: expired, fallen below the playfield, or far off-screen in world-x past the camera margin
  const camL = camX-120, camR = camX+W+120;
  rubbleBits = rubbleBits.filter(b => b.life>0 && b.y < PLAYFIELD_BOTTOM+60 && b.x>camL && b.x<camR);

    const a = b.life<18 ? Math.max(0, b.life/18) : 1;   // brief fade on the way out
    ctx.save(); ctx.globalAlpha=a; ctx.translate(b.x,b.y); ctx.rotate(b.rot);
    const s=b.size;

function drawPeteBubble(text, offX, offY, freeFloat){

  // freeFloat (optional): when true, the bubble sits in OPEN SKY and its tail points down into
  // empty space just under the box (NOT at Pete), so neither the box nor the pointer overlaps the
  // character — used in the pile fight so the punch/kick + flying debris are never covered.
  offX=offX||0; offY=offY||0;

  const by = Math.max(margin+h, headY - 20 + offY);   // sit above the head (+ higher via offY), never off the top

  else if(layer===1){ r=1.0+Math.random()*0.8; sp=0.5+Math.random()*0.35; }  // medium
  else { r=1.8+Math.random()*1.2; sp=0.9+Math.random()*0.4; }                // big, fast, few

const snap=v=>Math.round(v/PX)*PX;
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(snap(x), snap(y), Math.max(PX,snap(w||1)), Math.max(PX,snap(h||1))); }
function tint(hex, amt){
  if(typeof hex!=='string'||hex[0]!=='#'||hex.length<7) return hex;
  const c=parseInt(hex.slice(1,7),16);
  const cl=v=>v<0?0:v>255?255:v;
  const r=cl(((c>>16)&255)+amt), g=cl(((c>>8)&255)+amt), b=cl((c&255)+amt);
  return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1);
}
// Draw a bone (p0->p1) as a column of pixel blocks with 3-STEP CEL SHADING across the width:
// outline underlay, a HIGHLIGHT column on the lit (-normal) side, the fill core, and a wider
// SHADE band on the dark (+normal) side. Reads rounder/more sculpted than a flat fill. halfW
function pxBone(p0,p1, hw0,hw1, fill, shade, outline){
  const dx=p1.x-p0.x, dy=p1.y-p0.y, len=Math.hypot(dx,dy)||0.0001;
  const steps=Math.max(2, Math.round(len/PX));
  const nx=-dy/len, ny=dx/len;                 // normal
  const hi=tint(fill,34);                      // cel highlight derived from the fill
  for(let s=0;s<=steps;s++){
    const t=s/steps, cx=p0.x+dx*t, cy=p0.y+dy*t, hw=(hw0+(hw1-hw0)*t);
    const wpx=Math.max(1,Math.round(hw*2));     // block width in pixels
    // outline underlay (1px larger each side)
    ctx.fillStyle=outline;
    ctx.fillRect(snap(cx-(hw+1)*PX), snap(cy)-PX, (wpx+2)*PX, 2*PX);
    // fill core
    ctx.fillStyle=fill;
    ctx.fillRect(snap(cx-hw*PX), snap(cy)-PX, wpx*PX, 2*PX);
    // which side is lit vs shaded (light from the -normal side)
    const litLeft = ny<=0;
    // SHADE band on the dark side (2px wide if the limb is thick enough -> deeper cel step)
    const shW = wpx>=5 ? 2 : 1;
    ctx.fillStyle=shade;
    const sxp = litLeft ? snap(cx+(hw-shW)*PX) : snap(cx-hw*PX);
    ctx.fillRect(sxp, snap(cy)-PX, shW*PX, 2*PX);
    // HIGHLIGHT column on the lit side (1px) — the new cel highlight step
    ctx.fillStyle=hi;
    const hxp = litLeft ? snap(cx-hw*PX) : snap(cx+(hw-1)*PX);
    ctx.fillRect(hxp, snap(cy)-PX, PX, 2*PX);
  }
}
// bigFoot (0..1): enlarges the foot into a BIG detailed boot for the stomp (Battletoads smash).
// ===== PORTED FROM CharacterLab2.0.html (rig/art/anim; source of truth) =====
const RIG={ hipH:62, spineLo:16, spineMid:16, spineUp:16, neck:9, headLen:22,
  hipW:8, shoulderW:15, upperArm:27, foreArm:24, thigh:32, shin:32, foot:12, toe:5,
  hand:9, eyeSep:4, eyeFwd:7, spine:48 };   // hand = wrist->knuckle bone (for fighting anim)
const LIMITS={ elbow:[-10,160], knee:[-165,0], neckYaw:[-70,70], neckPitch:[-35,45], spineLean:[-30,45], spineTilt:[-25,25] };
const clampLimit=(v,r)=>Math.max(r[0],Math.min(r[1],v));
function solve(pose){
  const hipShift=pose.hipShift||0, bodyY=pose.bodyY||0;
  const lean=clampLimit(pose.lean||0,LIMITS.spineLean)*DEG, tilt=clampLimit(pose.tilt||0,LIMITS.spineTilt)*DEG;
  const pelvis={x:hipShift, y:-RIG.hipH - bodyY};
  // 3-segment spine with progressive lean
  const segs=[RIG.spineLo,RIG.spineMid,RIG.spineUp]; let sp={x:pelvis.x,y:pelvis.y};
  const spineLower={x:0,y:0}, spineMid={x:0,y:0};
  for(let i=0;i<3;i++){ const a=lean+tilt*0.3+i*lean*0.12;
    sp={x:sp.x+Math.sin(a)*segs[i], y:sp.y-Math.cos(a)*segs[i]};
    if(i===0){spineLower.x=sp.x;spineLower.y=sp.y;} if(i===1){spineMid.x=sp.x;spineMid.y=sp.y;} }
  const shoulderMid={x:sp.x,y:sp.y};
  const neckTip={x:shoulderMid.x+Math.sin(lean)*RIG.neck, y:shoulderMid.y-Math.cos(lean)*RIG.neck};
  const head={x:shoulderMid.x+Math.sin(lean)*(RIG.neck+13), y:shoulderMid.y-Math.cos(lean)*(RIG.neck+13)};
  // head/eye look-at
  let headYaw=clampLimit(pose.headYaw||0,LIMITS.neckYaw)*DEG, headPitch=clampLimit(pose.headPitch||0,LIMITS.neckPitch)*DEG;
  const eyeMid={x:head.x+Math.sin(lean+headYaw)*RIG.eyeFwd, y:head.y-RIG.headLen*0.18+headPitch*6};
  const eyeL={x:eyeMid.x-RIG.eyeSep+headYaw*3, y:eyeMid.y}, eyeR={x:eyeMid.x+RIG.eyeSep+headYaw*3, y:eyeMid.y};
  // facing: explicit yaw if given, else derive from legacy view/sep so old poses still work.
  let yawDeg=pose.yaw;
  if(yawDeg==null) yawDeg = pose.view==='front'?0 : pose.view==='back'?180 : pose.view==='turn'?300 : 70;  // match Lab1
  const proj=Math.cos(yawDeg*DEG), depth=Math.sin(yawDeg*DEG);
  // TWIST (kinetic chain / torso coil): the SHOULDER girdle rotates +twist about the body's
  // vertical axis while the HIP girdle rotates -twist (counter-rotation). Each girdle therefore
  // projects at its OWN effective yaw, which both narrows/widens its socket spread AND re-sorts
  // its near/far side — exactly the hip-leads-then-shoulders-whip coil a punch/kick loads and
  // releases. twist=0 => unchanged from before (every existing pose is identical).
  const tw=clampLimit(pose.twist||0,[-60,60]);   // torso counter-rotation, clamped sane
  const syaw=(yawDeg+tw)*DEG, hyaw=(yawDeg-tw)*DEG;        // shoulders +tw, hips -tw
  const sProj=Math.cos(syaw), sDepth=Math.sin(syaw);      // shoulder girdle projection/depth
  const hProj=Math.cos(hyaw), hDepth=Math.sin(hyaw);      // hip girdle projection/depth
  // sockets: screen x = center - side*half*proj (anatomically correct), depth = side*sin(yaw)
  const sockS=(cx,cy,half,side)=>({x:cx - side*half*sProj, y:cy, z:side*sDepth});   // shoulder socket
  const sockH=(cx,cy,half,side)=>({x:cx - side*half*hProj, y:cy, z:side*hDepth});   // hip socket
  const shR=sockS(shoulderMid.x,shoulderMid.y,RIG.shoulderW,+1), shL=sockS(shoulderMid.x,shoulderMid.y,RIG.shoulderW,-1);
  const hipR=sockH(pelvis.x,pelvis.y,RIG.hipW,+1), hipL=sockH(pelvis.x,pelvis.y,RIG.hipW,-1);
  const rightNear = depth>=0;                              // overall body facing (for leg/arm channel map)
  const shNear=rightNear?shR:shL, shFar=rightNear?shL:shR, hipNear=rightNear?hipR:hipL, hipFar=rightNear?hipL:hipR;
  function limb(root,a1,rel,l1,l2,hinge){ const r1=a1*DEG, r=hinge?clampLimit(rel,hinge):rel, r2=(a1+r)*DEG;
    const j={x:root.x+Math.sin(r1)*l1, y:root.y+Math.cos(r1)*l1};
    const e={x:j.x+Math.sin(r2)*l2, y:j.y+Math.cos(r2)*l2};
    return {root,joint:j,end:e, z:root.z||0}; }
  const legNear=limb(hipNear,pose.nearHip,pose.nearKnee,RIG.thigh,RIG.shin,LIMITS.knee);
  const legFar =limb(hipFar ,pose.farHip ,pose.farKnee ,RIG.thigh,RIG.shin,LIMITS.knee);
  const armNear=limb(shNear ,pose.nearSh ,pose.nearEl,RIG.upperArm,RIG.foreArm,LIMITS.elbow);
  const armFar =limb(shFar  ,pose.farSh  ,pose.farEl ,RIG.upperArm,RIG.foreArm,LIMITS.elbow);
  // HAND bone: a wrist->knuckle segment extending off the arm's wrist (L.end), continuing the
  // forearm's direction so the fist tracks the elbow/shoulder angle. This is the handle future
  // fighting animation drives (jab/cross reach, hook rotation). wrist = root, knuckle = end.
  const hand=(L)=>{ const dx=L.end.x-L.joint.x, dy=L.end.y-L.joint.y, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;                                  // unit along the forearm
    const wrist=L.end;
    const knuckle={x:wrist.x+ux*RIG.hand, y:wrist.y+uy*RIG.hand};
    return {root:wrist, joint:wrist, end:knuckle, z:L.z}; };
  // FOOT bone: ankle->ball->toe. The foot projects FORWARD by the facing (proj) so it points the
  // way he faces (and flattens toward the camera in front/back views), ready for kick anim.
  // FOOT bone MUST match the drawn foot sprite (drawLegPix), which always extends in LOCAL +x
  // from the ankle (the render flip handles A; it is never keyed to proj). Keying the bone to
  // proj flipped it backwards on W (chest faces away, proj<0) while the sprite still pointed +x.
  // So the bone points LOCAL +x always, same as the sprite.
  const foot=(L)=>{ const ankle=L.end;
    const ball={x:ankle.x+RIG.foot, y:ankle.y};
    const toe ={x:ball.x +RIG.toe,  y:ball.y};
    return {root:ankle, ankle, joint:ball, ball, end:toe, toe, toeTip:toe, z:L.z}; };
  const armNearHand=hand(armNear), armFarHand=hand(armFar);
  return { pelvis, spineLower, spineMid, shoulderMid, neckTip, head, lean, tilt,
    eyeL, eyeR, eyeMid, headYaw, headPitch, yawDeg, proj, depth, chestFacing:proj,
    shR, shL, hipR, hipL, shoulderLine:{a:shL,b:shR,mid:shoulderMid}, hipLine:{a:hipL,b:hipR,mid:pelvis},
    legNear, legFar, armNear, armFar, hipNear, hipFar, shNear, shFar,
    handNear:armNearHand, handFar:armFarHand,              // wrist->knuckle fist bones
    footNear:foot(legNear), footFar:foot(legFar), pose };
}

// ======================================================================================
// PORTED FROM CharacterLab6.0 (fighting moves update): code-drawn giant stomp foot, uppercut BIG HAND,
// hit-stop impact FX (flash/rings/starburst/chips/dust clouds) and the stomp ground-shatter. Verbatim lab art;
// the game wrapper (drawPete) supplies the per-frame draw scale + screen caps.
// ======================================================================================
// --- FOOT-LOCAL GEOMETRY EXTENTS (used to size the foot off the rig + cap it to the screen) ---
// The foot art is drawn in a local space; these are its bounding extents in that local space so
// we can translate a desired on-screen SIZE into the per-unit scale `U`.
//   LEN  = heel(x=-14) -> toe(x=20) along the foot's length   (used to match the rest foot's LENGTH)
//   HTAP = sole apex vertical span: toes(y=-39) -> heel(y=20)  (used to match the apex to Pete's HEIGHT)
const FOOT_LOCAL_LEN  = 34;     // foot-local length  (heel->toe)   — keep in sync with the face paths
const FOOT_LOCAL_HTAP = 59;     // foot-local height at the sole apex (toe tip -> heel)
const FOOT_LOCAL_WID  = 26;     // foot-local max width at the apex (sole silhouette, ~-13..13)

// REST SIZE (refinements 1 & 3): when the foot is DOWN on the ground it is drawn the SAME size as
// Pete's NORMAL rendered foot. That real foot is RIG.foot+RIG.toe model units long (the ankle->toe
// bone), drawn in model space, so it already tracks the body/character draw SCALE automatically.
// We derive the per-unit scale so the rest foot's LENGTH == the real foot bone length — LINKED to
// the rig, never hardcoded. If the lab's body scale/zoom changes, this stays matched because the
// whole foot is drawn inside the same model-space SCALE transform as the body.
const FOOT_REST_UNIT = (RIG.foot + RIG.toe) / FOOT_LOCAL_LEN;   // model units per foot-local unit at rest

// PETE'S ON-SCREEN HEIGHT in model units (feet -> top of head), measured off the real solved
// skeleton so the apex foot can be grown to ~Pete's height (refinement 2). Computed LAZILY (and
// memoized) because the pose builder `P` / `BASE` are defined further down the file — calling them
// at load time would hit the temporal-dead-zone. First stomp frame fills it in.
let _peteModelH = 0;
function peteModelH(){
  if(_peteModelH) return _peteModelH;
  const sk=solve(P({view:'side'}));
  const headTop = sk.head.y - RIG.headLen*0.5;      // ~top of the head (head joint is mid-skull)
  const footY   = sk.footNear.ankle.y;              // ground foot
  _peteModelH = Math.abs(footY - headTop);
  return _peteModelH;
}

// GIANT SIZE (refinement 2): the apex foot grows to ~Pete's full standing HEIGHT on screen.
// FOOT_GIANT_SCALE is the easy tweak knob, expressed as a MULTIPLE of Pete's height:
//   1.0  => the giant foot's apex HEIGHT ≈ Pete's full height.  Bump up/down to taste.
// The apex is ALSO clamped to the screen each frame (see _stompScreenCapU in render) so it can
// never grow taller/wider than the canvas (with a small margin). Change this one number to resize.
const FOOT_GIANT_SCALE = 1.0;   // <-- TWEAK ME: apex foot height as a fraction of Pete's height (~1 = his height)
// Apex per-unit scale that makes the sole-apex HEIGHT equal FOOT_GIANT_SCALE * Pete's height.
function footGiantUnit(){ return (peteModelH() * FOOT_GIANT_SCALE) / FOOT_LOCAL_HTAP; }

// Per-frame draw context for the stomp foot, set in render(): the live body SCALE and the
// screen-space cap (max per-unit scale so the drawn foot never exceeds the canvas, with margin).
let _stompBodyScale = 2.5;      // live model->screen SCALE (mirrors render's SCALE); default = base
let _stompScreenCapU = Infinity; // max allowed per-unit U so the apex foot stays inside the canvas
// Deferred giant-stomp-foot draw (refinement 4): drawLegPix stashes the foot's live anchor here
// instead of painting it inline; drawCharacter() paints it LAST so it stays frontmost. null = none.
let _pendingGiantFoot = null;
// PETE 3.0 foot glow-up flag: the cel-foot sub-helpers (drawFootSideCel/drawFootSoleCel/footPixFuzz)
// read module-level palette consts, so drawCodeStompFoot sets this once per draw and the helpers read
// it to pick the v3 skin ramp + rim/AO + brighter nail. false => original foot (byte-identical).
let _v3Foot = false;
const FOOT_BASE_UNIT   = FOOT_REST_UNIT;   // back-compat alias: the 1:1 (rest) per-unit scale
const NAIL = '#fff2df';         // toenail highlight (cel) — palette group 1; tracks skin-hi warmth

// smootherstep for soft cross-fade edges on the roll
function smooth01(x){ x=Math.max(0,Math.min(1,x)); return x*x*x*(x*(x*6-15)+10); }

// ---- SUBTLE 16-BIT FOOT TEXTURE (FIX 3) ----------------------------------------------------
// The giant foot is drawn with smooth Path2D fills (cel-vector), so it looked too clean next to
// Pete's 16-bit PIXEL art (drawLegPix / px() / pxBone, which snap to PX-sized blocks). This adds a
// FAINT pixel "fuzz": a deterministic dither of PX-sized blocks (same PX block size as the rest of
// the lab's pixel art) painted at low alpha INSIDE the foot silhouette, so the foot picks up a
// gentle 16-bit grain without changing its shape or comedic read. It is a per-PX-block checkerish
// scatter in the skin SHADE/HIGHLIGHT tone (one cel step, matching pxBone's shade/hi steps), NOT a
// color change — "16-bit fuzz" = pixel/dither TEXTURE, not blue.
// FOOT_PIX_FUZZ is the easy-tweak knob: 0 = off (pure smooth), ~0.10 = the subtle default, higher =
// grittier. KEEP IT LOW so the foot still reads as the same clean foot, just living in Pete's world.
const FOOT_PIX_FUZZ = 0.10;   // <-- TWEAK ME: strength (alpha) of the 16-bit pixel grain on the foot (0..~0.3; low = subtle)
// Overlay the grain clipped to `clipPath`, over local-space bounds [x0..x1,y0..y1] (foot-local units).
// Deterministic (hashed by block coords) so it's stable per frame and doesn't shimmer when scrubbing.
function footPixFuzz(clipPath, x0, y0, x1, y1){
  if(FOOT_PIX_FUZZ<=0.001) return;
  ctx.save();
  ctx.clip(clipPath);
  const hash=(ix,iy)=>{ const s=Math.sin(ix*127.1+iy*311.7)*43758.5453; return s-Math.floor(s); };  // 0..1 deterministic
  // Walk the foot-local bounds in PX-sized blocks; drop a faint shade/highlight speck on ~half of
  // them in a dither pattern so the fill reads as quantized 16-bit grain rather than smooth vector.
  for(let gy=Math.floor(y0/PX)*PX; gy<=y1; gy+=PX){
    for(let gx=Math.floor(x0/PX)*PX; gx<=x1; gx+=PX){

  g.beginPath(); g.moveTo(194,380); g.quadraticCurveTo(196,356,222,346); g.stroke();     // palm highlight stroke (curved, like the sole gleam)
  for(const i of [2,3]){ const G=F[i], p=G.pts[1], q=G.pts[0], r=G.pts[2]; let dx=r.x-q.x, dy=r.y-q.y; const n=Math.hypot(dx,dy)||1; dx/=n; dy/=n;
    const lx=-dy, ly=dx, h=G.w*0.2, ox=-lx*G.w*0.12, oy=-ly*G.w*0.12;                    // short curved stroke across the first joint, nudged to the lit (left) side
    g.lineWidth=2.8; g.beginPath(); g.moveTo(p.x+ox-lx*h,p.y+oy-ly*h); g.quadraticCurveTo(p.x+ox-dx*G.w*0.14,p.y+oy-dy*G.w*0.14,p.x+ox+lx*h,p.y+oy+ly*h); g.stroke(); }

function bhDrawRaw(g,curls){

function bhFuzz(g,amt){

// curls = [pinky, ring, middle, index, thumb] (0 open .. 1 fully curled). opts: x,y,s (image pos/scale), fuzz, cuff, v3

function drawHandOpen(c2,opts){ drawHand(c2,[0,0,0,0,0],opts); }
function drawHandFist(c2,opts){ drawHand(c2,[1,1,1,1,1],opts); }

// ---- IMPACT presentation (code-drawn, original). 2026-11-15: the POW lettering is gone; the contact is sold by a bloom flash, shockwave rings, a sharp text-free
//      starburst, tapered speed lines, chips and sparkles, all centred on the KNUCKLES and all painted BEHIND the fist. ----
const HIT_COLOR = '#ffd21f';   // starburst body (hot yellow); the rim is orange, the inner flare pale yellow, the core white
const HIT_BURST_R = 2.1;       // <-- TWEAK ME: starburst radius at full pop, as a multiple of the fist width
const HIT_FLASH_R = 3.6;       // <-- TWEAK ME: white bloom radius at the contact, as a multiple of the fist width
const HIT_RING_R  = 4.2;       // <-- TWEAK ME: how far the outer shockwave ring travels, as a multiple of the fist width
const HIT_LINES   = 26;        // radiating speed lines
const HIT_CHIPS   = 20;        // debris chips
const HIT_SPARKS  = 14;        // star sparkles
const HIT_SHAKE_X = 10, HIT_SHAKE_Y = 6;   // <-- TWEAK ME: peak screen shake (px) on the contact stops; eased to zero by HAND_T.shakeEnd (none from the drop on)
const out3=t=>1-Math.pow(1-t,3);
function hitBurstPoly(r,n,seed,inner){
  const pts=[], hs=i=>{ const s=Math.sin((i+seed)*78.233)*43758.5453; return s-Math.floor(s); };
  for(let i=0;i<n*2;i++){ const a=(i/(n*2))*Math.PI*2 - Math.PI/2, o=(i%2===0);
    const rr=o ? r*(0.86+0.28*hs(i)) : r*inner*(0.9+0.2*hs(i+31)); pts.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr}); }
  return pts;
}
function hitPath(pts){ const p=new Path2D(); p.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) p.lineTo(pts[i].x,pts[i].y); p.closePath(); return p; }

function hitFlashK(p){ return (p<=0||p>=0.34) ? 0 : Math.pow(1-clamp((p-0.05)/0.29,0,1),1.5); }   // bloom brightness: full for the first 5 percent (about 29 ms), then fades over about 170 ms

function hitBurstAlpha(p){ return p<=0||p>=0.42 ? 0 : (p>0.2 ? 1-clamp((p-0.2)/0.22,0,1) : 1); }
function hitRingR(fw,k,p){ const t=clamp((p-k*0.07)/0.38,0,1); return t<=0||t>=1 ? 0 : fw*(0.7+(HIT_RING_R-0.7)*out3(t)); }   // k = ring index 0/1
function drawImpactFlash(c2,ox,oy,fw,p){   // big bright white bloom on the knuckles for the contact stop(s)
  const k=hitFlashK(p); if(k<=0) return; const r=hitFlashR(fw,p);
  const gr=c2.createRadialGradient(ox,oy,0,ox,oy,r); gr.addColorStop(0,'rgba(255,255,255,'+k+')'); gr.addColorStop(0.28,'rgba(255,255,255,'+(0.92*k)+')'); gr.addColorStop(0.58,'rgba(255,248,205,'+(0.5*k)+')'); gr.addColorStop(1,'rgba(255,255,255,0)');

  c2.save(); c2.translate(ox,oy); c2.globalAlpha=k; c2.fillStyle='#ffffff'; c2.fill(hitPath(hitBurstPoly(r*0.62,16,5,0.3))); c2.restore();   // sharp white star inside the bloom
}
function drawImpactBurst(c2,ox,oy,fw,p){   // sharp, text-free starburst (layered: orange rim, yellow, pale, white core) centred on the knuckles
  const pop=hitBurstPop(p), al=hitBurstAlpha(p), R=fw*HIT_BURST_R*pop; if(R<0.5||al<=0.01) return;

  for(let i=0;i<L.length;i++){ const q=L[i], path=hitPath(hitBurstPoly(R*q[0],q[3],q[4],q[2])); c2.fillStyle=q[1]; c2.fill(path); if(i===0){ c2.strokeStyle=P_OUT; c2.lineWidth=lw; c2.stroke(path); } }

function drawImpactLines(c2,ox,oy,fw,p){   // tapered radiating speed lines (wide at the base, sharp tip) behind the fist

  c2.restore();
}
function drawShockRings(c2,ox,oy,fw,p){   // two expanding shockwave rings, thicker and wider than before
  for(let k=0;k<2;k++){ const r=hitRingR(fw,k,p); if(r<=0) continue; const t=clamp((p-k*0.07)/0.38,0,1);
    c2.save(); c2.globalAlpha=1-t*t; const lw=fw*(0.3*(1-t)+0.05); c2.lineWidth=lw;
    c2.strokeStyle=P_OUT; c2.beginPath(); c2.arc(ox,oy,r,0,7); c2.stroke();
    c2.strokeStyle=k?'#ffd21f':'#ffffff'; c2.lineWidth=lw*0.55; c2.beginPath(); c2.arc(ox,oy,r,0,7); c2.stroke(); c2.restore(); }
}
function drawDebrisSparks(c2,ox,oy,fw,p){   // flying chips (tan rock/plaster bits) and star sparkles; painted behind the fist

    for(let i=0;i<N;i++){ const h1=fxHash(i,21), h2=fxHash(i,22), h3=fxHash(i,23);
      const a=-Math.PI*(0.05+0.9*(i+0.5)/N)+(h1-0.5)*0.3, v=0.8+1.0*h2, x=ox+Math.cos(a)*v*fw*p*4.6, y=oy+Math.sin(a)*v*fw*p*4.6+fw*3.4*p*p, s=fw*(0.07+0.08*h3), rot=p*(6+8*h1)+i;

      c2.beginPath(); c2.moveTo(-s,-s*0.6); c2.lineTo(s*0.9,-s*0.8); c2.lineTo(s,s*0.5); c2.lineTo(-s*0.4,s*0.9); c2.closePath(); c2.fill(); c2.stroke(); c2.restore(); } }
  for(let i=0;i<HIT_SPARKS;i++){ const h1=fxHash(i,31), h2=fxHash(i,32), t=clamp((p-0.02-0.04*h1)/0.4,0,1); if(t<=0||t>=1) continue;
    const a=(i/HIT_SPARKS)*Math.PI*2+h1, d=fw*(1.2+1.5*h2), r=fw*(0.1+0.18*h2)*Math.sin(t*Math.PI)*1.2, x=ox+Math.cos(a)*d, y=oy+Math.sin(a)*d*0.85-fw*0.2*t;
    c2.save(); c2.translate(x,y); c2.rotate(0.3*t); c2.fillStyle=(i&1)?'#fff7b0':'#ffffff'; c2.strokeStyle=P_OUT; c2.lineWidth=Math.max(1,r*0.2); c2.lineJoin='round';
    c2.beginPath(); c2.moveTo(0,-r); c2.lineTo(r*0.22,-r*0.22); c2.lineTo(r,0); c2.lineTo(r*0.22,r*0.22); c2.lineTo(0,r); c2.lineTo(-r*0.22,r*0.22); c2.lineTo(-r,0); c2.lineTo(-r*0.22,-r*0.22); c2.closePath(); c2.fill(); c2.stroke(); c2.restore(); }
}
function fxHash(i,k){ const s=Math.sin(i*12.9898+k*78.233)*43758.5453; return s-Math.floor(s); }
// ---- DUST CLOUDS billowing away (code-drawn, original): clusters of overlapping circles, dark outline, warm tan body, shade crescent + light highlight ----
const CLOUD_PUFFS = 17;                 // <-- 14..20 puffs
const CLOUD_BODY='#cbb99c', CLOUD_SHADE='#9b886d', CLOUD_HI='#f3e9d6';
const CLOUD_LOBES=[[0,0,1.0],[-0.62,0.22,0.72],[0.64,0.18,0.74],[-0.22,-0.56,0.70],[0.32,-0.5,0.62]];   // [dx,dy,r] in puff radii
let _cloudCv=null;
// one puff into the 256x256 scratch canvas (radius 62 px), then stamped scaled with the puff's alpha (so overlapping passes never show through)
function cloudStampPuff(c2,x,y,r,alpha){
  if(!_cloudCv){ _cloudCv=document.createElement('canvas'); _cloudCv.width=_cloudCv.height=256; }
  const g=_cloudCv.getContext('2d'), R0=62, OL=7; g.clearRect(0,0,256,256);
  const circ=(L,f)=>{ g.beginPath(); g.arc(128+L[0]*R0,128+L[1]*R0,L[2]*R0+f,0,7); };
  g.fillStyle=P_OUT; for(const L of CLOUD_LOBES){ circ(L,OL); g.fill(); }
  g.fillStyle=CLOUD_BODY; for(const L of CLOUD_LOBES){ circ(L,0); g.fill(); }
  for(const L of CLOUD_LOBES){   // shade crescent (lower right) per lobe
    g.save(); circ(L,0); g.clip(); g.fillStyle=CLOUD_SHADE; g.globalAlpha=0.85; g.fillRect(0,0,256,256);
    g.fillStyle=CLOUD_BODY; g.globalAlpha=1; g.beginPath(); g.arc(128+L[0]*R0-0.16*L[2]*R0,128+L[1]*R0-0.22*L[2]*R0,L[2]*R0*1.02,0,7); g.fill(); g.restore();
  }
  g.fillStyle=CLOUD_HI; g.globalAlpha=0.9; for(const L of CLOUD_LOBES){ g.beginPath(); g.ellipse(128+L[0]*R0-0.34*L[2]*R0,128+L[1]*R0-0.4*L[2]*R0,0.3*L[2]*R0,0.2*L[2]*R0,-0.5,0,7); g.fill(); } g.globalAlpha=1;
  c2.save(); c2.globalAlpha=alpha; try{ c2.imageSmoothingEnabled=true; c2.imageSmoothingQuality='high'; }catch(e){}
  const s=r/R0; c2.drawImage(_cloudCv,x-128*s,y-128*s,256*s,256*s); c2.restore();
}
// c = 0..1 cloud progress from the impact point (fx,fy), fw = full fist width (model units). Stages (spread over the top, the drop and the reset):
//  (a) first stops: small puffs pop out at the fist | (b) expand | (c) billow outward + up (puffs grow and wobble) | (d) drift away and fade out by the final frame
function drawDustClouds(c2,fx,fy,fw,c){
  if(c<=0) return;
  const fade = c<0.55 ? 1 : 1-clamp((c-0.55)/0.43,0,1); if(fade<=0.01) return;
  const N=CLOUD_PUFFS;
  for(let i=0;i<N;i++){
    const h1=fxHash(i,1), h2=fxHash(i,2), h3=fxHash(i,3), h4=fxHash(i,4);
    const ang=-Math.PI/2 + ((i+0.5)/N-0.5)*Math.PI*1.9 + (h1-0.5)*0.25;   // fan over the top and both sides
    const d=0.05*h2, t=clamp((c-d)/(1-d),0,1); if(t<=0) continue;
    const dist=fw*(0.45+1.8*out3(t))*(0.78+0.42*h3);
    const px=fx+Math.cos(ang)*dist*1.2, py=fy+Math.sin(ang)*dist*0.85 - fw*1.0*t*(0.4+h4);   // outward, then drifting up
    const base=fw*(0.24+0.18*h4);
    const grow=0.35+1.35*out3(clamp(t*2.2,0,1)), wob=1+0.09*Math.sin(c*26+i*1.9);              // billow: grows and wobbles
    cloudStampPuff(c2,px,py,base*grow*wob,fade);
  }
}
// Paint the deferred big hand + fanfare + CRUNCH + clouds. Called LAST from drawCharacter (frontmost).
function drawPendingBigHand(v3){
  const h=_pendingBigHand; if(!h) return; _pendingBigHand=null;
  const U=bigHandUnit(h.g,h.pop), AY=HAND_ANCHOR.y+HAND_WRIST_SHIFT*handWristShiftK(h.g);   // AY = art y that sits on the wrist: the hand extends OUT from the end of the arm
  ctx.save();
  ctx.translate(h.x,h.y);
  if(h.flip) ctx.scale(-1,1);                                  // undo the facing flip: keep a LEFT hand seen from the palm in both facings
  if(h.st!==1) ctx.scale(Math.sqrt(h.st),1/h.st);              // undo the squash/stretch so the hand art is never distorted
  const mC=(h.curls[0]+h.curls[1]+h.curls[2]+h.curls[3])/4, topArt=100+160*mC;   // art y of the highest fingertip (open ~100, fist ~260)
  if(h.g>0){ // keep the whole hand on the canvas: if the raised wrist is near the top/side edge, slide the hand back inside (it then overlaps the head, frontmost)
    const mg=6, m0=ctx.getTransform(), topS=m0.f-(AY-topArt)*U*m0.d, hw=HAND_ART_OPEN_W*0.5*U*Math.abs(m0.a)*(1-0.35*mC);
    let ddy=0, ddx=0; if(topS<mg) ddy=(mg-topS)/m0.d;
    if(m0.e-hw<mg) ddx=(mg-(m0.e-hw))/m0.a; else if(m0.e+hw>W-mg) ddx=((W-mg)-(m0.e+hw))/m0.a;
    ctx.translate(ddx,ddy); }
  const rotArm = clamp(h.tilt*HAND_TILT,-1.2,1.2);             // forearm tilt in the (now screen-aligned) frame
  const rotUp = HAND_UP_ANGLE*Math.PI/180*(h.facing||1);       // vertical target (absolute, screen frame; + leans toward the facing direction)
  const rot = rotArm + (rotUp-rotArm)*(h.up||0);               // eased turn to vertical after the curl (h.up 0..1), back again in the reset
  const up=(d)=>({x:Math.sin(rot)*d, y:-Math.cos(rot)*d});     // point d art-px "up" the hand from the anchor, in model units*U
  const fc = up((AY-345)*U);                        // fist centre
  const fcI = {x:Math.sin(rotUp)*(AY-345)*U, y:-Math.cos(rotUp)*(AY-345)*U};   // fist centre at the impact (the fist is vertical then): the fanfare + clouds stay put while the fist turns back
  const fwFull = HAND_ART_FIST_W*handGiantUnit();              // fanfare is sized to the FULL fist, so it does not shrink with the hand
  // impact point = where the fist was at the top; the fanfare and clouds stay there while Pete drops (offset from the current fist)
  const mI=ctx.getTransform(), ox=fcI.x+(h.ix||0), oy=fcI.y+(h.iy||0)+(h.ilift||0)/mI.d;
  // impact effects are centred on the KNUCKLES (top of the vertical fist at the contact) and painted BEFORE the hand, so they never cover the fist
  const Uc=bigHandUnit(1,1), kx=ox+Math.sin(rotUp)*(345-260)*Uc, ky=oy-Math.cos(rotUp)*(345-260)*Uc;
  if(h.hit>0){ drawImpactFlash(ctx,kx,ky,fwFull,h.hit); drawShockRings(ctx,kx,ky,fwFull,h.hit); drawImpactLines(ctx,kx,ky,fwFull,h.hit); drawImpactBurst(ctx,kx,ky,fwFull,h.hit); }
  if(h.cloud>0) drawDustClouds(ctx,ox,oy,fwFull,h.cloud);        // clouds are drawn BEHIND the hand
  if(h.hit>0) drawDebrisSparks(ctx,kx,ky,fwFull,h.hit);          // chips + sparkles also behind the fist
  if(h.g>0) drawBigHand(ctx,0,0,U,h.curls,{rot:rot,cuff:true,v3:v3,anchorY:AY});
  ctx.restore();
}

// FACE A — the GROUNDED foot, drawn as a THREE-QUARTER (2/3) view so the resting start/end foot
// reads as belonging to Pete's 3/4 directional stance (refinement 5), NOT a flat pure profile.
// We keep the SAME local frame as before so the heel-pivot roll stays continuous and natural:
//   • heel stays the pivot at x=-14, ground line y=0, toes toward +x, ankle up -y
//   • LENGTH still spans ~x=-14 -> ~x=20  (FOOT_LOCAL_LEN unchanged)
// The 3/4 read comes from (a) a visible TOP-OF-FOOT instep plane angled toward the viewer and
// (b) a splayed cluster of toe-TOPS (you see the tops of the toes, not just an edge), with the
// outer side of the foot shaded away. `tw` drives the little toe-bump wiggle.
function drawFootSideCel(tw, wiggleAmt){
  // v3 foot glow-up ramp (read the module flag set by drawCodeStompFoot). All default to the base
  // skin consts when !_v3Foot so the original foot is byte-identical.
  const FK=_v3Foot?P_SKIN3:P_SKIN, FKs=_v3Foot?P_SKINS3:P_SKINS, FKh=_v3Foot?P_SKINH3:P_SKINH;
  const FNAIL=_v3Foot?NAIL3:NAIL, FRIM=_v3Foot?P_RIM3:P_SKINH, FAO=_v3Foot?P_AO3:P_SKINS;
  const blob=(p,fill)=>{ ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=P_OUT; ctx.lineWidth=2.2; ctx.stroke(p); ctx.fillStyle=fill; ctx.fill(p); ctx.restore(); };
  // MAIN FOOT MASS — sole on the ground (y=0), swelling WIDER toward the viewer across the top of
  // the foot so the instep reads as a tilted plane (3/4), then up the ankle. Heel pivot kept at -14.
  const body=new Path2D();
  body.moveTo(-14,0);                                 // heel at the ground (pivot)
  body.quadraticCurveTo(-6,2.0,5,2.0);                // sole along the ground
  body.quadraticCurveTo(13,2.0,19,0.5);               // ball -> toe base on the ground
  body.quadraticCurveTo(22,-1.5,20.5,-6);             // forefoot rounds up to the toe tops
  body.quadraticCurveTo(17,-9.5,10,-9.5);             // TOP-OF-FOOT ridge (instep) tilted to viewer
  body.quadraticCurveTo(3,-10,-1,-15);                // instep rises toward the ankle front
  body.quadraticCurveTo(-3,-22,-6,-28);               // front of the ankle up
  body.quadraticCurveTo(-11,-27,-13.5,-20);           // back of the ankle / Achilles
  body.quadraticCurveTo(-15.5,-11,-14,0);             // heel curve back to the ground
  body.closePath();
  blob(body,FK);
  // TOE TOPS — a splayed 3/4 cluster (big toe nearest the viewer/front, smaller toes behind it),
  // each showing its TOP so the forefoot reads angled toward the camera rather than edge-on.
  const toes=[{x:19.5,y:-4.5,r:2.4},{x:17.0,y:-7.2,r:2.0},{x:14.0,y:-8.6,r:1.7},{x:11.2,y:-9.2,r:1.4}];
  for(let i=0;i<toes.length;i++){ const to=toes[i], wob=Math.sin(tw*0.012+i*1.1)*0.8*wiggleAmt;
    const p=new Path2D(); p.ellipse(to.x+wob,to.y,to.r,to.r*0.9,0,0,7); blob(p,FK); }
  // SHADING — read the top plane as lit, the outer side as shaded, giving the 3/4 solidity.
  ctx.save(); ctx.clip(body);
  // lit top-of-foot (instep) plane — the surface tilted toward the viewer
  ctx.globalAlpha=0.55; ctx.fillStyle=FKh; ctx.beginPath(); ctx.ellipse(6,-9,11,4.5,-0.25,0,7); ctx.fill();
  // ankle front highlight
  ctx.globalAlpha=0.45; ctx.fillStyle=FKh; ctx.beginPath(); ctx.ellipse(-5,-18,4,7,-0.1,0,7); ctx.fill();
  // outer-side shade (the side rolling away from camera) + heel shade
  ctx.globalAlpha=0.4; ctx.fillStyle=FKs; ctx.beginPath(); ctx.ellipse(-12,-15,5,9,0,0,7); ctx.fill();
  ctx.globalAlpha=0.38; ctx.fillStyle=FKs; ctx.beginPath(); ctx.ellipse(3,0.5,16,3,0,0,7); ctx.fill();
  // instep crease line separating the top plane from the toes (sells the 3/4 fold)
  ctx.globalAlpha=0.35; ctx.strokeStyle=FKs; ctx.lineWidth=1.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-11); ctx.quadraticCurveTo(-5,-6,-9,-2); ctx.stroke();
  if(_v3Foot){
    // v3 foot: AAA rim on the lit top-of-foot silhouette + AO in the arch/instep crease
    ctx.globalAlpha=0.9; ctx.strokeStyle=FRIM; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(-6,-28); ctx.quadraticCurveTo(10,-13,20.5,-6); ctx.stroke();  // lit top edge
    ctx.globalAlpha=0.5; ctx.strokeStyle=FAO; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-12,-6); ctx.quadraticCurveTo(-6,-2,2,-1); ctx.stroke();        // arch AO
  }
  ctx.restore();
  // SUBTLE 16-bit pixel grain over the foot mass (FIX 3) — clipped to the body silhouette so the
  // smooth cel foot picks up Pete's PX-block texture. Bounds cover the side-face local extents.
  footPixFuzz(body, -16, -29, 23, 3);
  // tiny toenail highlights on the toe TOPS — reinforces that we see the tops (3/4), cel style
  ctx.save();
  for(let i=0;i<toes.length;i++){ const to=toes[i], wob=Math.sin(tw*0.012+i*1.1)*0.8*wiggleAmt;
    ctx.globalAlpha=0.8; ctx.fillStyle=FNAIL; ctx.beginPath();
    ctx.ellipse(to.x+wob, to.y-to.r*0.35, to.r*0.45, to.r*0.5, 0,0,7); ctx.fill(); }
  ctx.restore();
}

// FACE B — SOLE (bottom). Toes raised above the ball, each with a nail + wiggle; arch crease; gleam.
function drawFootSoleCel(tw, wiggleAmt){
  const FK=_v3Foot?P_SKIN3:P_SKIN, FKs=_v3Foot?P_SKINS3:P_SKINS, FKh=_v3Foot?P_SKINH3:P_SKINH;
  const FNAIL=_v3Foot?NAIL3:NAIL;
  const blob=(p,fill)=>{ ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=P_OUT; ctx.lineWidth=2.2; ctx.stroke(p); ctx.fillStyle=fill; ctx.fill(p); ctx.restore(); };
  const toes=[{x:-9.0,y:-37,r:3.7},{x:-3.8,y:-39,r:3.1},{x:1.3,y:-39,r:2.7},{x:6.0,y:-38,r:2.3},{x:10.2,y:-35,r:2.0}];
  const body=new Path2D();
  body.moveTo(-11,-24); body.quadraticCurveTo(-15,-30,-9,-31); body.quadraticCurveTo(2,-33,12,-30);
  body.quadraticCurveTo(16,-27,13,-22); body.quadraticCurveTo(10,-12,7,-6); body.quadraticCurveTo(13,2,11,10);
  body.quadraticCurveTo(8,20,0,20); body.quadraticCurveTo(-8,20,-11,10); body.quadraticCurveTo(-13,2,-7,-6);
  body.quadraticCurveTo(-10,-12,-11,-24); body.closePath();
  const toePaths=toes.map((to,i)=>{ const wob=Math.sin(tw*0.012+i*1.1)*1.8*wiggleAmt;
    const p=new Path2D(); p.ellipse(to.x,to.y-wob,to.r,to.r*1.35,0,0,7); return {p,to,wob}; });
  for(const {p} of toePaths) blob(p,FK);
  blob(body,FK);
  ctx.save(); ctx.clip(body);
  ctx.globalAlpha=0.55; ctx.fillStyle=FKh; ctx.beginPath(); ctx.ellipse(0,-26,13,6,0,0,7); ctx.fill();
  ctx.globalAlpha=0.4; ctx.fillStyle=FKs; ctx.beginPath(); ctx.ellipse(0,-16,11,6,0,0,7); ctx.fill();
  ctx.globalAlpha=0.5; ctx.strokeStyle=FKs; ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-5,-8); ctx.quadraticCurveTo(2,2,-2,12); ctx.stroke();
  ctx.globalAlpha=0.4; ctx.fillStyle=FKs; ctx.beginPath(); ctx.ellipse(0,12,8,6,0,0,7); ctx.fill();
  if(_v3Foot){ ctx.globalAlpha=0.45; ctx.strokeStyle=P_AO3; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-6,-6); ctx.quadraticCurveTo(2,4,-2,14); ctx.stroke(); }  // v3 deeper arch AO
  ctx.restore();
  // SUBTLE 16-bit pixel grain over the sole mass (FIX 3) — clipped to the sole silhouette.
  footPixFuzz(body, -16, -34, 17, 21);
  for(const {p,to,wob} of toePaths){ ctx.save(); ctx.clip(p);
    ctx.globalAlpha=0.6; ctx.fillStyle=FKh; ctx.beginPath(); ctx.ellipse(to.x-0.4,to.y-wob-0.8,to.r*0.7,to.r*0.8,0,0,7); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle=FNAIL; ctx.beginPath(); ctx.ellipse(to.x,to.y-wob-to.r*0.5,to.r*0.5,to.r*0.6,0,0,7); ctx.fill(); ctx.restore(); }
  ctx.save(); ctx.globalAlpha=0.75; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-9,-25); ctx.quadraticCurveTo(0,-29,9,-24); ctx.stroke(); ctx.restore();
}

// The code-drawn stomp foot, anchored to the real foot bone (ankle = fx,fy), rolling with tilt.
// Replaces drawGiantFootFront's sprite. `tilt` 0..1 = roll (0 flat/side, 1 sole-up apex); `bigFoot`
// 0..1 = the 1:1 -> FOOT_GIANT_SCALE growth; `tw` gates toe wiggle + gleam; `legJoint` = knee.
function drawCodeStompFoot(fx, fy, bigFoot, tw, tilt, legJoint, flat, v3){
  _v3Foot = !!v3;   // PETE 3.0 foot glow-up: the cel sub-helpers read this flag (reset at the end)
  const r = Math.max(0,Math.min(1, tilt||0));          // roll amount (same as the harness `rot`)
  const wiggleAmt = Math.min(1, Math.abs(tw||0));       // wiggle gate (0 = locked, 1 = free)
  flat = flat||0;
  const bf = Math.max(0,Math.min(1, bigFoot||0));
  // SIZE (refinements 1-3): per-unit scale `U` is in MODEL space (the whole foot is drawn inside
  // render's body SCALE transform, so U automatically tracks the body/character scale/zoom).
  //   bigFoot=0 (DOWN on the ground) -> FOOT_REST_UNIT: the foot's LENGTH matches Pete's real
  //                                     rendered foot (RIG.foot+RIG.toe), so start/end == his foot.
  //   bigFoot=1 (APEX)               -> footGiantUnit(): the foot's HEIGHT ≈ Pete's full height.
  // The apex end is CLAMPED to the screen (_stompScreenCapU, set per-frame in render) so the giant
  // foot can never grow past the canvas. The clamp only ever shrinks the giant end, never the rest.
  const giantU = Math.min(footGiantUnit(), _stompScreenCapU);   // screen-capped giant per-unit scale
  const U = FOOT_REST_UNIT + (giantU - FOOT_REST_UNIT) * bf;

  // ---- ANKLE WEDGE REMOVED (STICK ROOT CAUSE) ----
  // This used to draw a thin skin quad from the KNEE (legJoint) down to the ankle to "attach" the
  // foot to the leg. Because it tapered to a ~2.4u point at the knee and ran the full knee->ankle
  // length, it poked out ABOVE/past the giant foot's silhouette during the lift/apex as the thin
  // "stick" the user kept reporting. It is unnecessary: the leg's OWN original calf (drawLegPix)
  // already connects knee->ankle, and the giant foot is anchored right at the ankle (fx,fy) and
  // drawn frontmost, so the foot reads as attached without any extra connector. `legJoint` is kept
  // in the signature for call-site compatibility but is no longer drawn.
  void legJoint;

  // ---- HEEL-PIVOT ROLL (from the harness). The heel is the pivot: as r 0->1 the forefoot/toes
  //      arc UP toward the viewer and the sole comes into view. Foreshortening is ALONG THE LENGTH
  //      (heel->toe axis), never a width squash — so there is no zero-width edge-on flip frame. ----
  const pitch   = r*Math.PI*0.5;
  const lenFore = Math.cos(pitch);
  const lift    = Math.sin(pitch);
  const lenScale= 0.34 + 0.66*lenFore;                 // length (x) foreshorten: 1 flat -> ~0.34 to camera
  const soleIn  = smooth01((r-0.30)/0.42);             // sole fades in r~.30 -> .72
  const sideIn  = 1 - smooth01((r-0.22)/0.40);         // side fades out (small overlap, no pop)
  const heelX   = -14;                                 // heel x in SIDE local space (the pivot)

  // SIDE face — pivots about the planted heel, foreshortened along its length.
  if(sideIn>0.01){
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(U*(1+0.30*flat), U*(1-0.34*flat));
    ctx.globalAlpha = sideIn;
    ctx.translate(heelX, 0);
    ctx.transform(lenScale, 0, 0, 1, 0, 0);            // compress length toward the heel
    ctx.transform(1, 0, -lift*1.1, 1, 0, 0);           // shear: forefoot rises, heel stays grounded
    ctx.translate(-heelX, 0);
    drawFootSideCel(tw||0, wiggleAmt);
    ctx.restore();
  }
  // SOLE face — fades in as the foot reaches sole-up; length un-foreshortens 0.5 -> 1.
  if(soleIn>0.01){
    ctx.save();
    ctx.translate(fx, fy);
    const soleLen = 0.5 + 0.5*lift;
    ctx.scale(U*(1+0.30*flat), U*soleLen*(1-0.34*flat));
    ctx.globalAlpha = soleIn;
    drawFootSoleCel(tw||0, wiggleAmt);
    ctx.restore();
  }

  // ---- Mr-Clean 4-point SPARKLE gleam — only near the sole-up apex + while still wiggling. ----
  if(r>0.6 && wiggleAmt>0.15){
    const wig = tw||0;
    ctx.save(); ctx.translate(fx, fy); ctx.scale(U,U);
    const ph=(o)=>{ const v=Math.sin(wig*2.2+o); return (v>0?v:0)*wiggleAmt; };
    const star=(a,b,size,alpha)=>{ if(alpha<=0.02) return; ctx.save(); ctx.translate(a,b); ctx.globalAlpha=alpha;
      const bl=ctx.createRadialGradient(0,0,0,0,0,size*1.8); bl.addColorStop(0,'rgba(255,255,255,'+(0.9*alpha)+')'); bl.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=bl; ctx.beginPath(); ctx.arc(0,0,size*1.8,0,7); ctx.fill(); ctx.fillStyle='#fff';
      const pt=(ang,len,wd)=>{ ctx.save(); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(0,-len); ctx.lineTo(wd,0); ctx.lineTo(0,len); ctx.lineTo(-wd,0); ctx.closePath(); ctx.fill(); ctx.restore(); };
      pt(0,size,size*0.22); pt(Math.PI/2,size,size*0.22); pt(Math.PI/4,size*0.5,size*0.13); pt(-Math.PI/4,size*0.5,size*0.13); ctx.restore(); };
    star(-9,-43, 2.8*(0.6+ph(0)),   ph(0));
    star( 7,-42, 2.3*(0.6+ph(1.7)), ph(1.7));
    star( 0,-20, 2.0*(0.6+ph(3.4)), ph(3.4));
    ctx.restore();
  }
  _v3Foot = false;   // reset the foot glow-up flag so other draws aren't affected
}
// ============================================================================
// STOMP IMPACT VFX — radial BROKEN GROUND with a RED molten inner glow.
// Replaces the old forward-fan "earthquake" cracks. On impact the ground SHATTERS in a full 360°
// ring AROUND Pete: fractured plates pushed outward with glowing gaps between them, hot red/orange
// light leaking from WITHIN the breaks (brightest in the crack gaps, like lava under the plates).
// It EXPANDS outward with the crack timeline value `gc` (0..1) and FADES as gc eases back down, so
// step-mode scrubbing drives it frame-by-frame. Drawn in flat SCREEN space on the ground plane.
//   cx,gy  = impact point (strike foot screen x, ground contact y)
//   gc     = pose._groundCrack 0..1 (expand + intensity); scale = live body SCALE (keeps it sized to Pete)
// ---- EASY-TWEAK KNOBS (change these to retune size / spread / glow) ----
const SHATTER_REACH      = 300;   // base radius of the broken-ground ring at full gc (× SCALE/2.5) — bigger = wider spread
const SHATTER_FLATTEN    = 0.34;  // vertical squash of the ground ellipse (lower = flatter "on the floor" perspective)
const SHATTER_PLATES     = 14;    // number of fractured ground plates around the 360° ring
const SHATTER_GLOW_ALPHA = 0.85;  // peak intensity of the RED inner glow (0..1)
const SHATTER_CHIPS      = 14;    // flung debris chips kicked up around the ring
function drawStompShatter(cx, gy, gc, scale){
  const g = Math.max(0, Math.min(1, gc));
  const reach = SHATTER_REACH*(scale/2.5)*g;            // current ring radius (grows with gc)
  if(reach < 1) return;
  const fy = SHATTER_FLATTEN;                           // ground-plane vertical foreshorten
  ctx.save(); ctx.translate(cx, gy);
  ctx.save(); ctx.scale(1, fy);                         // squash everything onto the ground plane

  // (1) MOLTEN UNDER-GLOW: a hot pool leaking up through the broken ground — reddest in the center,
  //     fading out to the ring edge. This is the "red glow from within" base.
  const pool = ctx.createRadialGradient(0,0,2, 0,0,reach);
  pool.addColorStop(0.0, 'rgba(255,230,120,'+(SHATTER_GLOW_ALPHA*g)+')');     // white-hot core
  pool.addColorStop(0.35,'rgba(255,110,30,' +(0.70*SHATTER_GLOW_ALPHA*g)+')'); // orange
  pool.addColorStop(0.75,'rgba(200,30,20,'  +(0.45*SHATTER_GLOW_ALPHA*g)+')'); // deep red
  pool.addColorStop(1.0, 'rgba(140,10,10,0)');                                 // fade out
  ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0,0,reach,0,7); ctx.fill();

  // (2) SHATTERED PLATES: wedge-shaped ground slabs pushed OUTWARD in a full ring, each separated by
  //     a glowing gap so red light shows BETWEEN them. Dark rock on top, hot glow in the gaps.
  const seed = (i)=> Math.sin(i*12.9898)*43758.5453 % 1;   // cheap deterministic per-plate variation
  for(let i=0;i<SHATTER_PLATES;i++){
    const a0 = (i/SHATTER_PLATES)*Math.PI*2;
    const a1 = ((i+1)/SHATTER_PLATES)*Math.PI*2;
    const gap = 0.05 + 0.03*Math.abs(seed(i));          // angular gap between plates (the glowing fissure)
    const rIn  = reach*(0.18 + 0.05*Math.abs(seed(i+3)));// plates start a bit out from the hot core
    const rOut = reach*(0.80 + 0.20*Math.abs(seed(i+7)));// ragged outer edge
    const ax0 = a0+gap, ax1 = a1-gap;
    // dark fractured rock plate (top surface) over the glow
    ctx.beginPath();
    ctx.moveTo(Math.cos(ax0)*rIn, Math.sin(ax0)*rIn);
    ctx.lineTo(Math.cos(ax0)*rOut, Math.sin(ax0)*rOut);
    const mid=(ax0+ax1)/2, rMid=rOut*(0.9+0.14*Math.abs(seed(i+5)));  // jagged mid point on the outer edge
    ctx.lineTo(Math.cos(mid)*rMid, Math.sin(mid)*rMid);
    ctx.lineTo(Math.cos(ax1)*rOut, Math.sin(ax1)*rOut);
    ctx.lineTo(Math.cos(ax1)*rIn, Math.sin(ax1)*rIn);
    ctx.closePath();
    ctx.fillStyle = i%2 ? 'rgba(44,38,34,'+(0.92*g)+')' : 'rgba(58,50,44,'+(0.92*g)+')';
    ctx.fill();
    // bright molten rim on the leading (outer) edge of each plate — hot light catching the broken lip
    ctx.strokeStyle = 'rgba(255,170,60,'+(0.75*g)+')';
    ctx.lineWidth = Math.max(1, 2.4*g);
    ctx.beginPath();
    ctx.moveTo(Math.cos(ax0)*rOut, Math.sin(ax0)*rOut);
    ctx.lineTo(Math.cos(mid)*rMid, Math.sin(mid)*rMid);
    ctx.lineTo(Math.cos(ax1)*rOut, Math.sin(ax1)*rOut);
    ctx.stroke();
  }

  // (3) RADIAL FISSURE LINES in the gaps between plates — bright molten cores so the "glow from
  //     within" reads as light bursting up through the cracks all the way around.
  for(let i=0;i<SHATTER_PLATES;i++){
    const a=(i/SHATTER_PLATES)*Math.PI*2;
    const len=reach*(0.9+0.1*Math.abs(seed(i+1)));
    const jx=Math.cos(a), jy=Math.sin(a);
    const line=(w,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(jx*reach*0.12, jy*reach*0.12); ctx.lineTo(jx*len, jy*len); ctx.stroke(); };
    line(Math.max(3,5*g), 'rgba(255,120,30,'+(0.55*g)+')');   // outer hot halo
    line(Math.max(1.5,2.4*g),'rgba(255,235,150,'+(0.95*g)+')');// bright molten core
  }

  ctx.restore();   // end ground-plane squash

  // (4) FLUNG DEBRIS CHIPS kicked up out of the plane (not squashed) all around the ring.
  ctx.fillStyle='rgba(38,30,26,'+(0.8*g)+')';
  for(let i=0;i<SHATTER_CHIPS;i++){
    const a=(i/SHATTER_CHIPS)*Math.PI*2, r=reach*(0.55+0.4*Math.abs(seed(i*2)));
    const px2=Math.cos(a)*r, py2=Math.sin(a)*r*fy - (6+10*g)*Math.abs(seed(i+9));  // lift up off the ground
    const s=Math.max(2,4*g); ctx.fillRect(px2, py2, s, s);
  }
  ctx.restore();
}

// bigFoot (0..1): enlarges the foot into a BIG detailed boot for the stomp (Battletoads smash).
// twinkle (-1..1): toe wiggle during the stomp's half-beat hold.
function drawLegPix(L, far, bigFoot, twinkle, view, tilt, stomp, v3){
  v3 = !!v3;   // PETE 3.0 glow-up gate (ORIGINAL leg SHAPE preserved — v3 adds shading richness only)
  const fill=far?(v3?P_SKINF3:P_SKINF):(v3?P_SKIN3:P_SKIN);
  const sh  =far?(v3?P_SKINFS3:P_SKINFS):(v3?P_SKINS3:P_SKINS);
  const out=P_OUT, hi=far?(v3?P_SKINF3:P_SKIN):(v3?P_SKINH3:P_SKINH);
  const AO=v3?P_AO3:sh, RIM=v3?P_RIM3:hi;
  // STICK FIX (3rd report — ROOT CAUSE, not another gate): the thin "stick" poking off the foot
  // was NOT the calf. It was the ANKLE WEDGE that drawCodeStompFoot drew from the KNEE (legJoint)
  // down to the ankle — a skin quad that tapers to a thin ~2.4u point at the knee, so it poked out
  // ABOVE the giant foot's silhouette during the lift/apex. The two prior fixes gated this calf
  // pxBone (first on the whole stomp, then on bigFoot>0.12), which is a DIFFERENT draw call, so the
  // wedge stick survived every time. The wedge is now REMOVED in drawCodeStompFoot, and the leg
  // keeps Pete's ORIGINAL pixel-art graphics UNCHANGED (thigh + calf drawn with the usual pxBone in
  // every phase). The giant foot is drawn frontmost and anchored at the ankle; its large mass sits
  // OVER the lower leg at the grown phases (so no normal-scale remnant pokes out), while at the
  // grounded start/end (rest-size foot) the full original thigh+calf+foot read correctly. No gate
  // on the calf — the original leg art is always drawn, so start/lift/slam all keep Pete's style.
  // PROP group 4 — LEG half-widths (DRAW ONLY): thigh 2.7->2.3, calf 2.2->1.7. Keep near current
  // (toned, original Pete leg art). These are the ORIGINAL leg pixel-art widths — do NOT restyle them
  // away; only the giant stomp FOOT is the new graphic.
  pxBone(L.root, L.joint, 2.7,2.3, fill, sh, out);   // BUFF thigh (original Pete leg art)
  pxBone(L.joint, L.end,  2.2,1.7, fill, sh, out);   // calf (original Pete leg art) — always drawn, no stomp gate
  if(v3 && !(bigFoot||stomp)){
    // ---- v3 LEG GLOW-UP: AO in the knee crease + rim on the thigh's lit side (shape UNCHANGED) ----
    px(L.joint.x-2, L.joint.y-1, 3, 2, AO);          // knee-crease AO
    px(L.root.x-3,  L.root.y-1, V3_RIM_W, 5, RIM);   // upper-thigh rim pop
  }
  // GIANT STOMP = the CODE-DRAWN cel foot (drawCodeStompFoot), anchored to this leg's ankle bone
  // (L.end) and oriented by the real foot bone (L.joint = knee for the ankle wedge). `tilt` (0..1,
  // = pose._footTilt) drives the HEEL-PIVOT roll (0 flat/side on the ground -> 1 sole-up apex);
  // `bigFoot` drives the 1:1 -> FOOT_GIANT_SCALE growth; `twinkle` gates the toe wiggle + gleam.
  // Works in every view (it rides the ankle, not a view-specific sprite), so no front/turn gate.
  // DRAW-ON-TOP (refinement 4): don't paint the giant foot here (it would sit UNDER the torso/

// outPush: screen-x nudge applied to the FAR arm only, so the back arm peeks OUT past the
// (slimmer) torso instead of being swallowed by it. Reduces far-arm obscurity while keeping
// the solver's socket math (CharacterLab 1 movement) untouched.
function drawArmPix(A, far, jacket, outPush, bigFist, v3, noHand){
  v3 = !!v3;   // PETE 3.0 glow-up gate
  // v3 skin ramp (near/far split preserved: far stays darker). Rim pops the upper-left limb edge;
  // AO deepens the elbow crease + where the arm meets the torso.
  const skin  =far?(v3?P_SKINF3:P_SKINF):(v3?P_SKIN3 :P_SKIN);
  const skinSh=far?(v3?P_SKINFS3:P_SKINFS):(v3?P_SKINS3:P_SKINS);
  const skinHi=far?(v3?P_SKINF3:P_SKIN):(v3?P_SKINH3:P_SKINH);
  const out=P_OUT;
  const AO=v3?P_AO3:skinSh, RIM=v3?P_RIM3:skinHi;
  const pushed = far && outPush;
  if(pushed){ ctx.save(); ctx.translate(outPush, 0); }
  if(jacket){

    const lj =far?(v3?P_LJS3:P_LJS):(v3?P_LJ3:P_LJ);
    const ljs=far?(v3?'#2e1a0a':'#3a2410'):(v3?P_LJS3:P_LJS);

    pxBone(A.root, A.joint, 2.5,1.9, skin, skinSh, out);   // BUFF upper arm (bicep)
    pxBone(A.joint, A.end,  1.9,1.4, skin, skinSh, out);   // forearm

      // engine), so they ride the limb through rotation.

      px(A.root.x-3, A.root.y-2, V3_RIM_W, 4, RIM);        // bicep upper rim pop
    }
    if(noHand){ /* BIG HAND drawn on top replaces the small hand */ }
    else if(bigFist){

      // outline, lit top, shaded underside, and 3 defined knuckle ridges driving upward.
      const fx=A.end.x, fy=A.end.y;

      px(fx-6, fy-7, 14,14, skin);         // fist mass
      px(fx-6, fy-7, 14,4, skinHi);        // lit top (facing up along the punch)
      px(fx-6, fy+3, 14,4, skinSh);        // shaded underside
      px(fx-6, fy-7, 4,14, skinHi);        // lit leading edge
      // knuckle ridges (3) across the top of the fist
      px(fx-4, fy-8, 3,4, skinSh); px(fx+1, fy-8, 3,4, skinSh); px(fx+6, fy-8, 3,4, skinSh);
      px(fx-4, fy-8, 3,1, skinHi); px(fx+1, fy-8, 3,1, skinHi); px(fx+6, fy-8, 3,1, skinHi);
    } else {
      px(A.end.x-5, A.end.y-5, 12,12, out);
      px(A.end.x-4, A.end.y-4, 9,9, skin);
      px(A.end.x-4, A.end.y+2, 9,3, skinSh);                 // knuckle shade
    }
  }

}
// DUMMY — the bare skeleton shown as a plain neutral mannequin outline (no character art).

function drawDummy(SK, view, o){

       px(SK.footNear.ankle.x-3,SK.footNear.ankle.y-1,RIG.foot+RIG.toe+3,5,OUT); }},

// ---- FRONT LAYER (6.0): the giant stomp foot + uppercut BIG HAND (and its impact FX) are the frontmost things Pete draws.
// drawLegPix / drawCharacter stash them in _pendingGiantFoot / _pendingBigHand. With o.deferFront the paint is held until
// flushFront() (called by drawPlatformer at the right z-slot, see there); otherwise they paint at the end of drawCharacter
// exactly like the lab (cutscene, title, skill-tree sheet, tumble, descent).
let _frontCtm=null;                       // canvas transform captured at the end of drawCharacter (rig-local, flipped, scaled)
function paintFront(){
  if(_pendingGiantFoot){ const g=_pendingGiantFoot; _pendingGiantFoot=null; drawCodeStompFoot(g.fx, g.fy, g.bigFoot, g.tw, g.tilt, g.legJoint, 0, false); }
  if(_pendingBigHand) drawPendingBigHand(false);

function resetFront(){ _frontCtm=null; _pendingGiantFoot=null; _pendingBigHand=null; }
function flushFront(){

function drawCharacter(pose,o){

  SK.lastDir = (pete && pete.lastDir) || 'D';
  if(o.char==='dummy'){ drawDummy(SK, view, o); return; }   // plain mannequin on the bare skeleton
  const PETE_V3=false;   // the game draws the base Pete (the lab's "Pete 3.0" glow-up is lab-only)

  const items=o.items||new Set(); const jk=items.has('jacket');

  const _bp=SK.pose||{};
  const _bhG=(HAND_BIG_ENABLED && _bp._strikeArm==='far' && _bp._handScale>0) ? _bp._handScale : 0;
  const _bhX=(HAND_BIG_ENABLED && _bp._strikeArm==='far' && (_bp._hit>0 || _bp._cloud>0));   // CRUNCH / clouds can outlast the big hand by a few frames
  const hideFarHand=_bhG>0 && (bigHandUnit(_bhG)/HAND_REST_UNIT)>HAND_HIDE_SMALL_AT;

  //   front        = drawn LAST, over everything incl. the head: D (right), S (toward), idle,
  //                  and W (away) — on W Pete faces away so her back + tail read as the TOP layer.
  //   midBehindHead= drawn AFTER the body/arms but BEFORE Pete's head: A (back-left). This lifts
  //                  her out from behind the torso so she's clearly visible on the back shoulder,
  //                  while Pete's head still occludes her top (she stays "behind the head").
  const dir = (SK.pose && SK.pose._dir) || null;
  const catFront = (dir==='D' || dir==='S' || dir==='W' || dir==null);  // top layer (incl. W)
  const catBehindAll = (dir==='A');       // A: Biscuit is BEHIND Pete's whole body (drawn first)
  // KICK flags (default off): _strikeLeg ('near'|'far') redraws the kicking leg ON TOP so the
  // extended foot reads; _bigFoot (0..1) enlarges that foot into the giant stomp boot; _twinkle
  // drives the toe wiggle. Which leg carries the big foot = the strike leg.
  const kLeg = SK.pose && SK.pose._strikeLeg;
  const kBig = (SK.pose && SK.pose._bigFoot) || 0;
  const kTwk = (SK.pose && SK.pose._twinkle) || 0;
  const kTilt = (SK.pose && SK.pose._footTilt) || 0;
  const kStomp = !!(SK.pose && SK.pose._stomp);   // stomp pose => draw the ankle-anchored CEL foot through ALL phases (incl. grounded start/end), so there's no pop between the blocky foot and the giant cel foot
  const nearBig = kLeg==='near' ? kBig : 0, farBig = kLeg==='far' ? kBig : 0;
  const nearStomp = kStomp && kLeg==='near', farStomp = kStomp && kLeg==='far';
  if(o.cat && catBehindAll) drawCatRig(SK, view);   // behind everything (before the far arm)

  // ---- BACK arm + leg (behind the torso). The FAR-side arm (away from camera) draws BEHIND

  //      Nudge the far arm OUTWARD (away from body center) so it peeks past the slimmer torso
  //      instead of being hidden — reduces far-arm obscurity. Direction = the far shoulder's
  //      own side; magnitude is small so the near arm still clearly reads in front. ----
  const farSide = Math.sign((SK.shFar.x - SK.shoulderMid.x)) || -1;  // which side the back arm is on
  const farPush = farSide * 4;                                       // ~4px outboard peek

  // stomp grounded start/end (_legFront): the strike leg is NOT redrawn on top, so draw it here, behind the
  // near leg, with the same lit skin tone the on-top redraw uses (no tone pop at the switch; layering is the only change)
  const nearLegFront = !!(SK.pose && SK.pose._legFront);

  drawLegPix(SK.legNear, false, nearBig, kTwk, view, kTilt, nearStomp, PETE_V3);

  // ---- TORSO: bare muscular chest, + brown leather jacket when the 'jacket' item is equipped ----
  drawTorsoPix(SK, view, jk);

  // ---- GROIN: nude base body gets a soft censor blur; the WHITE polka-dot boxers are an

  drawArmPix(SK.armNear, false, jk, 0, false, PETE_V3);

  // the near guard arm but UNDER the head, so the face is never covered by the rising arm. 'behind' skips the on-top redraw
  // below. No flag = every other move is unchanged.
  const _armLayer = SK.pose && SK.pose._armLayer;
  if(_armLayer==='beforeHead' && SK.pose._strikeArm==='far') drawArmPix(SK.armFar, false, jk, 0, !!SK.pose._bigFist, PETE_V3, hideFarHand);

  //      always reads clearly, regardless of the usual near/far depth sort. 'near' or 'far'

  const sa = SK.pose && SK.pose._strikeArm;

  else if(sa==='near') drawArmPix(SK.armNear, false, jk, 0, bigFist, PETE_V3);
  else if(sa==='far') drawArmPix(SK.armFar, false, jk, 0, bigFist, PETE_V3, hideFarHand);   // draw far arm un-pushed, in front, as the strike

  // ---- STRIKE-LEG OVERRIDE (kicks/stomps): redraw the KICKING leg ON TOP so the extended foot
  //      (and the giant stomp boot) always reads clearly over the body. 'near' or 'far'. ----
  // stomp grounded start/end (nearLegFront): keep the support (near) leg in front, skip the strike-leg redraw
  if(nearLegFront){ /* near leg already drawn in front of the far leg above; far leg + its cuff stay behind */ }
  else if(kLeg==='near') drawLegPix(SK.legNear, false, nearBig, kTwk, view, kTilt, nearStomp, PETE_V3);
  else if(kLeg==='far') drawLegPix(SK.legFar, false, farBig, kTwk, view, kTilt, farStomp, PETE_V3);   // far leg drawn in front as the strike
  // The strike-leg redraw above paints bare thigh OVER the boxers, exposing the upper thigh during
  // kicks. If boxers are worn, re-draw that leg's boxer cuff on top so the shorts keep covering the
  // upper thigh through the whole kick, in every direction.
  if(items.has('boxers') && kLeg && !nearLegFront){
    drawBoxerCuff(SK, kLeg==='near' ? SK.legNear : SK.legFar, PETE_V3);
  }

  // (Pete facing away) this puts her back + tail on the TOP layer. (6.0: she is drawn through the stomp too; the giant
  // foot is deferred and painted after her, so it is still frontmost.)
  if(o.cat && catFront) drawCatRig(SK, view);

  if(_bhG>0 || _bhX){

      hit:_bp._hit||0, cloud:_bp._cloud||0, ilift:_bp._cloudLift||0, flip:flip, st:_bp._stretch||1, tilt:flip?-a:a, facing:flip?-1:1 };
    if(_bp._cloud>0 || _bp._hit>0){   // model-space offset from the current fist back to where it was at the impact (screen-aligned axes)

      _pendingBigHand.ix=(ref.x-A.end.x)*(flip?-1:1); _pendingBigHand.iy=(ref.y+ref.plant)-(A.end.y+plantNow); }

// BASE BODY is NUDE: a small soft CENSOR BLUR over the groin (no boxers drawn on the base).

// ONE leg's boxer leg-tube (upper-thigh coverage), factored out so it can be RE-DRAWN over a

// shorts — see drawCharacter's strike-leg override). Follows the hip->knee bone, so it tracks the
// leg through any kick in any direction.
function drawBoxerCuff(SK, L, v3){
  v3 = !!v3;
  const BX=v3?P_BOX3:P_BOX, BXs=v3?P_BOXS3:P_BOXS;       // v3 crisper white + cooler fabric shade
  const p=SK.pelvis, r=L.root, j=L.joint;
  const ux=j.x-r.x, uy=j.y-r.y;                           // along the thigh (hip -> knee)
  const ex=r.x+ux*0.74, ey=r.y+uy*0.74;                  // hem LOWER down the thigh
  const sx=r.x+(p.x-r.x)*0.30, sy=r.y+(p.y-r.y)*0.30;    // start up under the band
  pxBone({x:sx,y:sy},{x:ex,y:ey}, 3.3,2.9, BX, BXs, P_OUT);   // base fabric + outline
  const nx=-uy, ny=ux, nl=Math.hypot(nx,ny)||1;          // thigh normal (outer side)

  px(ex-3, ey-1, 6, 2, BXs);                             // defined hem band (shade)
  px(ex-3, ey-2, 6, 1, P_WHITE);                         // lit edge above the hem

// WHITE boxers w/ RED polka dots — EQUIPPABLE ITEM. Full waistband (body-width-derived) + leg

function drawBoxers(SK, view, v3){

  const BX=v3?P_BOX3:P_BOX, BXs=v3?P_BOXS3:P_BOXS;   // v3 crisper fabric ramp

  // LEG graphics take over and run well down the thigh. The band is a small defined strip; the
  // legs are the bulk of the garment and are drawn with the SAME clarity (crisp outline + lit
  // ridge + shade) so the two read as one well-defined piece, not a jarring mismatch.

  //      defined fabric that hugs the thigh (bone half-width ~2.7->2.3) with a thin cloth margin.

// pixel head: big detailed 16-bit face (like the hero ref) — expressive eyes with a glint,

    // SAME well-defined eye in every view (bold rim, clean white field, crisp pupil + glint —
    // the reference-art look). The only difference on the FRONT/S (toward-camera) view is the

const BASE={ bodyY:0,hipShift:0,lean:4,sep:1,turn:0,

// (legacy front-only poseIdle removed — idle now holds the last direction via poseIdleDir below.)
function poseJumpCrouch(k){ const e=ease(clamp(k,0,1));   // smooth ease-in-out: builds into the gather, no snap

    // body. Keep the thighs near-vertical (small hip fold) and bend mostly at the KNEE so the
    // shins angle to keep the feet roughly UNDER/PLANTED while the pelvis drops — reads as a real
    // squat/load, not a tuck.
    bodyY: 34*e,                                   // pelvis drops deep toward the planted feet
    lean: 4 + 18*e,                                // fold forward over the planted legs
    nearHip: 20*e, farHip: 20*e,                   // thighs only lean forward a little (knees over toes)
    nearKnee: -(24+70*e), farKnee: -(24+70*e),     // deep KNEE bend carries the squat (feet stay down)

    nearEl: 44 - 6*e, farEl: 44 - 6*e,             // elbows stay bent (~40°), forearms low

// 2) TAKEOFF / POWER STRETCH — explosive extension. Legs SNAP straight (double-footed push),
//    hips drive up, spine EXTENDS, and BOTH arms swing powerfully UP & FORWARD in a wide arc.
//    Toes point down, slight forward lean for the SF arc. Body STRETCHES tall. k: 0->1.
function poseJumpTakeoff(k){ const e=ease(clamp(k,0,1));   // smooth: springs OUT of the gather, no snap

  // crouch -> takeoff transition is continuous — the drive builds out of the loaded squat.
  return P({ view:'side',
    bodyY: 34 - 46*e,                              // from deep gather (pelvis low, 34) driving UP past neutral
    lean: 22 - 16*e,                               // unfold from the forward gather to tall
    // TRIPLE EXTENSION: knees + hips drive from the deep load to nearly straight (feet push off floor)
    nearHip: 20 - 16*e, farHip: 20 - 18*e,         // thighs return toward vertical as he extends
    nearKnee: -(94) + 82*e, farKnee: -(94) + 82*e, // knees spring from the deep load to near-lockout
    // arms swing forward & LOW past the knees -> UP overhead (long-jump arm action). Elbows stay
    // BENT the whole arc (never straight) so it reads athletic, not a jumping-jack.
    nearSh: -24 + 150*e, farSh: -24 + 150*e,       // from low-back, sweep forward-low then up
    nearEl: 44 - 8*e, farEl: 44 - 8*e,             // keep ~40° elbow bend through the swing
    _stretch: (1-0.18) + 0.40*e,                   // start SQUASHED (matches gather) -> STRETCH tall at launch
    _jump:true }); }

function jabIdleBlend(p){ const b=_jabBlend; if(!b) return p; const e=(perf2-b.at)/JAB_IDLE_BLEND_MS;

  if(tt<0.16){const k=ease(tt/0.16);                 // CHAMBER: drop into a quick loaded bounce, fist tight at the face

// 2) CROSS — REAR (near) power hand. BIG pull-back/coil (deep twist back, weight loads onto the

    sh=lerp(58,40,k); el=lerp(74,100,k); lean=lerp(4,-11,k); hip=lerp(0,-16,k); tw=lerp(0,-52,k); st=lerp(1,0.94,k);

  else if(tt<0.50){const k=ease((tt-0.28)/0.22);     // DRIVE: EXPLOSIVE — rear foot pivots, hips whip through
    sh=lerp(40,96,k); el=lerp(100,2,k); lean=lerp(-11,20,k); hip=lerp(-16,16,k); tw=lerp(-52,52,k); st=lerp(0.94,1.16,k);
    gSh=lerp(GUARD.farSh-30,GUARD.farSh-10,k); gEl=lerp(GUARD.farEl-22,GUARD.farEl,k);   // guard snaps back up

  else{const k=ease((tt-0.50)/0.50);                 // unwind + recover to centered guard
    sh=lerp(96,58,k); el=lerp(2,74,k); lean=lerp(20,4,k); hip=lerp(16,0,k); tw=lerp(52,0,k); st=lerp(1.16,1,k);
    gSh=lerp(GUARD.farSh-10,GUARD.farSh,k); gEl=GUARD.farEl;
    rearHip=lerp(28,10,k); leadHip=lerp(-16,-8,k); rearKnee=lerp(-4,-10,k); leadKnee=lerp(-5,-6,k); }
  return P({ view:'side', lean, hipShift:hip, twist:tw, _stretch:st, _strikeArm:'near',
    nearSh:sh, nearEl:el, farSh:gSh, farEl:gEl,
    nearHip:rearHip, nearKnee:rearKnee, farHip:leadHip, farKnee:leadKnee }); }   // near=rear power leg, far=lead

// 3) SUPER UPPERCUT (Shoryuken) — SLOWER, with a VERY DEEP crouch-load (near-full knee bend) before
//    the explosive rising punch + jump. Deep coil (fist low) -> explode UP w/ spiral turn -> apex -> land.
// SHORYUKEN TIMING (per SF refs): a DELIBERATE coil/load (feels a touch slow, winding), then the
// POWER punches THROUGH on an explosive, front-loaded launch (fastest on the first frames), then
// the rise/spin and hang. Legs make a SOLID athletic crouch — asymmetric: the REAR (near, power)

function poseUpperV1(tt){ let sh,el,lean,tw,yaw,st,hipA,fHip,nKnee,fKnee,by,plant,big,sup;

    hipA=lerp(-16,-20,k); nKnee=lerp(-58,-70,k);       // REAR slides a touch further back, knee loads MORE but foot STAYS DOWN

    hipA=lerp(-20,0,k);  nKnee=lerp(-70,-8,k);         // rear leg drives straight from the (now shallower) planted load
    by=lerp(22,-8,k); plant=(k<0.2); sup=null; big=true; }  // launches off the floor; stop pinning the rear foot
